<title>SHO Cue Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one big cue card centre-stage, coloured by Bahagian using safety-sign hues; controls dock below. */
:root {
  --bg: #F3F1FA;
  --bg-dot: #DCD7EE;
  --ink: #1C1830;
  --ink-soft: #5B5575;
  --card: #FFFFFF;
  --card-edge: #1C1830;
  --panel: #F6F4FC;
  --verb: #FFFBEF;
  --verb-edge: #E9DFC0;
  --chip: #FFFFFF;
  --focus: #0057B8;
  --hue: #FFC72C;
  --hue-ink: #1C1830;
  --new: #009A44;
  --amend: #E4312B;
  --f-display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-law: "Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15121F; --bg-dot: #2A2540; --ink: #F2EFFA; --ink-soft: #ABA4C6; --card: #221D33; --card-edge: #0B0912;
  --panel: #2A2440; --verb: #2B2618; --verb-edge: #4A4026; --chip: #2A2440; --focus: #7FB2FF; --new: #3DD17C; --amend: #FF6B60;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15121F; --bg-dot: #2A2540; --ink: #F2EFFA; --ink-soft: #ABA4C6; --card: #221D33; --card-edge: #0B0912;
  --panel: #2A2440; --verb: #2B2618; --verb-edge: #4A4026; --chip: #2A2440; --focus: #7FB2FF; --new: #3DD17C; --amend: #FF6B60;
  color-scheme: dark }

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.2px, transparent 1.3px);
  background-size: 18px 18px;
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.sign { width: 46px; height: 46px; flex: none; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.4rem, 4.5vw, 2rem); line-height: 1; margin: 0; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-size: .9rem; }

/* filters */
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.fchip { flex: none; font: 700 .8rem/1 var(--f-body); border: 2px solid var(--card-edge); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.fchip .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--card-edge); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.fchip:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* card */
.stage { position: relative; perspective: 1400px; }
.card {
  background: var(--card); border: 3px solid var(--card-edge); border-radius: 22px;
  box-shadow: 7px 7px 0 var(--card-edge); overflow: hidden; position: relative;
  transform-origin: 50% 100%;
}
.card.deal { animation: deal .45s cubic-bezier(.2,.9,.25,1.25); }
@keyframes deal { from { transform: translateY(26px) rotate(-3deg) scale(.96); opacity: .3; } to { transform: none; opacity: 1; } }
.card.out-l { animation: outl .22s ease-in forwards; }
.card.out-r { animation: outr .22s ease-in forwards; }
@keyframes outl { to { transform: translateX(-60px) rotate(-6deg); opacity: 0; } }
@keyframes outr { to { transform: translateX(60px) rotate(6deg); opacity: 0; } }

.top { background: var(--hue); color: var(--hue-ink); padding: 18px 22px 16px; position: relative; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
  background: repeating-linear-gradient(-45deg, var(--hue-ink) 0 10px, transparent 10px 20px); opacity: .9; }
.toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.part { font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.ref { font-family: var(--f-display); font-size: clamp(2.6rem, 11vw, 4.4rem); line-height: .95; margin: 8px 0 6px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.ref small { font-size: .42em; letter-spacing: 0; opacity: .8; margin-right: .1em; }
.title { font-weight: 700; font-size: 1.05rem; margin: 0 0 12px; text-wrap: balance; max-width: 40ch; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-weight: 700; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 2px solid var(--hue-ink); background: rgba(255,255,255,.88); color: #1C1830; }

.body { padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 18px; }
.label { font-weight: 700; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.label::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--hue); border: 2px solid var(--card-edge); }
.gist { font-size: 1.22rem; line-height: 1.45; font-weight: 700; margin: 0; max-width: 62ch; }
.verb { background: var(--verb); border: 2px dashed var(--verb-edge); border-radius: 14px; padding: 14px 16px; font-family: var(--f-law); font-size: 1rem; line-height: 1.62; max-height: 46vh; overflow-y: auto; }
.verb p { margin: 0 0 .6em; max-width: 68ch; }
.verb p:last-child { margin-bottom: 0; }
.verb p.ind { padding-left: 1.4em; }
.verb b { font-weight: 600; color: var(--ink); }

.cover { position: relative; }
.veil { position: absolute; inset: -4px; border-radius: 14px; border: 2px solid var(--card-edge);
  background: repeating-linear-gradient(45deg, var(--panel) 0 14px, var(--bg) 14px 28px);
  display: grid; place-items: center; cursor: pointer; font: 700 .95rem var(--f-body); color: var(--ink); z-index: 2; }
.veil span { background: var(--card); border: 2px solid var(--card-edge); border-radius: 999px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--card-edge); }
.cover.hidden-ans > :not(.veil) { visibility: hidden; }
.cover.hidden-ans { min-height: 64px; }

/* dock */
.dock { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.btn { font: 700 1rem var(--f-body); border: 3px solid var(--card-edge); background: var(--card); color: var(--ink); border-radius: 16px; padding: 12px 16px; cursor: pointer; box-shadow: 4px 4px 0 var(--card-edge); transition: transform .08s, box-shadow .08s; min-height: 52px; }
.btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--card-edge); }
.btn.big { background: var(--hue); color: var(--hue-ink); font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; letter-spacing: .02em; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.big svg { width: 26px; height: 26px; }
.btn.big.roll svg { animation: roll .5s ease-out; }
@keyframes roll { from { transform: rotate(-360deg) scale(.6); } to { transform: none; } }

.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.tgl { font: 700 .85rem var(--f-body); border: 2px solid var(--card-edge); background: var(--chip); color: var(--ink); border-radius: 12px; padding: 8px 12px; cursor: pointer; }
.tgl[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.jump { display: flex; gap: 8px; align-items: center; background: var(--card); border: 3px solid var(--card-edge); border-radius: 16px; padding: 6px 6px 6px 14px; box-shadow: 4px 4px 0 var(--card-edge); }
.jump label { font-weight: 700; font-size: .9rem; white-space: nowrap; }
.jump input { flex: 1; min-width: 0; font: 700 1rem var(--f-body); padding: 9px 12px; border: 2px solid var(--card-edge); border-radius: 12px; background: var(--chip); color: var(--ink); }
.jump button { flex: none; font: 700 .95rem var(--f-body); padding: 9px 14px; border: 2px solid var(--card-edge); border-radius: 12px; background: var(--ink); color: var(--bg); cursor: pointer; }
.hint { color: var(--ink-soft); font-size: .8rem; margin: 0; text-align: center; }
.empty { padding: 40px 22px; text-align: center; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; }
.toast.on { opacity: 1; transform: translateX(-50%); }

@media (max-width: 480px) {
  .top { padding: 16px 16px 16px; }
  .body { padding: 18px 16px 20px; }
  .gist { font-size: 1.08rem; }
  .btn { padding: 10px 12px; }
}
@media (prefers-reduced-motion: reduce) { .card.deal, .card.out-l, .card.out-r, .btn.big.roll svg { animation: none; } }

/* deck switch */
.decks { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 3px solid var(--card-edge); border-radius: 16px; overflow: hidden; box-shadow: 4px 4px 0 var(--card-edge); background: var(--chip); }
.deckbtn { font: 700 .95rem/1.2 var(--f-body); border: 0; background: transparent; color: var(--ink); padding: 11px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.deckbtn + .deckbtn { border-left: 3px solid var(--card-edge); }
.deckbtn small { font-weight: 400; font-size: .78rem; color: var(--ink-soft); }
.deckbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.deckbtn[aria-pressed="true"] small { color: var(--bg); opacity: .8; }
.fsep { flex: none; width: 2px; background: var(--card-edge); opacity: .3; margin: 4px 4px; border-radius: 2px; }
.ref.acr { font-size: clamp(2.2rem, 10vw, 4rem); }
.ref.acr.long { font-size: clamp(1.5rem, 6.5vw, 2.6rem); line-height: 1.05; }
.src { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.src li { font-size: .85rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 2px solid var(--card-edge); background: var(--chip); }
.src li span { font-weight: 400; color: var(--ink-soft); }
.legend { margin: 6px 0 0; font-size: .82rem; color: var(--ink-soft); }
.expl { margin: 0; font-size: 1.02rem; line-height: 1.55; max-width: 62ch; }
.label.ex { margin-top: 14px; }
.example { margin: 0; font-family: var(--f-law); font-style: italic; font-size: 1rem; line-height: 1.55; background: var(--verb); border: 2px dashed var(--verb-edge); border-radius: 14px; padding: 10px 14px; max-width: 62ch; }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg class="sign" viewBox="0 0 46 46" aria-hidden="true"><path d="M23 3 44 41H2Z" fill="#FFC72C" stroke="var(--card-edge)" stroke-width="3" stroke-linejoin="round"/><text x="23" y="36" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-size="12" fill="#1C1830">SHO</text></svg>
      <div>
        <h1>Cue Cards <span id="deckName">Akta 514</span></h1>
        <p class="sub" id="deckSub">AKKP 1994 · cetakan semula 1 Jun 2024 · seksyen dipilih secara rawak</p>
      </div>
    </div>
  </header>

  <form class="jump" id="jumpForm" role="search">
    <label for="jumpIn">Lompat ke</label>
    <input id="jumpIn" placeholder="cth. 18A" autocomplete="off" enterkeyhint="go">
    <button type="submit">Pergi</button>
  </form>

  <div class="decks" role="group" aria-label="Pilih dek">
    <button class="deckbtn" id="deckAkta" data-m="akta" aria-pressed="true">Akta 514<small>264 kad seksyen</small></button>
    <button class="deckbtn" id="deckAkr" data-m="akr" aria-pressed="false">Akronim SHO<small>411 kad akronim</small></button>
  </div>

  <div class="filters" id="filters" role="group" aria-label="Tapis kad"></div>

  <div class="stage"><article class="card" id="card" aria-live="polite"></article></div>

  <div class="dock">
    <button class="btn" id="prev" aria-label="Kad sebelum">←</button>
    <button class="btn big" id="draw"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="2" width="22" height="22" rx="5" fill="var(--card)" stroke="currentColor" stroke-width="2.5"/><circle cx="8" cy="8" r="2" fill="currentColor"/><circle cx="18" cy="8" r="2" fill="currentColor"/><circle cx="13" cy="13" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/><circle cx="18" cy="18" r="2" fill="currentColor"/></svg>Cabut kad!</button>
    <button class="btn" id="next" aria-label="Kad seterusnya">→</button>
  </div>

  <div class="tools">
    <div class="toggles">
      <button class="tgl" id="quiz" aria-pressed="false">🙈 Mod kuiz</button>
      <button class="tgl" id="onlyNew" aria-pressed="false">2024 sahaja</button>
    </div>
  </div>
  <p class="hint">Papan kekunci: Space = cabut · ← → = undur/maju · K = kuiz · D = tukar dek. Leret kad di telefon.</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const PARTS = __PARTS__;
const CARDS = __CARDS__;
const ACRO = __ACRO__;
const HUES = {
  I:["#FFC72C","#1C1830"], II:["#FF7A45","#1C1830"], III:["#E4312B","#FFFFFF"], IV:["#0057B8","#FFFFFF"],
  V:["#00A3A3","#10202A"], VI:["#009A44","#FFFFFF"], VIA:["#9CD34A","#17240A"], VII:["#7A4FD6","#FFFFFF"],
  VIIA:["#C86BFF","#1C1830"], VIII:["#FF4F8B","#1C1830"], IX:["#B5121B","#FFFFFF"], X:["#3FA9F5","#0E1E2E"],
  XI:["#1B2A6B","#FFFFFF"], XII:["#F25C05","#1C1830"], XIII:["#2E8B57","#FFFFFF"], XIV:["#6C5B7B","#FFFFFF"],
  XV:["#FFB3C7","#1C1830"], J:["#FFE14D","#1C1830"]
};
const GROUPS = ["A–B","C–D","E–H","I–M","N–P","Q–S","T–Z"];
const GHUES = { "A–B":["#FF4F8B","#1C1830"], "C–D":["#FF7A45","#1C1830"], "E–H":["#FFC72C","#1C1830"], "I–M":["#9CD34A","#17240A"], "N–P":["#00A3A3","#10202A"], "Q–S":["#3FA9F5","#0E1E2E"], "T–Z":["#7A4FD6","#FFFFFF"] };
const SOURCES = [["Akta","Akta"],["M1","M1 · OSH Legislation"],["M2","M2 · Occupational Safety"],["M3","M3 · Occ. Health & Hygiene"],["M4","M4 · OSH Management"]];
const MOD = { M1: "OSH Legislation", M2: "Occupational Safety", M3: "Occupational Health & Hygiene", M4: "OSH Management" };
const PNAME = Object.fromEntries(PARTS);
CARDS.forEach((c, i) => { c.i = i; c.isNew = /\[BAHARU 2024\]/.test(c.gist); c.isAmend = /\[DIPINDA 2024\]/.test(c.gist); c.cleanGist = c.gist.replace(/\[(BAHARU|DIPINDA) 2024\]\s*/g, ""); });
ACRO.forEach((c, i) => {
  c.i = i;
  const s = c.s;
  const src = new Set();
  if (/Act/.test(s)) src.add("Akta");
  // "M2–M4" style ranges
  s.replace(/M(\d)\s*[–-]\s*M(\d)/g, (_, a, b) => { for (let k = +a; k <= +b; k++) src.add("M" + k); return ""; });
  (s.match(/M\d/g) || []).forEach(m => src.add(m));
  c.src = src;
});

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function mkState(key) {
  return { key, groups: new Set(store.get(key + "-parts", [])), srcs: new Set(store.get(key + "-srcs", [])), deck: [], history: [], hpos: -1 };
}
const STATE = { akta: mkState("a514"), akr: mkState("akr") };
let mode = store.get("cc-mode", "akta"); if (!STATE[mode]) mode = "akta";
let quiz = store.get("a514-quiz", false);
let onlyNew = false;
let revealed = { gist: false, verb: false };
const S = () => STATE[mode];
const LIST = () => mode === "akta" ? CARDS : ACRO;

const $ = id => document.getElementById(id);
const cardEl = $("card");

function pool() {
  const st = S();
  if (mode === "akta")
    return CARDS.filter(c => (st.groups.size === 0 || st.groups.has(c.p)) && (!onlyNew || c.isNew || c.isAmend));
  return ACRO.filter(c => (st.groups.size === 0 || st.groups.has(c.g)) && (st.srcs.size === 0 || [...st.srcs].some(x => c.src.has(x))));
}
function reshuffle() {
  const st = S();
  st.deck = pool().map(c => c.i);
  for (let i = st.deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [st.deck[i], st.deck[j]] = [st.deck[j], st.deck[i]]; }
}
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
function fmtVerb(paras) {
  return paras.map(p => {
    const t = esc(p);
    const m = t.match(/^(\(\d+[A-Z]?\)|\([a-z]{1,2}\)|\d+[A-Z]?\.)(\s|$)/);
    const ind = /^\([a-z]{1,2}\)/.test(t);
    const html = m ? `<b>${m[1]}</b>${t.slice(m[1].length)}` : t;
    return `<p${ind ? ' class="ind"' : ""}>${html}</p>`;
  }).join("");
}
function refHTML(c) {
  if (c.p === "J") return `<small>Jadual</small> ${esc(c.ref.split(" ")[1])}`;
  return `<small>s.</small>${esc(c.ref.slice(2))}`;
}
function srcHTML(s) {
  // split "M1 1.01, 1.03, M2 2.04, Act 514 (full)" into chips per source
  const chips = []; let cur = null;
  s.split(/,\s*/).forEach(tok => {
    const m = tok.match(/^(M\d(?:\s*[–-]\s*M\d)?|Acts?|All four Acts)\b\s*(.*)$/);
    if (m) { cur = { k: m[1], d: [m[2]].filter(Boolean) }; chips.push(cur); }
    else if (cur) cur.d.push(tok); else chips.push(cur = { k: tok, d: [] });
  });
  return chips.map(c => `<li>${esc(c.k)}${c.d.length ? ` <span>${esc(c.d.join(", "))}</span>` : ""}</li>`).join("");
}
function veil(key, label) { return `<button class="veil" data-r="${key}"><span>${label}</span></button>`; }

function render() {
  const st = S();
  const idx = st.history[st.hpos];
  if (idx === undefined) {
    document.documentElement.style.setProperty("--hue", "#FFC72C");
    document.documentElement.style.setProperty("--hue-ink", "#1C1830");
    cardEl.innerHTML = `<div class="empty">Tiada kad untuk tapisan ini.<br>Cuba buka tapisan lain.</div>`;
    return;
  }
  const hideG = quiz && !revealed.gist, hideV = quiz && !revealed.verb;
  let html;
  if (mode === "akta") {
    const c = CARDS[idx];
    const [hue, ink] = HUES[c.p];
    document.documentElement.style.setProperty("--hue", hue);
    document.documentElement.style.setProperty("--hue-ink", ink);
    const tags = [];
    if (c.isNew) tags.push('<span class="tag">Baharu 2024</span>');
    if (c.isAmend) tags.push('<span class="tag">Dipinda 2024</span>');
    const partLabel = c.p === "J" ? "Jadual-Jadual" : `Bahagian ${c.p} · ${PNAME[c.p]}`;
    html = `
    <div class="top">
      <div class="toprow">
        <div class="part">${esc(partLabel)}</div>
      </div>
      <div class="ref">${refHTML(c)}</div>
      <p class="title">${esc(c.title)}</p>
      <div class="tags">${tags.join("")}</div>
    </div>
    <div class="body">
      <section class="cover${hideG ? " hidden-ans" : ""}">
        ${hideG ? veil("gist", "Ketuk untuk intipati & contoh") : ""}
        <p class="label">Intipati</p>
        <p class="gist">${esc(c.cleanGist)}</p>
        <p class="label ex">Contoh</p>
        <p class="example">${esc(c.ex)}</p>
      </section>
      <section class="cover${hideV ? " hidden-ans" : ""}">
        ${hideV ? veil("verb", "Ketuk untuk teks Akta") : ""}
        <p class="label">Teks Akta (verbatim)</p>
        <div class="verb" tabindex="0">${fmtVerb(c.verbatim)}</div>
      </section>
    </div>`;
  } else {
    const c = ACRO[idx];
    const [hue, ink] = GHUES[c.g] || GHUES["A–B"];
    document.documentElement.style.setProperty("--hue", hue);
    document.documentElement.style.setProperty("--hue-ink", ink);
    const full = /\(full\)/.test(c.s) ? '<span class="tag">Akta guna istilah penuh</span>' : "";
    const mods = [...c.src].filter(x => MOD[x]).sort().map(x => `${x} = ${MOD[x]}`).join(" · ");
    html = `
    <div class="top">
      <div class="toprow">
        <div class="part">Akronim SHO · ${esc(c.g)}</div>
      </div>
      <div class="ref acr${c.a.length > 10 ? " long" : ""}">${esc(c.a)}</div>
      <p class="title">Apakah maksud akronim ini?</p>
      <div class="tags">${full}</div>
    </div>
    <div class="body">
      <section class="cover${hideG ? " hidden-ans" : ""}">
        ${hideG ? veil("gist", "Ketuk untuk maksud") : ""}
        <p class="label">Maksud</p>
        <p class="gist">${esc(c.m)}</p>
      </section>
      <section class="cover${hideV ? " hidden-ans" : ""}">
        ${hideV ? veil("verb", "Ketuk untuk penerangan & contoh") : ""}
        <p class="label">Penerangan</p>
        <p class="expl">${esc(c.x)}</p>
        <p class="label ex">Contoh</p>
        <p class="example">${esc(c.e)}</p>
      </section>
      <section>
        <p class="label">Sumber</p>
        <ul class="src">${srcHTML(c.s)}</ul>
        ${mods ? `<p class="legend">${esc(mods)}</p>` : ""}
      </section>
    </div>`;
  }
  cardEl.innerHTML = html;
  cardEl.classList.remove("deal"); void cardEl.offsetWidth; cardEl.classList.add("deal");
  cardEl.querySelectorAll(".veil").forEach(v => v.onclick = () => { revealed[v.dataset.r] = true; render(); });
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1600); }

function go(i) {
  const st = S();
  revealed = { gist: false, verb: false };
  st.history = st.history.slice(0, st.hpos + 1); st.history.push(i); st.hpos = st.history.length - 1;
  render();
}
function draw() {
  const st = S();
  if (!st.deck.length) { reshuffle(); if (st.deck.length && st.history.length) toast("Dek dikocok semula 🎉"); }
  if (!st.deck.length) { st.history = []; st.hpos = -1; render(); return; }
  const b = $("draw"); b.classList.remove("roll"); void b.offsetWidth; b.classList.add("roll");
  go(st.deck.pop());
}
function step(d) {
  const st = S();
  if (d < 0 && st.hpos > 0) { st.hpos--; revealed = { gist: true, verb: true }; render(); return; }
  if (d > 0 && st.hpos < st.history.length - 1) { st.hpos++; revealed = { gist: true, verb: true }; render(); return; }
  if (d > 0) draw(); else toast("Ini kad pertama anda");
}
function chip(attr, val, on, label, dot, title) {
  return `<button class="fchip" ${attr}="${esc(val)}" aria-pressed="${on}"${title ? ` title="${esc(title)}"` : ""}>${dot ? `<span class="dot" style="background:${dot}"></span>` : ""}${esc(label)}</button>`;
}
function buildFilters() {
  const f = $("filters"), st = S();
  let h = chip("data-g", "*", st.groups.size === 0 && st.srcs.size === 0, "Semua");
  if (mode === "akta") {
    h += PARTS.map(([k, n]) => chip("data-g", k, st.groups.has(k), k === "J" ? "Jadual" : "Bhg " + k, HUES[k][0], n)).join("");
  } else {
    h += GROUPS.map(g => chip("data-g", g, st.groups.has(g), g, GHUES[g][0])).join("");
    h += '<span class="fsep" aria-hidden="true"></span>';
    h += SOURCES.map(([k, n]) => chip("data-s", k, st.srcs.has(k), k, null, n)).join("");
  }
  f.innerHTML = h;
  f.querySelectorAll(".fchip").forEach(b => b.onclick = () => {
    const g = b.dataset.g, s = b.dataset.s;
    if (g === "*") { st.groups.clear(); st.srcs.clear(); }
    else if (g) { st.groups.has(g) ? st.groups.delete(g) : st.groups.add(g); }
    else if (s) { st.srcs.has(s) ? st.srcs.delete(s) : st.srcs.add(s); }
    store.set(st.key + "-parts", [...st.groups]); store.set(st.key + "-srcs", [...st.srcs]);
    buildFilters(); reshuffle(); draw();
  });
}
function setTgl(id, v) { $(id).setAttribute("aria-pressed", v); }
function setMode(m) {
  mode = m; store.set("cc-mode", m);
  setTgl("deckAkta", m === "akta"); setTgl("deckAkr", m === "akr");
  $("deckName").textContent = m === "akta" ? "Akta 514" : "Akronim SHO";
  $("deckSub").textContent = m === "akta" ? "AKKP 1994 · cetakan semula 1 Jun 2024 · seksyen dipilih secara rawak" : "411 akronim daripada Akta 302, 514, 835, 872 dan Modul 1–4 · maksud, penerangan dan contoh";
  $("onlyNew").hidden = m !== "akta";
  $("jumpIn").placeholder = m === "akta" ? "cth. 18A" : "cth. HIRARC";
  revealed = { gist: false, verb: false };
  buildFilters();
  if (S().hpos < 0) { reshuffle(); draw(); } else render();
}

$("draw").onclick = draw;
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("deckAkta").onclick = () => setMode("akta");
$("deckAkr").onclick = () => setMode("akr");
$("quiz").onclick = () => { quiz = !quiz; store.set("a514-quiz", quiz); setTgl("quiz", quiz); revealed = { gist: false, verb: false }; render(); toast(quiz ? "Mod kuiz: hidup" : "Mod kuiz: mati"); };
$("onlyNew").onclick = () => { onlyNew = !onlyNew; setTgl("onlyNew", onlyNew); reshuffle(); draw(); };
$("jumpForm").addEventListener("submit", e => {
  e.preventDefault();
  const raw = $("jumpIn").value.trim(); if (!raw) return;
  let hit;
  if (mode === "akta") {
    const q = raw.replace(/^s(ek(syen)?)?\.?\s*/i, "").toUpperCase().replace(/\s+/g, "");
    hit = CARDS.find(c => c.ref.toUpperCase().replace(/\s/g, "") === "S." + q) || CARDS.find(c => c.sec && (c.sec.toUpperCase() === q || c.ref.toUpperCase().startsWith("S." + q + "(")))
      || CARDS.find(c => c.p === "J" && c.ref.toUpperCase().includes(q));
  } else {
    const q = raw.toUpperCase().replace(/[.\s-]/g, "");
    const norm = a => a.toUpperCase().replace(/[.\s-]/g, "");
    hit = ACRO.find(c => norm(c.a) === q) || ACRO.find(c => c.a.toUpperCase().split(/\s*\/\s*/).some(p => norm(p) === q)) || ACRO.find(c => norm(c.a).startsWith(q)) || ACRO.find(c => c.m.toUpperCase().includes(raw.toUpperCase()));
  }
  if (hit) { go(hit.i); revealed = { gist: true, verb: true }; render(); $("jumpIn").blur(); }
  else toast(`"${raw}" tiada dalam dek ini`);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); draw(); }
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key.toLowerCase() === "k") $("quiz").click();
  else if (e.key.toLowerCase() === "d") setMode(mode === "akta" ? "akr" : "akta");
});
let tx = null, ty = null;
cardEl.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cardEl.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
});

setTgl("quiz", quiz);
setMode(mode);
</script>
