gkan apa-apa risiko kepada keselamatan atau kesihatan yang mungkin ditimbulkan oleh bahan itu."],"p":"V","ex":"Pengilang cat mengurangkan kandungan plumbum dalam produknya."},{"ref":"s.22(1)","sec":"22","title":"Huraian seksyen 20 dan 21","gist":"Tidak perlu mengulang ujian atau penyelidikan yang telah dibuat orang lain jika munasabah untuk bergantung pada keputusannya.","verbatim":["(1) Tiada apa-apa jua dalam seksyen 20 atau 21 boleh diertikan sebagai menghendaki seseorang mengulangi apa-apa ujian, pemeriksaan atau penyelidikan yang telah dijalankan selain daripada olehnya atau atas kehendaknya, setakat, yang munasabah baginya untuk bergantung pada keputusan ujian, pemeriksaan atau penyelidikan itu bagi maksud seksyen itu."],"p":"V","ex":"Pengimport bergantung pada ujian keselamatan pengilang luar negara dan tidak mengulanginya."},{"ref":"s.22(2)","sec":"22","title":"Huraian seksyen 20 dan 21","gist":"Kewajipan Bahagian ini hanya meliputi perkara dalam perniagaan atau aktiviti sendiri (untung atau tidak) dan dalam kawalannya.","verbatim":["(2) Apa-apa kewajipan yang dikenakan ke atas seseorang oleh mana-mana peruntukan Bahagian ini yang terdahulu daripada ini hendaklah hanya meliputi perkara-perkara yang dilakukan dalam perjalanan perdagangan, perniagaan atau apa-apa pengusahaan lain yang dijalankan olehnya, sama ada untuk mendapat keuntungan atau tidak, dan kepada perkara-perkara dalam kawalannya."],"p":"V","ex":"Kedai yang menjual semula mesin terpakai bertanggungjawab atas perkara dalam kawalannya sahaja."},{"ref":"s.22(3)","sec":"22","title":"Huraian seksyen 20 dan 21","gist":"Jika pembeli memberi aku janji bertulis untuk mengambil langkah keselamatan, kewajipan pembekal di bawah s.20(1)(a) dan s.21(1)(a) dikurangkan setakat yang munasabah.","verbatim":["(3) Jika seseorang mereka bentuk, merumuskan, mengilang, mengimport atau membekalkan apa-apa loji atau bahan bagi atau kepada orang lain berdasarkan aku janji bertulis oleh orang lain itu untuk mengambil langkah-langkah tertentu yang memadai untuk memastikan, setakat yang praktik, bahawa loji atau bahan itu selamat dan tanpa risiko kepada kesihatan apabila digunakan dengan sepatutnya, aku janji itu hendaklah mempunyai kesan membebaskan orang yang mula-mula disebut itu daripada kewajipan yang dikenakan oleh perenggan 20(1)(a) dan perenggan 21(l)(a) setakat yang munasabah memandangkan terma-terma aku janji itu."],"p":"V","ex":"Pembeli memberi aku janji bertulis untuk memasang pengadang tambahan sebelum menggunakan mesin."},{"ref":"s.22(4)","sec":"22","title":"Huraian seksyen 20 dan 21","gist":"Bagi sewa beli, jualan bersyarat atau jualan kredit, pembekal sebenar (bukan syarikat kewangan) yang menanggung kewajipan.","verbatim":["(4) Jika seseorang (kemudian daripada ini disebut “pembekal zahir”) membekalkan apa-apa loji atau bahan bagi kegunaan semasa bekerja kepada orang lain (kemudian daripada ini disebut “pelanggan”) di bawah perjanjian sewa-beli, perjanjian jualan bersyarat atau perjanjian jualan secara kredit, dan pembekal zahir itu—","(a) menjalankan perniagaan pembiayaan pemerolehan barang-barang oleh orang lain melalui perjanjian-perjanjian itu; dan","(b) dalam perjalanan perniagaan itu memperolehi kepentingannya dalam loji atau bahan yang dibekalkan kepada pelanggan itu sebagai cara pembiayaan pemerolehannya oleh pelanggan itu daripada pihak ketiga (kemudian daripada ini disebut “pembekal efektif”), pembekal efektif itu dan bukan pembekal zahir itu hendaklah dikira bagi maksud Bahagian ini membekalkan loji atau bahan itu kepada pelanggan itu, dan apa-apa kewajipan yang dikenakan oleh seksyen 20 dan 21 ke atas pembekal hendaklah dengan itu terletak pada pembekal efektif dan tidak pada pembekal zahir."],"p":"V","ex":"Bagi mesin yang dibeli secara sewa beli, syarikat pembekal mesin yang bertanggungjawab, bukan bank."},{"ref":"s.22(5)","sec":"22","title":"Huraian seksyen 20 dan 21","gist":"Penggunaan yang tidak mengikut maklumat atau nasihat pembekal tidak dianggap \"penggunaan betul\".","verbatim":["(5) Bagi maksud Bahagian ini sesuatu loji atau bahan tidaklah dikira sebagai digunakan dengan sepatutnya jika ia digunakan tanpa mengambil kira apa-apa maklumat atau nasihat yang relevan berhubungan dengan penggunaannya yang telah dijadikan tersedia oleh seseorang yang mereka bentuk, mengilang, mengimport atau membekalkannya."],"p":"V","ex":"Menggunakan tangga untuk kerja elektrik bertentangan dengan nasihat pengilang bukan penggunaan betul."},{"ref":"s.23","sec":"23","title":"Penalti bagi kesalahan di bawah seksyen 20 atau 21","gist":"[DIPINDA 2024] Penalti melanggar s.20 atau 21: hingga RM200,000 atau 2 tahun atau kedua-duanya (dahulu RM20,000).","verbatim":["Seseorang yang melanggar peruntukan seksyen 20 atau 21 adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi dua ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"V","ex":"Pembekal yang menjual bahan kimia tanpa SDS boleh didenda hingga RM200,000."},{"ref":"s.24(1)(a)","sec":"24","title":"Kewajipan am pekerja yang sedang bekerja","gist":"Pekerja mesti menjaga keselamatan dan kesihatan diri sendiri dan orang lain yang terjejas oleh perbuatan atau peninggalannya.","verbatim":["(1) Adalah menjadi kewajipan tiap-tiap pekerja yang sedang bekerja—","(a) untuk memberikan perhatian yang munasabah bagi keselamatan dan kesihatan dirinya dan orang lain yang mungkin terjejas oleh tindakan atau peninggalannya semasa bekerja;"],"p":"VI","ex":"Pekerja tidak bermain-main dengan forklift kerana boleh mencederakan rakan sekerja."},{"ref":"s.24(1)(b)","sec":"24","title":"Kewajipan am pekerja yang sedang bekerja","gist":"Bekerjasama dengan majikan atau orang lain dalam melaksanakan kewajipan di bawah Akta dan peraturan.","verbatim":["(1) Adalah menjadi kewajipan tiap-tiap pekerja yang sedang bekerja—","(b) untuk bekerjasama dengan majikannya atau mana-mana orang lain dalam menunaikan apa-apa kewajipan atau kehendak yang dikenakan ke atas majikan atau orang lain itu melalui Akta ini atau mana-mana peraturan yang dibuat di bawahnya;"],"p":"VI","ex":"Pekerja menghadiri latihan keselamatan dan latih amal kebakaran yang dianjurkan majikan."},{"ref":"s.24(1)(c)","sec":"24","title":"Kewajipan am pekerja yang sedang bekerja","gist":"Memakai atau menggunakan pada setiap masa kelengkapan atau pakaian pelindung (PPE) yang disediakan majikan.","verbatim":["(1) Adalah menjadi kewajipan tiap-tiap pekerja yang sedang bekerja—","(c) untuk memakai atau menggunakan pada sepanjang masa apa-apa kelengkapan atau pakaian perlindungan yang diadakan oleh majikan bagi maksud mencegah apa-apa risiko kepada keselamatan dan kesihatannya; dan"],"p":"VI","ex":"Pekerja binaan memakai topi keselamatan dan abah-abah sepanjang masa di tempat tinggi."},{"ref":"s.24(1)(d)","sec":"24","title":"Kewajipan am pekerja yang sedang bekerja","gist":"Mematuhi arahan atau langkah KKP yang ditetapkan majikan atau orang lain di bawah Akta.","verbatim":["(1) Adalah menjadi kewajipan tiap-tiap pekerja yang sedang bekerja—","(d) untuk mematuhi apa-apa arahan atau langkah tentang keselamatan dan kesihatan pekerjaan yang diperkenalkan oleh majikannya atau mana-mana orang lain melalui atau di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya."],"p":"VI","ex":"Pekerja mematuhi larangan merokok di kawasan penyimpanan LPG."},{"ref":"s.24(2)","sec":"24","title":"Kewajipan am pekerja yang sedang bekerja","gist":"[DIPINDA 2024] Penalti: hingga RM2,000 atau 3 bulan atau kedua-duanya (dahulu RM1,000).","verbatim":["(2) Seseorang yang melanggar peruntukan seksyen ini adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi dua ribu ringgit atau dipenjarakan selama tempoh tidak melebihi tiga bulan atau kedua-duanya."],"p":"VI","ex":"Pekerja yang enggan memakai PPE yang disediakan boleh didenda hingga RM2,000."},{"ref":"s.25","sec":"25","title":"Kewajipan untuk tidak mengganggu atau menyalahgunakan benda yang diadakan menurut peruntukan tertentu","gist":"Sesiapa yang dengan sengaja, melulu atau cuai mengganggu atau menyalahgunakan apa-apa yang disediakan untuk keselamatan, kesihatan dan kebajikan (cth. pengadang mesin, pemadam api): hingga RM20,000 atau 2 tahun atau kedua-duanya.","verbatim":["Seseorang yang dengan sengaja, melulu atau cuai mengganggu atau menyalahgunakan apa-apa jua yang diadakan atau dilakukan untuk kepentingan keselamatan, kesihatan dan kebajikan menurut Akta ini adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi dua puluh ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"VI","ex":"Pekerja yang menanggalkan pengadang mesin supaya kerja lebih cepat melakukan kesalahan di bawah s.25."},{"ref":"s.26","sec":"26","title":"Kewajipan untuk tidak mengenakan caj ke atas pekerja bagi benda yang dilakukan atau diadakan","gist":"Majikan tidak boleh mengenakan bayaran kepada pekerja bagi apa-apa yang dibuat atau disediakan di bawah Akta atau peraturan (cth. PPE, latihan, pengawasan perubatan).","verbatim":["Tiada majikan boleh melevi atau membenarkan untuk dilevi ke atas mana-mana pekerjanya apa-apa caj berkenaan dengan apa-apa jua yang dilakukan atau diadakan menurut Akta ini atau mana-mana peraturan yang dibuat di bawahnya."],"p":"VI","ex":"Majikan tidak boleh memotong gaji pekerja untuk kos kasut keselamatan atau ujian audiometri."},{"ref":"s.26A(1)","sec":"26A","title":"Hak pekerja","gist":"[BAHARU 2024] Selepas memaklumkan majikan bahawa ada justifikasi munasabah wujud bahaya yang hampir berlaku, pekerja berhak mengundurkan diri daripada bahaya atau kerja itu jika majikan gagal bertindak.","verbatim":["(1) Seseorang pekerja, selepas memberitahu majikannya atau wakilnya bahawa dia mempunyai justifikasi yang munasabah untuk mempercayai terdapat suatu bahaya hampir pasti berlaku di tempat kerjanya, hendaklah mempunyai hak untuk mengeluarkan dirinya daripada bahaya atau kerja itu jika majikan itu gagal untuk mengambil apa-apa tindakan untuk menghapuskan bahaya itu."],"p":"VI","ex":"Pekerja yang melihat perancah hampir runtuh memaklumkan penyelia; jika tiada tindakan, dia boleh beredar dari kawasan itu."},{"ref":"s.26A(2)","sec":"26A","title":"Hak pekerja","gist":"Pekerja yang mengundurkan diri dilindungi daripada akibat buruk dan tidak boleh didiskriminasi.","verbatim":["(2) Seseorang pekerja yang mengeluarkan dirinya daripada bahaya mengikut subseksyen (1) hendaklah dilindungi daripada akibat tidak wajar dan tidak boleh didiskriminasikan."],"p":"VI","ex":"Majikan tidak boleh memotong gaji pekerja yang mengundurkan diri daripada perancah tidak selamat itu."},{"ref":"s.26A(3)","sec":"26A","title":"Hak pekerja","gist":"Tafsiran \"bahaya yang hampir berlaku\": risiko serius kematian atau kecederaan tubuh yang serius akibat loji, bahan, keadaan, aktiviti, proses, amalan, prosedur atau hazard tempat kerja.","verbatim":["(3) Bagi maksud seksyen ini, “bahaya hampir pasti berlaku” ertinya suatu risiko kematian yang serius atau kecederaan badan yang serius kepada mana-mana orang yang disebabkan oleh mana-mana loji, bahan, keadaan, aktiviti, proses, amalan, tatacara atau bahaya tempat kerja."],"p":"VI","ex":"Kebocoran gas ammonia yang boleh membawa maut ialah bahaya yang hampir berlaku."},{"ref":"s.27(1)","sec":"27","title":"Diskriminasi terhadap pekerja, dsb.","gist":"[DIPINDA 2024] Majikan tidak boleh membuang kerja, memudaratkan atau mengubah kedudukan pekerja hanya kerana pekerja itu: (a) membuat aduan tentang perkara tidak selamat; (b) ahli JKK; (c) menjalankan fungsi sebagai ahli JKK; atau (d) [BAHARU] membantu pegawai atau penilai dalam siasatan, pemeriksaan atau penyiasatan.","verbatim":["(1) Tiada majikan boleh memecat seseorang pekerja, mencederakannya dalam pekerjaannya atau mengubah kedudukannya sehingga memudaratkannya semata-mata oleh sebab pekerja itu—","(a) membuat suatu aduan mengenai perkara yang dianggapnya tidak selamat atau suatu risiko kepada kesihatan;","(b) adalah anggota jawatankuasa keselamatan dan kesihatan yang ditubuhkan menurut Akta ini;","(c) menjalankan mana-mana fungsinya sebagai anggota jawatankuasa keselamatan dan kesihatan itu.; atau","(d) telah membantu pegawai atau pengapit dalam mana-mana siasatan dalam menjalankan apa-apa pemeriksaan atau penyiasatan di bawah Akta ini."],"p":"VI","ex":"Majikan tidak boleh memecat pekerja yang mengadu kepada JKKP tentang mesin tanpa pengadang."},{"ref":"s.27(2)","sec":"27","title":"Diskriminasi terhadap pekerja, dsb.","gist":"Kesatuan sekerja tidak boleh mengambil tindakan terhadap ahli atas sebab (a) hingga (c) yang sama.","verbatim":["(2) Tiada kesatuan sekerja boleh mengambil apa-apa tindakan ke atas mana-mana anggotanya yang, sebagai seorang pekerja di sesuatu tempat kerja—","(a) membuat suatu aduan mengenai perkara yang dianggapnya tidak selamat atau suatu risiko kepada kesihatan;","(b) adalah anggota jawatankuasa keselamatan dan kesihatan yang ditubuhkan menurut Akta ini; atau","(c) menjalankan mana-mana fungsinya sebagai anggota jawatankuasa keselamatan dan kesihatan itu."],"p":"VI","ex":"Kesatuan sekerja tidak boleh menggantung keahlian pekerja kerana dia menjadi ahli JKK."},{"ref":"s.27(3)","sec":"27","title":"Diskriminasi terhadap pekerja, dsb.","gist":"[DIPINDA 2024] Penalti: hingga RM100,000 atau 1 tahun atau kedua-duanya (dahulu RM10,000).","verbatim":["(3) Seseorang majikan atau kesatuan sekerja yang melanggar peruntukan seksyen ini adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"VI","ex":"Majikan yang menurunkan pangkat ahli JKK kerana aktiviti JKK boleh didenda hingga RM100,000."},{"ref":"s.27(4)","sec":"27","title":"Diskriminasi terhadap pekerja, dsb.","gist":"Mahkamah juga boleh memerintahkan (a) pampasan kepada orang yang didiskriminasi, dan/atau (b) pekerja diambil semula ke jawatan asal atau jawatan setara.","verbatim":["(4) Walau apa pun mana-mana undang-undang bertulis yang berlawanan, jika seseorang disabitkan atas suatu kesalahan di bawah seksyen ini Mahkamah boleh, sebagai tambahan kepada penalti yang dikenakan ke atas pesalah, membuat salah satu atau kedua-dua perintah yang berikut:","(a) suatu perintah supaya pesalah itu membayar dalam tempoh tertentu kepada orang yang telah didiskriminasikan oleh pesalah itu apa-apa ganti rugi yang difikirkannya sesuai sebagai pampasan bagi orang itu;","(b) suatu perintah supaya pekerja itu dikembalikan atau diambil bekerja semula pada jawatannya yang dahulu atau, jika jawatan itu tidak ada, pada jawatan yang serupa."],"p":"VI","ex":"Mahkamah memerintahkan majikan mengambil semula pekerja yang dipecat dan membayar pampasan."},{"ref":"s.27A(1)","sec":"27A","title":"Notis menduduki tempat kerja","gist":"Sesiapa yang menduduki premis sebagai tempat kerja atau menjalankan aktiviti di tempat kerja mesti memberi notis kepada pegawai mengikut butiran, cara dan masa yang ditentukan KP.","verbatim":["(1) Tertakluk kepada subseksyen (2), mana-mana orang yang menduduki atau menggunakan mana-mana premis sebagai tempat kerja atau mengusahakan apa-apa aktiviti di dalam tempat kerja hendaklah memberikan notis kepada seorang pegawai yang mengandungi apa-apa butiran, dan mengikut apa-apa cara dan dalam apa-apa tempoh, sebagaimana yang ditentukan oleh Ketua Pengarah."],"p":"VIA","ex":"Syarikat yang memulakan operasi kilang baharu memberi notis kepada JKKP dalam masa yang ditetapkan."},{"ref":"s.27A(2)","sec":"27A","title":"Notis menduduki tempat kerja","gist":"Kewajipan notis hanya bagi tempat kerja dan aktiviti yang ditetapkan Menteri.","verbatim":["(2) Kehendak untuk memberikan notis di bawah subseksyen (1) hendaklah hanya terpakai bagi tempat kerja dan aktiviti sebagaimana yang ditetapkan oleh Menteri."],"p":"VIA","ex":"Hanya tempat kerja dan aktiviti yang disenaraikan dalam perintah Menteri perlu memberi notis."},{"ref":"s.27A(3)","sec":"27A","title":"Notis menduduki tempat kerja","gist":"Penalti: hingga RM100,000 atau 1 tahun atau kedua-duanya.","verbatim":["(3) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"VIA","ex":"Menduduki tempat kerja yang ditetapkan tanpa memberi notis boleh didenda hingga RM100,000."},{"ref":"s.27B","sec":"27B","title":"Penetapan loji yang menghendaki perakuan kelayakan","gist":"Menteri boleh menetapkan loji yang memerlukan PMA (cth. dandang, bejana tekanan, lif, kren).","verbatim":["Menteri boleh menetapkan mana-mana loji yang baginya suatu perakuan kelayakan dikehendaki."],"p":"VIA","ex":"Dandang stim, bekas tekanan tak berapi dan kren menara ialah loji yang memerlukan PMA."},{"ref":"s.27C(1)","sec":"27C","title":"Pemasangan loji","gist":"Tidak boleh memasang loji yang ditetapkan kecuali memenuhi semua keperluan dan mendapat kelulusan bertulis KP.","verbatim":["(1) Tiada seorang pun boleh memasang atau menyebabkan untuk dipasang mana-mana loji yang ditetapkan di bawah seksyen 27B melainkan jika orang itu memastikan bahawa loji itu telah memenuhi semua kehendak yang ditetapkan oleh Menteri dan telah mendapat kelulusan bertulis daripada Ketua Pengarah."],"p":"VIA","ex":"Syarikat mesti mendapat kelulusan bertulis KP sebelum memasang dandang baharu."},{"ref":"s.27C(2)","sec":"27C","title":"Pemasangan loji","gist":"Permohonan kelulusan dikemukakan kepada KP dengan butiran yang ditentukan.","verbatim":["(2) Seseorang boleh memohon bagi kelulusan yang disebut dalam subseksyen (1) dengan mengemukakan kepada Ketua Pengarah apa-apa butiran mengikut apa-apa cara dan dalam apa-apa tempoh sebagaimana yang ditentukan oleh Ketua Pengarah."],"p":"VIA","ex":"Kontraktor mengemukakan lukisan dan spesifikasi dandang semasa memohon kelulusan pemasangan."},{"ref":"s.27C(3)","sec":"27C","title":"Pemasangan loji","gist":"KP boleh meluluskan dengan terma dan syarat.","verbatim":["(3) Apabila menerima dan mempertimbangkan suatu permohonan di bawah subseksyen (2), Ketua Pengarah boleh memberikan kelulusan tertakluk pada apa-apa terma dan syarat sebagaimana yang boleh dikenakan oleh Ketua Pengarah."],"p":"VIA","ex":"KP meluluskan pemasangan kren dengan syarat asasnya diuji beban."},{"ref":"s.27C(4)","sec":"27C","title":"Pemasangan loji","gist":"Penalti: hingga RM100,000 atau 1 tahun atau kedua-duanya.","verbatim":["(4) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"VIA","ex":"Memasang kren menara tanpa kelulusan KP boleh didenda hingga RM100,000."},{"ref":"s.27D(1)","sec":"27D","title":"Perakuan kelayakan","gist":"Loji yang dipasang tidak boleh dikendalikan tanpa PMA daripada pegawai atau orang berlesen.","verbatim":["(1) Tiada seorang pun boleh mengendalikan atau menyebabkan atau membenarkan untuk dikendalikan mana-mana loji yang telah dipasang di bawah seksyen 27C melainkan jika loji itu mempunyai suatu perakuan kelayakan yang dikeluarkan oleh seorang pegawai atau orang berlesen."],"p":"VIA","ex":"Kren yang baru dipasang tidak boleh digunakan sebelum PMA dikeluarkan."},{"ref":"s.27D(2)","sec":"27D","title":"Perakuan kelayakan","gist":"Selepas pemasangan, notis bertulis diberi kepada pegawai/orang berlesen, yang kemudian memeriksa loji.","verbatim":["(2) Apabila loji yang ditetapkan telah dipasang di bawah seksyen 27C, orang itu hendaklah menyampaikan suatu notis bertulis ke atas seorang pegawai atau orang berlesen yang, selepas menerima notis itu, hendaklah membuat pemeriksaan ke atas loji itu."],"p":"VIA","ex":"Selepas memasang dandang, pemilik memberi notis kepada JKKP supaya ia diperiksa."},{"ref":"s.27D(3)","sec":"27D","title":"Perakuan kelayakan","gist":"Jika (a) patuh: PMA dikeluarkan selepas bayaran fi; (b) tidak patuh: fi tetap dibayar walaupun PMA tidak dikeluarkan.","verbatim":["(3) Jika, apabila pemeriksaan, pegawai atau orang berlesen itu mendapati loji itu—","(a) mematuhi semua kehendak yang ditetapkan oleh Menteri berkenaan dengan loji itu, pegawai atau orang berlesen itu hendaklah mengeluarkan suatu perakuan kelayakan selepas pembayaran apa-apa fi oleh orang itu sebagaimana yang ditetapkan oleh Menteri; atau","(b) tidak mematuhi mana-mana kehendak yang ditetapkan oleh Menteri berkenaan dengan loji itu, orang itu hendaklah membayar kepada pegawai atau orang berlesen itu apa-apa fi yang ditetapkan oleh Menteri bagi perkhidmatan yang diberikan walaupun tiada perakuan kelayakan dikeluarkan."],"p":"VIA","ex":"Dandang yang gagal pemeriksaan tidak diberi PMA, tetapi fi pemeriksaan tetap perlu dibayar."},{"ref":"s.27D(4)","sec":"27D","title":"Perakuan kelayakan","gist":"Bentuk, syarat dan tempoh sah PMA ditetapkan Menteri.","verbatim":["(4) Suatu perakuan kelayakan yang dikeluarkan di bawah subseksyen (3) hendaklah dalam apa-apa bentuk dan tertakluk kepada apa-apa terma dan syarat, dan hendaklah sah bagi apa-apa tempoh, sebagaimana yang ditetapkan oleh Menteri."],"p":"VIA","ex":"Perintah Menteri menetapkan bentuk perakuan dan berapa lama PMA sesuatu jenis loji itu sah."},{"ref":"s.27D(5)","sec":"27D","title":"Perakuan kelayakan","gist":"Kendali tanpa PMA: hingga RM100,000 atau 1 tahun atau kedua-duanya.","verbatim":["(5) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"VIA","ex":"Mengendalikan dandang tanpa PMA yang sah boleh didenda hingga RM100,000."},{"ref":"s.27D(6)","sec":"27D","title":"Perakuan kelayakan","gist":"Pegawai mesti segera memberi notis larangan kendali, atau menjadikan loji tidak boleh dikendalikan, sehingga PMA dikeluarkan.","verbatim":["(6) Dalam hal apa-apa pelanggaran subseksyen (1), seseorang pegawai hendaklah dengan serta-merta menyampaikan kepada orang yang mengendalikan atau menyebabkan atau membenarkan untuk dikendalikan loji suatu notis bertulis yang melarang pengendalian loji itu atau boleh menyebabkan loji itu tidak boleh dikendalikan sehingga suatu perakuan kelayakan dikeluarkan."],"p":"VIA","ex":"Pegawai menampal notis larangan pada kren tanpa PMA dan mengunci panel kawalannya."},{"ref":"s.27D(7)","sec":"27D","title":"Perakuan kelayakan","gist":"Ingkar notis di s.27D(6): hingga RM500,000 atau 2 tahun atau kedua-duanya.","verbatim":["(7) Seseorang yang tidak mematuhi notis yang dikeluarkan di bawah subseksyen (6) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi lima ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"VIA","ex":"Pemilik yang terus menggunakan kren selepas notis larangan boleh didenda hingga RM500,000."},{"ref":"s.27D(8)","sec":"27D","title":"Perakuan kelayakan","gist":"PMA tamat apabila loji dibuka, dibaiki atau rosak, kecuali dikecualikan KP jika tidak membahayakan.","verbatim":["(8) Suatu perakuan kelayakan berkenaan dengan apa-apa loji yang sedang dibuka atau dibaiki atau rosak atas apa-apa sebab hendaklah tamat apabila loji itu dibuka, dibaiki atau rosak, tetapi Ketua Pengarah boleh mengecualikan mana-mana loji daripada pemakaian subseksyen ini jika pada pendapatnya loji itu tidak akan menyebabkan apa-apa bahaya kepada mana-mana orang atau harta."],"p":"VIA","ex":"Selepas tiub dandang dibaiki, PMA lama tamat dan dandang perlu diperiksa semula."},{"ref":"s.27D(9)","sec":"27D","title":"Perakuan kelayakan","gist":"Tafsiran (a) \"rosak\", (b) \"buka\" dan (c) \"baiki\" bagi tujuan s.27D(8).","verbatim":["(9) Bagi maksud subseksyen (8)—","(a) “rosak” ertinya apa-apa kecacatan fizikal yang terjadi kepada mana-mana loji semasa pengendalian atau selainnya yang boleh menjejaskan kekuatan dan integriti loji itu semasa pengendalian berikutnya;","(b) “dibuka” ertinya untuk membuka mana-mana bahagian mana-mana loji yang boleh menjejaskan kekuatan, integriti atau keupayaan fungsian loji itu;","(c) “dibaiki” ertinya apa-apa kerja yang dilakukan untuk membaik pulih mana-mana bahagian mana-mana loji yang telah rosak."],"p":"VIA","ex":"Membuka penutup bekas tekanan untuk pemeriksaan dalaman dikira \"dibuka\" bagi s.27D(8)."},{"ref":"s.27E(1)","sec":"27E","title":"Pemeriksaan berkala loji","gist":"Loji yang ditetapkan mesti diperiksa secara berkala oleh pegawai atau orang berlesen mengikut tempoh dan cara yang ditetapkan.","verbatim":["(1) Suatu loji yang ditetapkan di bawah seksyen 27B hendaklah diperiksa oleh seorang pegawai atau orang berlesen pada bila-bila masa dan mengikut apa-apa cara sebagaimana yang ditetapkan oleh Menteri."],"p":"VIA","ex":"Kren mudah alih diperiksa secara berkala dan PMA diperbaharui jika ia lulus pemeriksaan."},{"ref":"s.27E(2)","sec":"27E","title":"Pemeriksaan berkala loji","gist":"Pemeriksaan tertakluk kepada bayaran fi.","verbatim":["(2) Suatu pemeriksaan di bawah subseksyen (1) hendaklah tertakluk kepada pembayaran apa-apa fi sebagaimana yang ditetapkan oleh Menteri."],"p":"VIA","ex":"Pemilik kren membayar fi setiap kali pemeriksaan berkala dijalankan."},{"ref":"s.27F(1)","sec":"27F","title":"Skim pemeriksaan khas","gist":"Penghuni boleh memohon kepada KP skim pemeriksaan khas bagi kelas loji tertentu, dengan fi.","verbatim":["(1) Walau apa pun seksyen 27E, seseorang penghuni boleh memohon kepada Ketua Pengarah untuk kelulusan bagi skim pemeriksaan khas mengenai pemeriksaan bagi kelas loji tertentu dan tambahannya bersama-sama dengan apa-apa fi sebagaimana yang ditetapkan oleh Menteri."],"p":"VIA","ex":"Loji penapisan memohon skim pemeriksaan khas untuk dandang yang diselenggara dengan baik."},{"ref":"s.27F(2)","sec":"27F","title":"Skim pemeriksaan khas","gist":"KP boleh meluluskan jika keperluan Menteri dipenuhi.","verbatim":["(2) Ketua Pengarah boleh meluluskan suatu permohonan di bawah subseksyen (1) jika dia berpuas hati bahawa kehendak yang ditetapkan oleh Menteri berkenaan dengan loji itu telah dipenuhi."],"p":"VIA","ex":"KP meluluskan skim khas kerana syarikat mempunyai program penyelenggaraan dan pemantauan yang kukuh."},{"ref":"s.27F(3)","sec":"27F","title":"Skim pemeriksaan khas","gist":"Selepas diluluskan, pemeriksaan dijalankan mengikut skim khas itu.","verbatim":["(3) Apabila kelulusan di bawah subseksyen (2) diberikan, pemeriksaan loji itu hendaklah dijalankan mengikut skim pemeriksaan khas."],"p":"VIA","ex":"Dandang di bawah skim khas diperiksa mengikut selang yang lebih panjang yang diluluskan."},{"ref":"s.27G(1)","sec":"27G","title":"Ketua Pengarah boleh membuat perintah dalam hal keadaan tertentu","gist":"KP boleh membuat perintah khas untuk keselamatan orang yang bekerja dengan atau berhampiran loji atau proses.","verbatim":["(1) Ketua Pengarah boleh membuat perintah khas bagi kelakuan dan panduan orang yang diambil kerja dalam mana-mana perkhidmatan yang melibatkan pengurusan atau pengendalian, atau penjagaan, atau kedekatan dengan, mana-mana loji atau proses yang dijalankan di dalam mana-mana tempat kerja yang ternyata padanya adalah perlu untuk memastikan keselamatan dan kesihatan mereka."],"p":"VIA","ex":"KP membuat perintah khas yang mewajibkan zon larangan di sekitar kerja pemasangan kren."},{"ref":"s.27G(2)","sec":"27G","title":"Ketua Pengarah boleh membuat perintah dalam hal keadaan tertentu","gist":"Majikan mesti memastikan pekerja yang terdedah mengetahuinya, dan pekerja mesti mematuhinya.","verbatim":["(2) Majikan hendaklah memastikan dengan segala cara yang munasabah bahawa orang yang terdedah kepada bahaya sedar akan apa-apa perintah khas yang dibuat di bawah subseksyen (1) dan orang itu hendaklah mematuhi perintah khas itu."],"p":"VIA","ex":"Penyelia memberi taklimat perintah khas kepada pengendali kren dan pekerja berhampiran."},{"ref":"s.27G(3)","sec":"27G","title":"Ketua Pengarah boleh membuat perintah dalam hal keadaan tertentu","gist":"Menampal salinan perintah dalam bahasa yang sesuai di tempat mudah dilihat berhampiran loji dianggap cara yang munasabah.","verbatim":["(3) Bagi maksud subseksyen (2), suatu salinan perintah khas Ketua Pengarah yang dicetak atau ditulis dalam bahasa yang sesuai dan ditampalkan di tempat yang mudah dilihat yang berhampiran dengan loji atau proses yang dimaksudkan oleh perintah khas itu, supaya semua orang yang disebut itu mempunyai akses dan peluang yang bebas untuk membaca perintah khas itu, hendaklah disifatkan menjadi cara yang munasabah."],"p":"VIA","ex":"Salinan perintah khas dalam BM, Inggeris dan Bangla ditampal di sebelah kren."},{"ref":"s.28(1)","sec":"28","title":"Perkhidmatan kesihatan pekerjaan","gist":"[DIPINDA 2024] Menteri boleh membuat peraturan mewajibkan perkhidmatan kesihatan pekerjaan jika: (a) berlaku penyakit yang mungkin disebabkan kerja; (b) perubahan proses atau bahan baharu mungkin menjejaskan kesihatan; (c) dipotong; (d) ada risiko bagi pekerjaan dalam Jadual Ketiga atau bahan yang dibawa masuk.","verbatim":["(1) Jika Menteri mendapati bahawa dalam mana-mana tempat kerja atau kelas atau jenis tempat kerja—","(a) kes-kes penyakit telah terjadi yang dia mempunyai sebab untuk percaya mungkin disebabkan oleh jenis proses atau keadaan lain kerja;","(b) oleh sebab perubahan dalam mana-mana proses atau dalam bahan yang digunakan dalam mana-mana proses atau, oleh sebab pengenalan apa-apa proses baru atau bahan baru bagi kegunaan dalam sesuatu proses, mungkin terdapat risiko kesan buruk kepada kesihatan orang-orang yang diambil kerja dalam proses itu; atau","(c) (Dipotong oleh Akta A1648);","(d) mungkin terdapat risiko kesan buruk kepada kesihatan orang-orang yang diambil kerja dalam mana-mana pekerjaan yang dinyatakan dalam Jadual Ketiga, atau daripada apa-apa bahan atau benda yang dibawa ke tempat kerja itu untuk digunakan atau dikendalikan dalamnya atau daripada apa-apa perubahan keadaan dalam tempat kerja itu, dia boleh membuat peraturan-peraturan menghendaki perkiraan bagi perkhidmatan kesihatan pekerjaan."],"p":"VII","ex":"Selepas kes keracunan pelarut, Menteri mewajibkan perkhidmatan kesihatan pekerjaan di industri itu."},{"ref":"s.28(2)–(3)","sec":"28","title":"Perkhidmatan kesihatan pekerjaan","gist":"Dipotong oleh Akta A1648.","verbatim":["(2) (Dipotong oleh Akta A1648).","(3) (Dipotong oleh Akta A1648)."],"p":"VII","ex":"Peruntukan ini telah dipotong dan tiada lagi kewajipan di bawahnya."},{"ref":"s.28A","sec":"28A","title":"Tiada tindakan terhadap orang yang menjalankan perkhidmatan kesihatan pekerjaan","gist":"[BAHARU 2024] Majikan tidak boleh mengambil tindakan terhadap pemberi perkhidmatan kesihatan pekerjaan kerana (a) mengadu tentang risiko kesihatan, atau (b) melaporkan kepada KP pesakit yang disyaki menghidap penyakit atau keracunan pekerjaan.","verbatim":["Tiada majikan boleh mengambil apa-apa tindakan terhadap mana-mana orang yang menjalankan perkhidmatan kesihatan pekerjaan kerana—","(a) membuat suatu aduan mengenai apa-apa perkara yang dianggap sebagai suatu risiko kepada kesihatan; atau","(b) membuat laporan kepada Ketua Pengarah mengenai mana-mana pesakit yang dipercayainya menghidapi apa-apa penyakit pekerjaan atau keracunan pekerjaan."],"p":"VII","ex":"Majikan tidak boleh menamatkan kontrak doktor kesihatan pekerjaan yang melaporkan kes keracunan plumbum kepada JKKP."},{"ref":"s.29(1)","sec":"29","title":"Pegawai keselamatan dan kesihatan","gist":"Seksyen ini terpakai kepada kelas tempat kerja yang dinyatakan Menteri melalui perintah dalam Warta.","verbatim":["(1) Seksyen ini hendaklah terpakai bagi apa-apa kelas atau jenis tempat kerja yang ditentukan oleh Menteri melalui perintah yang disiarkan dalam Warta."],"p":"VII","ex":"Perintah Menteri menyenaraikan tempat kerja yang wajib melantik SHO, contohnya projek binaan bernilai RM20 juta ke atas."},{"ref":"s.29(2)","sec":"29","title":"Pegawai keselamatan dan kesihatan","gist":"Penghuni tempat kerja tersebut mesti melantik orang kompeten sebagai Pegawai Keselamatan dan Kesihatan (PKK).","verbatim":["(2) Seseorang penghuni suatu tempat kerja yang baginya seksyen ini terpakai hendaklah melantik seorang orang yang kompeten untuk bertindak sebagai pegawai keselamatan dan kesihatan di tempat kerja."],"p":"VII","ex":"Kilang yang tersenarai dalam perintah melantik seorang SHO berdaftar."},{"ref":"s.29(3)","sec":"29","title":"Pegawai keselamatan dan kesihatan","gist":"PKK dilantik khusus untuk memastikan pematuhan Akta dan peraturan, dan menggalakkan kerja selamat.","verbatim":["(3) Pegawai keselamatan dan kesihatan hendaklah dilantik semata-mata bagi maksud menjamin pematuhan wajar di tempat kerja akan peruntukan Akta ini dan mana-mana peraturan yang dibuat di bawahnya dan penggalakan penjalanan selamat kerja di tempat kerja itu."],"p":"VII","ex":"SHO menjalankan pemeriksaan tapak, menyiasat kemalangan dan menasihati majikan."},{"ref":"s.29(4)","sec":"29","title":"Pegawai keselamatan dan kesihatan","gist":"Seorang PKK hanya untuk satu tempat kerja pada satu masa, kecuali dibenarkan KP.","verbatim":["(4) Seseorang hendaklah dilantik sebagai pegawai keselamatan dan kesihatan hanya untuk satu tempat kerja pada satu-satu masa, melainkan jika dibenarkan selainnya oleh Ketua Pengarah."],"p":"VII","ex":"Seorang SHO tidak boleh berkhidmat di dua tapak bina serentak tanpa kebenaran KP."},{"ref":"s.29(5)","sec":"29","title":"Pegawai keselamatan dan kesihatan","gist":"[DIPINDA 2024] Penalti: hingga RM50,000 atau 6 bulan atau kedua-duanya (dahulu RM5,000).","verbatim":["(5) Seseorang penghuni yang melanggar peruntukan seksyen ini adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi lima puluh ribu ringgit atau dipenjarakan selama tempoh tidak melebihi enam bulan atau kedua-duanya."],"p":"VII","ex":"Majikan yang tidak melantik SHO apabila diwajibkan boleh didenda hingga RM50,000."},{"ref":"s.29A(1)","sec":"29A","title":"Penyelaras keselamatan dan kesihatan pekerjaan","gist":"[BAHARU 2024] Majikan yang tempat kerjanya tidak wajib ada PKK, tetapi ada 5 pekerja atau lebih, mesti melantik seorang pekerja sebagai Penyelaras KKP.","verbatim":["(1) Seseorang majikan yang tempat kerjanya tidak termasuk dalam mana-mana kelas atau jenis tempat kerja sebagaimana yang disiarkan dalam Warta di bawah subseksyen 29(1) hendaklah melantik salah seorang daripada pekerjanya untuk bertindak sebagai penyelaras keselamatan dan kesihatan pekerjaan jika dia mengambil kerja lima atau lebih pekerja di tempat kerjanya."],"p":"VII","ex":"Bengkel kereta dengan 10 pekerja dan tiada SHO melantik seorang pekerja sebagai penyelaras KKP."},{"ref":"s.29A(2)","sec":"29A","title":"Penyelaras keselamatan dan kesihatan pekerjaan","gist":"Penyelaras KKP dilantik untuk menyelaras isu KKP di tempat kerja.","verbatim":["(2) Seseorang pekerja yang dilantik sebagai penyelaras keselamatan dan kesihatan pekerjaan di bawah subseksyen (1) hendaklah dilantik bagi maksud menyelaraskan isu keselamatan dan kesihatan pekerjaan di tempat kerja."],"p":"VII","ex":"Penyelaras KKP menyelaras pemeriksaan pemadam api dan latihan keselamatan bengkel."},{"ref":"s.29A(3)","sec":"29A","title":"Penyelaras keselamatan dan kesihatan pekerjaan","gist":"Jika majikan sudah melantik PKK, dianggap telah mematuhi.","verbatim":["(3) Walau apa pun subseksyen (1), seseorang majikan yang disebut dalam subseksyen (1) yang telah melantik seorang pegawai keselamatan dan kesihatan di tempat kerja hendaklah disifatkan telah mematuhi subseksyen (1)."],"p":"VII","ex":"Kilang yang sudah melantik SHO tidak perlu melantik penyelaras KKP."},{"ref":"s.29A(4)","sec":"29A","title":"Penyelaras keselamatan dan kesihatan pekerjaan","gist":"Penalti: hingga RM50,000 atau 6 bulan atau kedua-duanya.","verbatim":["(4) Seseorang majikan yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi lima puluh ribu ringgit atau dipenjarakan selama tempoh tidak melebihi enam bulan atau kedua-duanya."],"p":"VII","ex":"Kedai dengan 6 pekerja yang tidak melantik penyelaras KKP boleh didenda hingga RM50,000."},{"ref":"s.30(1)","sec":"30","title":"Penubuhan jawatankuasa keselamatan dan kesihatan di tempat kerja","gist":"Majikan mesti menubuhkan JKK jika (a) 40 orang atau lebih bekerja di tempat kerja, atau (b) diarahkan oleh KP.","verbatim":["(1) Tiap-tiap majikan hendaklah menubuhkan jawatankuasa keselamatan dan kesihatan di tempat kerja mengikut seksyen ini jika—","(a) terdapat empat puluh orang atau lebih diambil kerja di tempat kerja; atau","(b) Ketua Pengarah mengarahkan penubuhan jawatankuasa sedemikian di tempat kerja."],"p":"VII","ex":"Kilang dengan 45 pekerja mesti menubuhkan JKK."},{"ref":"s.30(2)","sec":"30","title":"Penubuhan jawatankuasa keselamatan dan kesihatan di tempat kerja","gist":"Komposisi, pemilihan ahli, kuasa dan prosedur JKK mengikut peraturan (Peraturan JKK 1996).","verbatim":["(2) Keanggotaan jawatankuasa keselamatan dan kesihatan yang ditubuhkan di bawah subseksyen (1), pemilihan atau pelantikan orang-orang ke jawatankuasa itu, kuasa anggota-anggota jawatankuasa itu dan apa-apa perkara lain yang berhubungan dengan penubuhan atau prosedur jawatankuasa itu hendaklah sebagaimana yang ditetapkan."],"p":"VII","ex":"Peraturan JKK 1996 menetapkan bilangan wakil majikan dan pekerja dalam JKK."},{"ref":"s.30(3)","sec":"30","title":"Penubuhan jawatankuasa keselamatan dan kesihatan di tempat kerja","gist":"Majikan mesti berunding dengan JKK supaya majikan dan pekerja dapat bekerjasama mempromosi dan menyemak keberkesanan langkah keselamatan.","verbatim":["(3) Tiap-tiap majikan hendaklah berunding dengan jawatankuasa keselamatan dan kesihatan itu dengan tujuan untuk membuat dan menyenggarakan perkiraan yang akan membolehkannya dan pekerja-pekerjanya bekerjasama dengan berkesan dalam menggalakkan dan membangunkan langkah-langkah untuk memastikan keselamatan dan kesihatan pekerja-pekerja di tempat kerja, dan dalam mengukur keberkesanan langkah-langkah itu."],"p":"VII","ex":"Majikan membincangkan keputusan HIRARC dengan JKK sebelum membeli PPE baharu."},{"ref":"s.30(4)","sec":"30","title":"Penubuhan jawatankuasa keselamatan dan kesihatan di tempat kerja","gist":"[DIPINDA 2024] Penalti: hingga RM100,000 atau 1 tahun atau kedua-duanya (dahulu RM5,000 / 6 bulan).","verbatim":["(4) Seseorang yang melanggar peruntukan seksyen ini adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"VII","ex":"Majikan dengan 50 pekerja yang tidak menubuhkan JKK boleh didenda hingga RM100,000."},{"ref":"s.31(a)","sec":"31","title":"Fungsi jawatankuasa keselamatan dan kesihatan","gist":"JKK mengkaji semula langkah keselamatan dan kesihatan di tempat kerja.","verbatim":["Jawatankuasa keselamatan dan kesihatan yang ditubuhkan di tempat kerja menurut seksyen 30—","(a) hendaklah sentiasa mengkaji semula langkah-langkah yang diambil untuk memastikan keselamatan dan kesihatan orang-orang di tempat kerja;"],"p":"VII","ex":"JKK mengkaji semula statistik kemalangan setiap suku tahun."},{"ref":"s.31(b)","sec":"31","title":"Fungsi jawatankuasa keselamatan dan kesihatan","gist":"JKK menyiasat perkara yang dianggap tidak selamat oleh ahli atau pekerja dan telah dimaklumkan kepada majikan.","verbatim":["Jawatankuasa keselamatan dan kesihatan yang ditubuhkan di tempat kerja menurut seksyen 30—","(b) hendaklah menyiasat apa-apa perkara di tempat kerja— (i) yang dianggap oleh anggota jawatankuasa itu atau orang yang diambil kerja di tempat kerja itu adalah tidak selamat atau merupakan risiko kepada kesihatan; dan (ii) yang telah dibawa kepada perhatian majikan;"],"p":"VII","ex":"JKK menyiasat aduan pekerja tentang lantai licin di bahagian pembungkusan."},{"ref":"s.31(c)","sec":"31","title":"Fungsi jawatankuasa keselamatan dan kesihatan","gist":"JKK cuba menyelesaikannya; jika gagal, meminta KP memeriksa tempat kerja.","verbatim":["Jawatankuasa keselamatan dan kesihatan yang ditubuhkan di tempat kerja menurut seksyen 30—","(c) hendaklah cuba menyelesaikan apa-apa perkara yang disebut dalam perenggan (b) dan, jika ia tidak berupaya berbuat demikian, hendaklah meminta Ketua Pengarah supaya menjalankan suatu pemeriksaan tempat kerja itu bagi maksud itu; dan"],"p":"VII","ex":"Majikan tidak membaiki lantai itu, jadi JKK meminta JKKP memeriksa tempat kerja."},{"ref":"s.31(d)","sec":"31","title":"Fungsi jawatankuasa keselamatan dan kesihatan","gist":"Fungsi lain yang ditetapkan.","verbatim":["Jawatankuasa keselamatan dan kesihatan yang ditubuhkan di tempat kerja menurut seksyen 30—","(d) hendaklah mempunyai apa-apa fungsi lain yang boleh ditetapkan."],"p":"VII","ex":"Peraturan JKK menetapkan fungsi tambahan seperti memeriksa tempat kerja setiap 3 bulan."},{"ref":"s.31A(1)","sec":"31A","title":"Kursus latihan keselamatan dan kesihatan pekerjaan","gist":"[BAHARU 2024] Menteri boleh, melalui perintah Warta, mewajibkan golongan tertentu menghadiri kursus latihan KKP oleh pemberi latihan berdaftar.","verbatim":["(1) Menteri boleh, melalui perintah yang disiarkan dalam Warta, menghendaki mana-mana kelas atau perihal orang untuk menghadiri kursus latihan keselamatan dan kesihatan pekerjaan sebagaimana yang dinyatakan dalam perintah itu yang dijalankan oleh seorang penyedia latihan berdaftar."],"p":"VII","ex":"Menteri mewajibkan penyelaras KKP menghadiri kursus KKP yang ditetapkan."},{"ref":"s.31A(2)","sec":"31A","title":"Kursus latihan keselamatan dan kesihatan pekerjaan","gist":"Majikan mesti memastikan orang itu tamat kursus sebelum membenarkannya melakukan kerja tersebut.","verbatim":["(2) Majikan mana-mana orang yang dikehendaki untuk menghadiri apa-apa kursus latihan di bawah subseksyen (1) hendaklah memastikan yang orang itu telah menyelesaikan kursus latihan tersebut sebelum membenarkan orang itu untuk melaksanakan apa-apa kerja yang baginya latihan itu diperlukan."],"p":"VII","ex":"Majikan memastikan pekerja tamat kursus AESP sebelum dibenarkan masuk ke ruang terkurung."},{"ref":"s.31A(3)","sec":"31A","title":"Kursus latihan keselamatan dan kesihatan pekerjaan","gist":"KP boleh mengarahkan secara bertulis kursus ulang kaji jika perlu.","verbatim":["(3) Walaupun seseorang telah menyelesaikan apa-apa kursus latihan keselamatan dan kesihatan pekerjaan sebagaimana yang dikehendaki di bawah seksyen ini, Ketua Pengarah boleh, jika difikirkannya kursus ulangkaji adalah perlu, mengeluarkan suatu arahan bertulis yang menghendaki orang itu untuk menghadiri kursus latihan itu yang lain."],"p":"VII","ex":"Selepas kemalangan, KP mengarahkan pengendali kren menghadiri kursus ulang kaji."},{"ref":"s.31A(4)","sec":"31A","title":"Kursus latihan keselamatan dan kesihatan pekerjaan","gist":"Penalti (majikan langgar s.31A(2)): hingga RM50,000 atau 6 bulan atau kedua-duanya.","verbatim":["(4) Seseorang majikan yang melanggar subseksyen (2) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi lima puluh ribu ringgit atau dipenjarakan selama tempoh tidak melebihi enam bulan atau kedua-duanya."],"p":"VII","ex":"Majikan yang membenarkan pekerja tanpa kursus wajib membuat kerja itu boleh didenda hingga RM50,000."},{"ref":"s.31B(1)","sec":"31B","title":"Aktiviti yang hendaklah dijalankan oleh orang kompeten dan penyedia latihan berdaftar","gist":"Tiada sesiapa boleh (a) menjalankan aktiviti Jadual Kelima kecuali berdaftar sebagai orang kompeten, atau (b) mengendalikan kursus latihan KKP kecuali berdaftar sebagai pemberi latihan.","verbatim":["(1) Bagi maksud Akta ini, tiada seorang pun boleh—","(a) menjalankan apa-apa aktiviti yang dinyatakan dalam Jadual Kelima melainkan jika dia telah berdaftar sebagai orang kompeten di bawah Akta ini; atau","(b) menjalankan apa-apa kursus latihan keselamatan dan kesihatan pekerjaan melainkan jika dia telah berdaftar sebagai penyedia latihan berdaftar di bawah Akta ini."],"p":"VIIA","ex":"Hanya penilai CHRA berdaftar boleh menjalankan CHRA; hanya pemberi latihan berdaftar boleh menganjurkan kursus KKP."},{"ref":"s.31B(2)","sec":"31B","title":"Aktiviti yang hendaklah dijalankan oleh orang kompeten dan penyedia latihan berdaftar","gist":"Penalti: denda hingga RM100,000.","verbatim":["(2) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit."],"p":"VIIA","ex":"Individu yang menjalankan pemantauan bising tanpa berdaftar boleh didenda hingga RM100,000."},{"ref":"s.31C(1)","sec":"31C","title":"Permohonan bagi pendaftaran","gist":"Permohonan pendaftaran dikemukakan kepada KP.","verbatim":["(1) Seseorang yang berniat untuk berdaftar sebagai orang kompeten atau penyedia latihan berdaftar hendaklah mengemukakan suatu permohonan bagi pendaftaran kepada Ketua Pengarah mengikut apa-apa cara sebagaimana yang ditentukan oleh Ketua Pengarah."],"p":"VIIA","ex":"Juruteknik higiene memohon pendaftaran orang kompeten melalui MyKKP."},{"ref":"s.31C(2)","sec":"31C","title":"Permohonan bagi pendaftaran","gist":"Tertakluk kepada fi dan dokumen yang diperlukan.","verbatim":["(2) Permohonan di bawah subseksyen (1) hendaklah tertakluk kepada pembayaran apa-apa fi sebagaimana yang ditetapkan oleh Menteri dan hendaklah disertakan dengan apa-apa dokumen dan maklumat sebagaimana yang dikehendaki oleh Ketua Pengarah."],"p":"VIIA","ex":"Pemohon melampirkan sijil kursus dan membayar fi pendaftaran."},{"ref":"s.31C(3)","sec":"31C","title":"Permohonan bagi pendaftaran","gist":"KP boleh meluluskan dengan syarat atau menolak.","verbatim":["(3) Ketua Pengarah boleh, selepas mempertimbangkan permohonan itu, meluluskan permohonan itu tertakluk kepada apa-apa syarat yang difikirkannya patut, atau menolak permohonan itu."],"p":"VIIA","ex":"KP meluluskan pendaftaran penilai bising dengan syarat dia menghadiri CEP setiap tahun."},{"ref":"s.31C(4)","sec":"31C","title":"Permohonan bagi pendaftaran","gist":"Permohonan boleh ditarik balik sebelum keputusan; fi tidak dikembalikan.","verbatim":["(4) Permohonan di bawah subseksyen (1) boleh ditarik balik pada bila-bila masa sebelum permohonan itu diluluskan atau ditolak, dalam keadaan sedemikian fi yang telah dibayar tidak boleh dibayar balik."],"p":"VIIA","ex":"Pemohon menarik balik permohonan sebelum keputusan dibuat, tetapi fi tidak dikembalikan."},{"ref":"s.31D","sec":"31D","title":"Kesahan pendaftaran","gist":"Pendaftaran sah selama 3 tahun dari tarikh yang dinyatakan.","verbatim":["Tiap-tiap pendaftaran yang diluluskan di bawah seksyen 31 C hendaklah sah bagi tempoh tiga tahun dari tarikh yang dinyatakan dalam kelulusan."],"p":"VIIA","ex":"Pendaftaran yang diluluskan pada 1 Januari 2025 sah hingga 31 Disember 2027."},{"ref":"s.31E(1)","sec":"31E","title":"Pembaharuan pendaftaran","gist":"Pembaharuan dipohon sebelum tarikh tamat.","verbatim":["(1) Seseorang orang kompeten atau penyedia latihan berdaftar boleh membuat permohonan untuk membaharui pendaftaran sebelum tarikh habis tempoh pendaftaran pada bila-bila masa dan mengikut apa-apa cara sebagaimana yang ditentukan oleh Ketua Pengarah."],"p":"VIIA","ex":"Orang kompeten memohon pembaharuan beberapa bulan sebelum pendaftarannya tamat."},{"ref":"s.31E(2)","sec":"31E","title":"Pembaharuan pendaftaran","gist":"Tertakluk kepada fi dan dokumen.","verbatim":["(2) Permohonan di bawah subseksyen (1) hendaklah tertakluk kepada pembayaran apa-apa fi sebagaimana yang ditetapkan oleh Menteri dan hendaklah disertakan dengan apa-apa dokumen sebagaimana yang dikehendaki oleh Ketua Pengarah."],"p":"VIIA","ex":"Pemohon melampirkan bukti mata CEP semasa memohon pembaharuan."},{"ref":"s.31E(3)","sec":"31E","title":"Pembaharuan pendaftaran","gist":"KP boleh (a) membaharui (dengan/tanpa syarat) atau (b) menolak.","verbatim":["(3) Ketua Pengarah boleh, selepas permohonan di bawah subseksyen (1)— mempertimbangkan","(a) membaharui pendaftaran itu, dengan atau tanpa syarat; atau","(b) menolak untuk membaharui pendaftaran itu."],"p":"VIIA","ex":"KP membaharui pendaftaran dengan syarat tambahan."},{"ref":"s.31E(4)","sec":"31E","title":"Pembaharuan pendaftaran","gist":"KP boleh menolak jika pemohon (a) melanggar Akta atau perundangan subsidiari; (b) melanggar syarat pendaftaran; atau (c) memberi maklumat palsu.","verbatim":["(4) Ketua Pengarah boleh menolak permohonan untuk membaharui pendaftaran jika Ketua Pengarah berpuas hati bahawa—","(a) pemohon telah gagal untuk mematuhi mana-mana peruntukan Akta ini atau mana-mana perundangan subsidiari yang dibuat di bawah Akta ini;","(b) pemohon telah gagal untuk mematuhi mana-mana syarat pendaftaran; atau","(c) pemohon telah mengemukakan apa-apa pernyataan, maklumat atau dokumen yang didapati palsu, tidak kira sama ada pemohon mengetahui atau mempercayai pernyataan, maklumat atau dokumen itu palsu atau selainnya."],"p":"VIIA","ex":"KP menolak pembaharuan kerana pemohon memberi laporan CHRA palsu."},{"ref":"s.31E(5)","sec":"31E","title":"Pembaharuan pendaftaran","gist":"Permohonan boleh ditarik balik; fi tidak dikembalikan.","verbatim":["(5) Permohonan di bawah subseksyen (1) boleh ditarik balik pada bila-bila masa sebelum permohonan itu diluluskan atau ditolak, dalam keadaan sedemikian fi yang telah dibayar tidak boleh dibayar balik."],"p":"VIIA","ex":"Permohonan pembaharuan yang ditarik balik tidak mendapat bayaran balik fi."},{"ref":"s.31F(1)","sec":"31F","title":"Pembatalan pendaftaran","gist":"KP boleh membatalkan pendaftaran jika (a) melanggar Akta; (b) melanggar syarat; (c) didaftarkan melalui penipuan; atau (d) tidak lagi layak.","verbatim":["(1) Ketua Pengarah boleh membatalkan pendaftaran orang kompeten atau penyedia latihan berdaftar jika Ketua Pengarah berpuas hati bahawa dia—","(a) telah gagal untuk mematuhi mana-mana peruntukan Akta ini atau mana-mana perundangan subsidiari yang dibuat di bawah Akta ini;","(b) telah gagal untuk mematuhi mana-mana syarat yang dikenakan ke atas pendaftaran;","(c) telah mendapatkan atau memperoleh pendaftarannya dengan fraud atau salah nyataan; atau","(d) tidak lagi sesuai untuk bertindak sebagai orang kompeten atau penyedia latihan berdaftar."],"p":"VIIA","ex":"KP membatalkan pendaftaran orang kompeten yang menggunakan sijil palsu."},{"ref":"s.31F(2)","sec":"31F","title":"Pembatalan pendaftaran","gist":"Sebelum membatalkan, KP mesti memberi peluang representasi bertulis.","verbatim":["(2) Walau apa pun subseksyen (1), Ketua Pengarah tidak boleh membatalkan pendaftaran orang kompeten atau penyedia latihan berdaftar melainkan jika Ketua Pengarah berpuas hati bahawa, setelah memberi orang kompeten atau penyedia latihan berdaftar itu suatu peluang untuk membuat apa-apa representasi secara bertulis yang dihasratkannya untuk dibuat, pendaftaran itu patut dibatalkan."],"p":"VIIA","ex":"KP memberi 14 hari kepada orang kompeten untuk menjelaskan sebelum pendaftarannya dibatalkan."},{"ref":"s.31F(3)","sec":"31F","title":"Pembatalan pendaftaran","gist":"Notis pembatalan dikeluarkan dan berkuat kuasa pada tarikh yang dinyatakan.","verbatim":["(3) Jika pendaftaran orang kompeten atau penyedia latihan berdaftar dibatalkan, Ketua Pengarah hendaklah mengeluarkan suatu notis pembatalan pendaftaran kepada orang kompeten atau penyedia latihan berdaftar itu, dan pembatalan itu berkuat kuasa pada tarikh yang dinyatakan dalam notis itu."],"p":"VIIA","ex":"Notis pembatalan menyatakan bahawa pendaftaran tamat mulai 1 Julai."},{"ref":"s.32(1)","sec":"32","title":"Pemberitahuan mengenai kemalangan, kejadian berbahaya, keracunan pekerjaan dan penyakit pekerjaan, dan siasatan","gist":"[DIPINDA 2024] Majikan mesti memberitahu pejabat JKKP terdekat tentang kemalangan, kejadian berbahaya, keracunan atau penyakit pekerjaan yang telah atau mungkin berlaku. (Butiran dalam Peraturan NADOPOD 2004.)","verbatim":["(1) Seseorang majikan hendaklah memberitahu pejabat keselamatan dan kesihatan pekerjaan yang terdekat mengenai apa-apa kemalangan, kejadian berbahaya, keracunan pekerjaan atau penyakit pekerjaan yang telah terjadi atau mungkin akan terjadi di tempat kerja."],"p":"VIII","ex":"Pekerja patah kaki akibat jatuh dari tangga; majikan memaklumkan JKKP menggunakan borang JKKP 6."},{"ref":"s.32(2)","sec":"32","title":"Pemberitahuan mengenai kemalangan, kejadian berbahaya, keracunan pekerjaan dan penyakit pekerjaan, dan siasatan","gist":"Pengamal perubatan atau pegawai perubatan yang merawat pesakit yang disyaki menghidap penyakit atau keracunan pekerjaan mesti melaporkan kepada KP.","verbatim":["(2) Tiap-tiap pengamal perubatan berdaftar atau pegawai perubatan yang merawat, atau dipanggil untuk melawat, seseorang pesakit yang dia percaya menghidap penyakit pekerjaan atau keracunan pekerjaan yang dinyatakan dalam mana-mana peraturan atau perintah yang dibuat oleh Menteri di bawah Akta ini hendaklah melaporkan perkara itu kepada Ketua Pengarah."],"p":"VIII","ex":"Doktor klinik melaporkan pekerja yang disyaki mengalami keracunan plumbum kepada JKKP."},{"ref":"s.33(1)","sec":"33","title":"Ketua Pengarah boleh mengarahkan supaya siasatan diadakan","gist":"KP boleh mengarahkan pegawai KKP menjalankan siasatan tentang sifat dan punca kejadian.","verbatim":["(1) Jika pada pendapat Ketua Pengarah, suatu siasatan patut diadakan mengenai sifat dan punca kemalangan, kejadian berbahaya, keracunan pekerjaan atau penyakit pekerjaan, dia boleh menyebabkan siasatan sedemikian diadakan oleh seorang pegawai keselamatan dan kesihatan pekerjaan."],"p":"VIII","ex":"KP mengarahkan pegawai menyiasat runtuhan perancah yang menyebabkan kematian."},{"ref":"s.33(2)","sec":"33","title":"Ketua Pengarah boleh mengarahkan supaya siasatan diadakan","gist":"KP boleh melantik penilai yang mahir (kejuruteraan, perubatan dll.).","verbatim":["(2) Ketua Pengarah boleh melantik seorang atau lebih daripada seorang yang mempunyai kemahiran atau kepakaran kejuruteraan, perubatan atau kemahiran atau kepakaran lain yang sesuai untuk berkhidmat sebagai pengapit dalam mana-mana siasatan sedemikian."],"p":"VIII","ex":"KP melantik jurutera struktur sebagai penilai untuk menyiasat runtuhan bumbung."},{"ref":"s.33(2A)","sec":"33","title":"Ketua Pengarah boleh mengarahkan supaya siasatan diadakan","gist":"Penilai berkuasa memasuki dan memeriksa premis bagi tujuan siasatan.","verbatim":["(2A) Pengapit yang dilantik di bawah subseksyen (2) hendaklah mempunyai, bagi maksud siasatan, kuasa untuk memasuki dan memeriksa mana-mana premis, yang kemasukan atau pemeriksaan itu adalah perlu bagi maksud siasatan itu."],"p":"VIII","ex":"Penilai memasuki tapak bina untuk memeriksa sambungan perancah yang runtuh."},{"ref":"s.33(3)","sec":"33","title":"Ketua Pengarah boleh mengarahkan supaya siasatan diadakan","gist":"Penilai bukan pegawai awam boleh dibayar elaun.","verbatim":["(3) Tiap-tiap orang yang bukan pegawai awam yang berkhidmat sebagai pengapit dalam siasatan itu boleh dibayar elaun pada kadar atau kadar-kadar yang ditentukan oleh Menteri."],"p":"VIII","ex":"Jurutera swasta yang dilantik sebagai penilai dibayar elaun."},{"ref":"s.34","sec":"34","title":"Kuasa pegawai keselamatan dan kesihatan pekerjaan dalam siasatan","gist":"Pegawai yang menjalankan siasatan boleh mengangkat sumpah dan mempunyai kuasa Majistret Kelas Pertama untuk memanggil saksi dan dokumen. Orang yang dipanggil wajib hadir.","verbatim":["Bagi maksud mengadakan suatu siasatan di bawah Akta ini, seseorang pegawai keselamatan dan kesihatan pekerjaan hendaklah mempunyai kuasa untuk mengendalikan sumpah dan ikrar dan hendaklah terletakhak dengan kuasa Majistret Kelas Pertama untuk memaksa kehadiran saksi-saksi dan memaksa pengemukaan dokumen-dokumen, memelihara keteraturan dan selainnya menjalankan siasatan dengan sewajarnya, dan semua orang yang dipanggil untuk menghadiri siasatan itu adalah terikat di sisi undang-undang untuk hadir."],"p":"VIII","ex":"Pegawai menyaman penyelia tapak untuk memberi keterangan dalam siasatan."},{"ref":"s.34A","sec":"34A","title":"Kewajipan pemunya, penghuni, dsb., dalam siasatan","gist":"[BAHARU 2024] Pemilik, penghuni, majikan dan pekerja mesti memberi bantuan yang diperlukan untuk siasatan.","verbatim":["Pemunya atau penghuni, atau mana-mana majikan di dalam, mana-mana tempat kerja dan mana-mana pekerja bagi pemunya, penghuni atau majikan itu, hendaklah memberikan apa-apa bantuan yang diperlukan bagi maksud apa-apa siasatan di bawah Akta ini."],"p":"VIII","ex":"Majikan menyerahkan rekod latihan dan rakaman CCTV apabila diminta pegawai penyiasat."},{"ref":"s.35(1)","sec":"35","title":"Kuasa untuk melarang penggunaan loji atau bahan","gist":"KP boleh, melalui perintah Warta, melarang penggunaan loji atau bahan yang mungkin menjejaskan keselamatan dan kesihatan pekerja.","verbatim":["(1) Walau apa pun mana-mana undang-undang bertulis yang berlawanan, Ketua Pengarah boleh, melalui perintah yang disiarkan dalam Warta, melarang penggunaan apa-apa loji atau bahan yang pada pendapatnya mungkin akan menjejaskan keselamatan dan kesihatan orang-orang semasa bekerja."],"p":"IX","ex":"KP melarang penggunaan asbestos biru di tempat kerja melalui perintah Warta."},{"ref":"s.35(2)","sec":"35","title":"Kuasa untuk melarang penggunaan loji atau bahan","gist":"Sebelum membuat perintah, KP mesti berunding dengan jabatan atau badan yang berkaitan.","verbatim":["(2) Jika Ketua Pengarah bercadang untuk menjalankan kuasanya di bawah subseksyen (1) dia hendaklah, sebelum membuat perintah itu, meminta pendapat mana-mana jabatan Kerajaan atau badan lain yang pada hematnya sesuai."],"p":"IX","ex":"KP berunding dengan KKM dan DOE sebelum melarang sesuatu bahan kimia."},{"ref":"s.35(3)","sec":"35","title":"Kuasa untuk melarang penggunaan loji atau bahan","gist":"[DIPINDA 2024] Ingkar perintah: hingga RM500,000 atau 2 tahun atau kedua-duanya.","verbatim":["(3) Seseorang yang tidak mematuhi perintah di bawah subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi lima ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"IX","ex":"Menggunakan bahan yang dilarang selepas perintah dikeluarkan boleh didenda hingga RM500,000."},{"ref":"s.36","sec":"36","title":"(Dipotong)","gist":"Dipotong oleh Akta A1648.","verbatim":["(Dipotong oleh Akta A1648)."],"p":"IX","ex":"Peruntukan ini telah dipotong dan tiada lagi kesannya."},{"ref":"s.37(1)","sec":"37","title":"Kelulusan tataamalan industri","gist":"Menteri, atas syor Majlis atau KP, boleh meluluskan tataamalan industri (ICOP) sebagai panduan mematuhi Akta.","verbatim":["(1) Menteri boleh, atas syor Majlis atau Ketua Pengarah meluluskan tataamalan industri yang terdiri daripada arahan-arahan yang pada hematnya perlu atau patut untuk panduan orang-orang dalam mematuhi kehendak-kehendak peruntukan Akta ini."],"p":"X","ex":"Menteri meluluskan ICOP IAQ 2010 sebagai panduan kualiti udara dalaman."},{"ref":"s.37(2)","sec":"37","title":"Kelulusan tataamalan industri","gist":"Menteri boleh menyemak semula ICOP (pinda, potong, ubah, tambah).","verbatim":["(2) Menteri boleh, atas syor Majlis atau Ketua Pengarah, dari semasa ke semasa mengkaji semula tataamalan industri itu dengan meminda, memotong, mengubah atau menambah peruntukan tataamalan industri itu."],"p":"X","ex":"Menteri meminda ICOP Ruang Terkurung supaya selaras dengan amalan terkini."},{"ref":"s.37(3)","sec":"37","title":"Kelulusan tataamalan industri","gist":"ICOP boleh (a) mengandungi kod, standard, peraturan atau spesifikasi KKP; atau (b) merujuk dokumen yang diterbitkan badan lain (cth. MS, ISO).","verbatim":["(3) Suatu tataamalan industri boleh—","(a) terdiri daripada apa-apa tata, standard, kaedah, spesifikasi atau peruntukan berhubungan dengan keselamatan atau kesihatan pekerjaan yang diluluskan oleh Menteri; atau","(b) memakai, mengandungi atau merujuk kepada mana-mana dokumen yang dirumus atau disiarkan oleh mana-mana badan atau pihak berkuasa yang berkuat kuasa pada masa tataamalan industri itu diluluskan atau sebagaimana yang dipinda, dirumus atau disiarkan dari semasa ke semasa."],"p":"X","ex":"ICOP merujuk MS 1722 sebagai panduan sistem pengurusan KKP."},{"ref":"s.37(4)","sec":"37","title":"Kelulusan tataamalan industri","gist":"Kelulusan, pindaan dan pembatalan ICOP mesti diwartakan.","verbatim":["(4) Menteri hendaklah menyebabkan disiarkan dalam Warta kelulusan sesuatu tataamalan industri dan pemindaan atau pembatalannya."],"p":"X","ex":"Kelulusan ICOP baharu diterbitkan dalam Warta Kerajaan."},{"ref":"s.38(a)","sec":"38","title":"Penggunaan tataamalan industri dalam prosiding","gist":"ICOP yang diluluskan boleh diterima sebagai keterangan di mahkamah.","verbatim":["Dalam mana-mana prosiding di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya yang dalamnya dikatakan bahawa seseorang telah melanggar atau tidak mematuhi peruntukan Akta atau mana-mana peraturan yang dibuat di bawahnya yang berhubungan dengannya suatu tataamalan industri yang diluluskan berkuat kuasa pada masa pelanggaran atau ketakpatuhan yang dikatakan itu—","(a) tataamalan industri yang diluluskan itu hendaklah boleh diterima sebagai keterangan dalam prosiding itu; dan"],"p":"X","ex":"Pendakwa mengemukakan ICOP kerja di tempat tinggi sebagai bukti amalan yang dijangka."},{"ref":"s.38(b)","sec":"38","title":"Penggunaan tataamalan industri dalam prosiding","gist":"Jika peruntukan ICOP berkaitan dan tertuduh tidak mematuhinya, kesalahan dianggap terbukti, kecuali tertuduh membuktikan dia mematuhi Akta dengan cara lain.","verbatim":["Dalam mana-mana prosiding di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya yang dalamnya dikatakan bahawa seseorang telah melanggar atau tidak mematuhi peruntukan Akta atau mana-mana peraturan yang dibuat di bawahnya yang berhubungan dengannya suatu tataamalan industri yang diluluskan berkuat kuasa pada masa pelanggaran atau ketakpatuhan yang dikatakan itu—","(b) jika mahkamah berpuas hati berhubungan dengan apa-apa perkara yang perlu dibuktikan oleh pihak pendakwa bagi membuktikan pelanggaran atau kegagalan yang dikatakan itu bahawa— (i) peruntukan tataamalan industri yang diluluskan itu adalah relevan kepada perkara itu; dan (ii) orang itu pada bila-bila masa tidak mematuhi peruntukan tataamalan industri yang diluluskan itu, perkara itu hendaklah dikira sebagai terbukti melainkan jika mahkamah berpuas hati bahawa berkenaan dengan perkara itu orang itu telah mematuhi peruntukan Akta ini selain daripada dengan cara mematuhi peruntukan tataamalan industri yang diluluskan itu."],"p":"X","ex":"Majikan yang tidak mengikut ICOP ruang terkurung perlu membuktikan dia mematuhi Akta dengan cara lain."},{"ref":"s.39(1)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"Pegawai boleh memasuki, memeriksa dan meneliti mana-mana tempat kerja pada masa munasabah dengan menunjukkan kad kuasa. Rumah kediaman hanya dengan izin pemilik atau jika ada sebab munasabah mempercayai berlaku kesalahan.","verbatim":["(1) Seseorang pegawai keselamatan dan kesihatan pekerjaan, dalam Bahagian ini disebut “Pegawai”, boleh, bagi maksud melaksanakan tujuan Akta ini atau mana-mana peraturan yang dibuat di bawahnya, pada bila-bila masa yang munasabah dan apabila dikemukakan perakuan pemberikuasaannya memasuki, memeriksa dan meneliti mana-mana tempat kerja selain daripada tempat yang digunakan semata-mata bagi maksud kediaman: Dengan syarat bahawa dia boleh memasuki tempat kediaman itu dengan kebenaran pemunyanya atau jika dia mempunyai sebab munasabah untuk mempercayai bahawa pelanggaran Akta ini atau mana-mana peraturan yang dibuat di bawahnya telah atau mungkin akan dilakukan."],"p":"XI","ex":"Pegawai JKKP menunjukkan kad kuasa dan memasuki kilang pada waktu operasi untuk pemeriksaan."},{"ref":"s.39(2)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"[DIPINDA 2024] Pegawai boleh: (a) memeriksa loji, bahan atau barang; (b) mengarahkan kawasan dibiarkan tidak diusik; (c) mengambil ukuran, gambar dan rakaman; (d) mengambil sampel bahan dan udara; (e) mengarahkan pekerja menjalani pemeriksaan perubatan jika ada penyakit/keracunan pekerjaan; (f) meminta buku, rekod, perakuan, data komputer atau dokumen dan membuat salinan; (g) menilai tahap bising, pencahayaan, haba atau bahan berbahaya; (h) meminta hospital, klinik atau rumah mayat memberi maklumat (termasuk laporan perubatan) pekerja yang cedera atau disyaki sakit akibat kerja.","verbatim":["(2) Dalam menjalankan kuasanya di bawah subseksyen (1), seseorang pegawai boleh—","(a) membuat pemeriksaan, penelitian dan penyiasatan mengenai apa-apa loji, bahan, artikel atau benda lain jua pun sebagaimana yang perlu untuk menentukan sama ada atau tidak Akta ini atau mana-mana peraturan yang dibuat di bawahnya telah dipatuhi;","(b) mengarahkan supaya tempat kerja itu atau mana-mana bahagiannya, atau apa-apa jua di dalamnya, hendaklah tidak diganggu, sama ada pada amnya atau dalam hal-hal tertentu, selama yang semunasabahnya perlu bagi maksud apa-apa pemeriksaan, penelitian atau penyiasatan di bawah perenggan (a);","(c) mengambil apa-apa ukuran atau gambar dan membuat apa-apa rekod yang dianggapnya perlu bagi maksud apa-apa pemeriksaan, penelitian atau penyiasatan di bawah perenggan (a);","(d) mengambil sampel apa-apa artikel atau bahan yang dijumpai dalam tempat kerja yang dia mempunyai kuasa untuk memasukinya, dan udara dalam atau di sekitar mana-mana tempat kerja itu;","(e) menghendaki mana-mana orang yang diambil khidmat di sesuatu tempat kerja di mana-mana penyakit pekerjaan atau keracunan pekerjaan yang dinyatakan dalam mana-mana peraturan atau perintah yang dibuat oleh Menteri di bawah Akta ini telah terjadi atau mungkin akan terjadi, diperiksa secara perubatan oleh seorang pegawai perubatan atau pengamal perubatan berdaftar;","(f) menghendaki pengemukaan apa-apa buku, rekod, perakuan, notis, data berkomputer atau dokumen, atau apa-apa salinannya yang diperakui, dan membuat salinannya yang difikirkannya perlu bagi maksud apa-apa pemeriksaan, penelitian atau penyiasatan;","(g) menilai tahap bising, pencahayaan, panas atau bahan yang merosakkan atau berbahaya di mana-mana tempat kerja dan tahap pendedahan orang yang sedang bekerja di dalamnya;","(h) menghendaki mana-mana hospital, klinik perubatan atau bilik mayat untuk memberikan apa-apa maklumat (termasuk laporan perubatan) tentang mana-mana orang yang atau telah bekerja di tempat kerja yang cedera dalam kemalangan di tempat kerja atau yang disyaki menghidapi penyakit pekerjaan yang didapati dari tempat kerja dan sedang menerima rawatan di hospital atau klinik perubatan itu."],"p":"XI","ex":"Pegawai mengambil gambar mesin rosak dan mengarahkan kawasan kemalangan tidak diusik."},{"ref":"s.39(3)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"Jika loji atau bahan berbahaya, pegawai boleh (a) menyuruhnya dibuka atau diuji (tanpa merosakkannya); (b) mengambil milik dan menahannya untuk pemeriksaan, elak diusik, atau dijadikan keterangan.","verbatim":["(3) Jika seseorang pegawai berpendapat bahawa loji atau bahan telah menyebabkan atau mungkin akan menyebabkan bahaya kepada keselamatan dan kesihatan, dia boleh—","(a) menyebabkannya dirombak atau dikenakan apa-apa proses atau ujian di mana-mana tempat yang sesuai dan pada bila-bila masa yang munasabah yang ditetapkannya, tetapi tidak sehingga merosakkan atau memusnahkannya;","(b) mengambil milik dan menahannya selama yang perlu bagi semua atau mana-mana maksud yang berikut: (i) memeriksanya dan melakukan apa-apa jua padanya yang dia mempunyai kuasa untuk melakukannya; (ii) memastikan bahawa ia tidak diganggu sebelum dia selesai memeriksanya; (iii) memastikan bahawa ia tersedia untuk digunakan sebagai bukti dalam apa-apa prosiding bagi sesuatu kesalahan di bawah mana-mana peruntukan Akta ini atau peraturan yang dibuat di bawahnya."],"p":"XI","ex":"Pegawai menahan tali dawai kren yang putus untuk dijadikan bukti."},{"ref":"s.39(4)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"Pegawai yang juga pegawai perubatan boleh (a) menjalankan pemeriksaan perubatan dan (b) menggunakan kuasa di s.39(2) dan (3).","verbatim":["(4) Jika seseorang pegawai ialah seorang pegawai perubatan, dia boleh—","(a) menjalankan apa-apa pemeriksaan perubatan yang perlu bagi maksud kewajipannya di bawah Akta ini atau peraturan yang dibuat di bawahnya; dan","(b) menjalankan apa-apa kuasa lain yang perlu atau yang diberikan di bawah subseksyen (2) dan (3)."],"p":"XI","ex":"Pegawai perubatan JKKP memeriksa pekerja yang disyaki terdedah kepada bahan kimia."},{"ref":"s.39(5)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"Pegawai boleh meminta bantuan polis jika menjangka halangan serius.","verbatim":["(5) Seseorang pegawai boleh bagi maksud seksyen ini meminta bilamasa perlu bantuan polis jika dia mempunyai sebab munasabah untuk mengkhuatiri apa-apa halangan serius dalam pelaksanaan tugasnya."],"p":"XI","ex":"Pegawai meminta bantuan polis kerana pemilik kilang mengancam untuk menghalang pemeriksaan."},{"ref":"s.39(6)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"Pegawai boleh membawa (a) orang lain yang diberi kuasa KP dan (b) peralatan yang diperlukan.","verbatim":["(6) Tanpa menjejaskan subseksyen (5), dalam memasuki mana-mana tempat kerja atau tempat kediaman alasan yang oleh sebab subseksyen (1), seseorang pegawai boleh membawa bersamanya—","(a) mana-mana orang lain yang diberi kuasa dengan sewajarnya oleh Ketua Pengarah; atau","(b) apa-apa kelengkapan atau benda yang dikehendaki bagi apa-apa maksud yang baginya kuasa untuk masuk dijalankan."],"p":"XI","ex":"Pegawai membawa jurutera dan meter bunyi bersamanya semasa pemeriksaan."},{"ref":"s.40","sec":"40","title":"Kemasukan ke dalam premis dengan waran geledah dan kuasa untuk menyita","gist":"Dengan waran geledah daripada Majistret, pegawai boleh memasuki tempat kerja atau kediaman pada bila-bila masa munasabah (siang atau malam), menggeledah, dan menyita atau memeterai barang keterangan.","verbatim":["Dalam tiap-tiap hal jika maklumat diberikan dengan bersumpah kepada seseorang Majistret bahawa ada sebab yang munasabah untuk mengesyaki bahawa di dalam tempat kerja atau tempat kediaman terdapat apa-apa artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagiannya yang telah digunakan untuk melakukan atau dicadangkan hendak digunakan untuk melakukan sesuatu kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya, dia hendaklah mengeluarkan suatu waran di bawah tandatangannya yang menurut kuasanya seseorang pegawai yang dinamakan atau disebut dalam waran itu boleh memasuki tempat kerja atau tempat kediaman itu pada bila-bila masa yang munasabah pada waktu siang atau malam, dan mencari dan menyita atau mengelak artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagiannya itu."],"p":"XI","ex":"Pegawai mendapatkan waran daripada Majistret untuk menggeledah stor yang disyaki menyimpan bahan dilarang."},{"ref":"s.41","sec":"41","title":"Kemasukan ke dalam premis tanpa waran geledah dan kuasa untuk menyita","gist":"Tanpa waran: jika kelewatan mendapatkan waran mungkin menyebabkan barang keterangan dialihkan atau dimusnahkan, pegawai boleh masuk dan menyita atau memeterainya. Memecahkan meterai atau mengalihkan barang tanpa kuasa adalah kesalahan.","verbatim":["Jika seseorang pegawai berpuas hati berdasarkan maklumat yang diterima bahawa dia mempunyai alasan yang munasabah bagi mempercayai bahawa, oleh sebab kelengahan dalam mendapatkan waran geledah, apa-apa artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagiannya dalam tempat kerja atau tempat kediaman yang digunakan untuk melakukan atau dicadangkan hendak digunakan untuk melakukan sesuatu kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya mungkin akan dialihkan atau dimusnahkan, dia boleh memasuki tempat kerja atau tempat kediaman itu tanpa waran dan menyita atau mengelak artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagiannya itu yang dijumpai dalamnya: Dengan syarat bahawa adalah menjadi suatu kesalahan jika seseorang tanpa kuasa yang sah memecahkan, mengganggu atau merosakkan lak sedemikian atau mengalihkan mana-mana artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagian itu atau cuba berbuat demikian."],"p":"XI","ex":"Pegawai memeterai mesin yang terlibat dalam kemalangan tanpa waran kerana bimbang ia akan dibaiki dan bukti hilang."},{"ref":"s.42(1)","sec":"42","title":"Kuasa untuk masuk secara paksa dan penyampaian kepada penghuni salinan bertandatangan senarai benda yang disita dari premis","gist":"Semasa menjalankan s.40 atau 41, pegawai boleh (a) memecah pintu; (b) masuk secara paksa; (c) mengalihkan halangan secara paksa; (d) menahan orang di situ sehingga geledahan selesai.","verbatim":["(1) Seseorang pegawai boleh, dalam menjalankan kuasanya di bawah seksyen 40 atau 41, jika perlu untuk berbuat demikian—","(a) memecah buka mana-mana pintu luar atau dalam sesuatu tempat kerja atau tempat kediaman dan memasukinya;","(b) dengan menggunakan kekerasan memasuki tempat itu dan tiap-tiap bahagiannya;","(c) dengan menggunakan kekerasan mengalihkan apa-apa halangan kepada kemasukan, penggeledahan, penyitaan dan pengalihan yang dia diberi kuasa untuk melaksanakannya; dan","(d) menahan tiap-tiap orang yang dijumpai di tempat itu sehingga tempat itu digeledah."],"p":"XI","ex":"Pegawai memecah kunci stor apabila pemilik enggan membukanya semasa geledahan berwaran."},{"ref":"s.42(2)","sec":"42","title":"Kuasa untuk masuk secara paksa dan penyampaian kepada penghuni salinan bertandatangan senarai benda yang disita dari premis","gist":"Pegawai mesti menyediakan senarai barang yang disita dan menyerahkan salinan bertandatangan kepada penghuni (atau menampalnya jika premis kosong).","verbatim":["(2) Pegawai yang menyita apa-apa artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagiannya di bawah seksyen 40 atau 41 hendaklah menyediakan suatu senarai benda yang disita dan dengan serta-merta, atau dengan seberapa segera yang praktik, menyerahkan suatu salinan senarai itu yang ditandatangani olehnya kepada penghuni, atau ejen atau pengkhidmatnya yang berada di premis itu, dan jika premis itu tidak dihuni, pegawai itu hendaklah, di mana-mana mungkin, menampalkan suatu senarai benda yang disita di premis itu."],"p":"XI","ex":"Pegawai menyediakan senarai barang yang disita dan menyerahkan salinannya kepada pengurus kilang."},{"ref":"s.43(1)","sec":"43","title":"Peruntukan lanjut berhubungan dengan pemeriksaan","gist":"Apabila masuk, pegawai mesti memaklumkan majikan dan JKK.","verbatim":["(1) Apabila memasuki mana-mana tempat kerja seseorang pegawai hendaklah mengambil segala langkah yang munasabah untuk memberitahu majikan dan jawatankuasa keselamatan dan kesihatan mengenai kemasukan itu."],"p":"XI","ex":"Pegawai memaklumkan pengurus dan pengerusi JKK apabila tiba untuk pemeriksaan."},{"ref":"s.43(2)","sec":"43","title":"Peruntukan lanjut berhubungan dengan pemeriksaan","gist":"Selepas pemeriksaan, pegawai memberitahu majikan dan JKK pemerhatian dan tindakan yang dicadangkan.","verbatim":["(2) Apabila selesai sesuatu siasatan seseorang pegawai hendaklah memberi majikan dan jawatankuasa keselamatan dan kesihatan maklumat berkenaan dengan pemerhatiannya dan apa-apa tindakan yang dia bercadang untuk mengambilnya berhubungan dengan tempat kerja."],"p":"XI","ex":"Selepas pemeriksaan, pegawai menerangkan dapatan dan tindakan yang dicadangkan kepada majikan dan JKK."},{"ref":"s.43(3)","sec":"43","title":"Peruntukan lanjut berhubungan dengan pemeriksaan","gist":"Jika mengambil sampel, pegawai memaklumkan majikan dan JKK, dan (a) membahagi serta memeterai sampel; (b) memberi satu bahagian kepada majikan/JKK jika diminta; (c) menyimpan satu bahagian; (d) menghantar satu bahagian untuk analisis.","verbatim":["(3) Jika seseorang pegawai bercadang untuk mengambil dan mengalihkan suatu sampel dari tempat kerja bagi maksud penganalisisan, dia hendaklah memberitahu majikan dan jawatankuasa keselamatan dan kesihatan dan selepas mengambil sampel itu dia hendaklah jika mungkin—","(a) membahagi sampel yang diambil kepada seberapa banyak bahagian yang perlu dan menandakan dan mengelak atau menandakan dan menutup setiap bahagian mengikut cara yang dibenarkan oleh sifatnya;","(b) jika dikehendaki oleh majikan atau jawatankuasa keselamatan dan kesihatan, menyerahkan satu bahagian setiap satunya kepada majikan atau jawatankuasa keselamatan dan kesihatan;","(c) menyimpan satu bahagian bagi perbandingan masa hadapan; dan","(d) jika penganalisisan sampel hendak dibuat, mengemukakan satu bahagian lain kepada seseorang penganalisis bagi penganalisisan."],"p":"XI","ex":"Pegawai membahagi sampel pelarut kepada tiga, memeterainya dan memberi satu bahagian kepada majikan."},{"ref":"s.44(1)","sec":"44","title":"Kuasa untuk menyiasat","gist":"Pegawai berkuasa menyiasat kesalahan di bawah Akta dan peraturan.","verbatim":["(1) Seseorang pegawai hendaklah mempunyai kuasa untuk menyiasat pelakuan apa-apa kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya."],"p":"XI","ex":"Pegawai menyiasat syarikat yang disyaki mengendalikan dandang tanpa PMA."},{"ref":"s.44(2)","sec":"44","title":"Kuasa untuk menyiasat","gist":"Pegawai boleh menggunakan kuasa khas penyiasatan polis, kecuali menangkap tanpa waran.","verbatim":["(2) Seseorang pegawai boleh, berhubungan dengan suatu kesalahan yang dilakukan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya, menjalankan kuasa-kuasa khas berhubungan dengan penyiasatan polis kecuali bahawa kuasa untuk menangkap tanpa waran yang diberikan oleh Kanun Prosedur Jenayah [Akta 593] bagi mana-mana kesalahan boleh tangkap tidak boleh dijalankan olehnya."],"p":"XI","ex":"Pegawai merakam percakapan saksi seperti polis tetapi tidak boleh menangkap tanpa waran."},{"ref":"s.44(3)","sec":"44","title":"Kuasa untuk menyiasat","gist":"Selepas siasatan, maklumat diserahkan kepada pegawai balai polis; polis boleh menangkap dengan waran.","verbatim":["(3) Apabila penyiasatannya selesai, pegawai itu hendaklah dengan segera memberikan segala maklumat yang berhubungan dengan pelakuan kesalahan itu kepada pegawai penjaga suatu balai polis dan seseorang pegawai polis boleh, dengan waran, menangkap mana-mana orang yang mungkin telah melakukan kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya."],"p":"XI","ex":"Selepas siasatan, pegawai menyerahkan maklumat kepada polis yang kemudian menangkap suspek dengan waran."},{"ref":"s.45(1)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Pegawai boleh memeriksa secara lisan sesiapa yang mengetahui fakta kes.","verbatim":["(1) Seseorang pegawai yang membuat suatu siasatan di bawah seksyen 39 atau 44 boleh memeriksa secara lisan mana-mana orang yang pada hematnya mengetahui fakta-fakta dan hal keadaan kes itu."],"p":"XI","ex":"Pegawai menyoal pengendali kren tentang kejadian sebelum kemalangan."},{"ref":"s.45(2)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Orang itu wajib menjawab, tetapi boleh enggan jika pegawai tidak menunjukkan kad kuasa, atau jika jawapan boleh mendedahkannya kepada pertuduhan jenayah.","verbatim":["(2) Orang yang disebut dalam subseksyen (1) adalah terikat di sisi undang-undang untuk menjawab segala soalan yang berhubungan dengan kes itu yang diajukan kepadanya oleh pegawai itu: Dengan syarat bahawa orang itu boleh enggan menjawab mana-mana soalan jika pegawai itu tidak atau enggan, apabila diminta, untuk mengemukakan kepadanya perakuan pemberikuasaan yang dikeluarkan oleh Ketua Pengarah kepada pegawai itu di bawah subseksyen 7(1): Dengan syarat selanjutnya bahawa orang itu boleh enggan menjawab mana-mana
