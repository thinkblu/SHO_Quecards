","title":"Hak pekerja","gist":"[BAHARU 2024] Selepas memaklumkan majikan bahawa ada justifikasi munasabah wujud bahaya yang hampir berlaku, pekerja berhak mengundurkan diri daripada bahaya atau kerja itu jika majikan gagal bertindak.","verbatim":["(1) Seseorang pekerja, selepas memberitahu majikannya atau wakilnya bahawa dia mempunyai justifikasi yang munasabah untuk mempercayai terdapat suatu bahaya hampir pasti berlaku di tempat kerjanya, hendaklah mempunyai hak untuk mengeluarkan dirinya daripada bahaya atau kerja itu jika majikan itu gagal untuk mengambil apa-apa tindakan untuk menghapuskan bahaya itu."],"p":"VI"},{"ref":"s.26A(2)","sec":"26A","title":"Hak pekerja","gist":"Pekerja yang mengundurkan diri dilindungi daripada akibat buruk dan tidak boleh didiskriminasi.","verbatim":["(2) Seseorang pekerja yang mengeluarkan dirinya daripada bahaya mengikut subseksyen (1) hendaklah dilindungi daripada akibat tidak wajar dan tidak boleh didiskriminasikan."],"p":"VI"},{"ref":"s.26A(3)","sec":"26A","title":"Hak pekerja","gist":"Tafsiran \"bahaya yang hampir berlaku\": risiko serius kematian atau kecederaan tubuh yang serius akibat loji, bahan, keadaan, aktiviti, proses, amalan, prosedur atau hazard tempat kerja.","verbatim":["(3) Bagi maksud seksyen ini, “bahaya hampir pasti berlaku” ertinya suatu risiko kematian yang serius atau kecederaan badan yang serius kepada mana-mana orang yang disebabkan oleh mana-mana loji, bahan, keadaan, aktiviti, proses, amalan, tatacara atau bahaya tempat kerja."],"p":"VI"},{"ref":"s.27(1)","sec":"27","title":"Diskriminasi terhadap pekerja, dsb.","gist":"[DIPINDA 2024] Majikan tidak boleh membuang kerja, memudaratkan atau mengubah kedudukan pekerja hanya kerana pekerja itu: (a) membuat aduan tentang perkara tidak selamat; (b) ahli JKK; (c) menjalankan fungsi sebagai ahli JKK; atau (d) [BAHARU] membantu pegawai atau penilai dalam siasatan, pemeriksaan atau penyiasatan.","verbatim":["(1) Tiada majikan boleh memecat seseorang pekerja, mencederakannya dalam pekerjaannya atau mengubah kedudukannya sehingga memudaratkannya semata-mata oleh sebab pekerja itu—","(a) membuat suatu aduan mengenai perkara yang dianggapnya tidak selamat atau suatu risiko kepada kesihatan;","(b) adalah anggota jawatankuasa keselamatan dan kesihatan yang ditubuhkan menurut Akta ini;","(c) menjalankan mana-mana fungsinya sebagai anggota jawatankuasa keselamatan dan kesihatan itu.; atau","(d) telah membantu pegawai atau pengapit dalam mana-mana siasatan dalam menjalankan apa-apa pemeriksaan atau penyiasatan di bawah Akta ini."],"p":"VI"},{"ref":"s.27(2)","sec":"27","title":"Diskriminasi terhadap pekerja, dsb.","gist":"Kesatuan sekerja tidak boleh mengambil tindakan terhadap ahli atas sebab (a) hingga (c) yang sama.","verbatim":["(2) Tiada kesatuan sekerja boleh mengambil apa-apa tindakan ke atas mana-mana anggotanya yang, sebagai seorang pekerja di sesuatu tempat kerja—","(a) membuat suatu aduan mengenai perkara yang dianggapnya tidak selamat atau suatu risiko kepada kesihatan;","(b) adalah anggota jawatankuasa keselamatan dan kesihatan yang ditubuhkan menurut Akta ini; atau","(c) menjalankan mana-mana fungsinya sebagai anggota jawatankuasa keselamatan dan kesihatan itu."],"p":"VI"},{"ref":"s.27(3)","sec":"27","title":"Diskriminasi terhadap pekerja, dsb.","gist":"[DIPINDA 2024] Penalti: hingga RM100,000 atau 1 tahun atau kedua-duanya (dahulu RM10,000).","verbatim":["(3) Seseorang majikan atau kesatuan sekerja yang melanggar peruntukan seksyen ini adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"VI"},{"ref":"s.27(4)","sec":"27","title":"Diskriminasi terhadap pekerja, dsb.","gist":"Mahkamah juga boleh memerintahkan (a) pampasan kepada orang yang didiskriminasi, dan/atau (b) pekerja diambil semula ke jawatan asal atau jawatan setara.","verbatim":["(4) Walau apa pun mana-mana undang-undang bertulis yang berlawanan, jika seseorang disabitkan atas suatu kesalahan di bawah seksyen ini Mahkamah boleh, sebagai tambahan kepada penalti yang dikenakan ke atas pesalah, membuat salah satu atau kedua-dua perintah yang berikut:","(a) suatu perintah supaya pesalah itu membayar dalam tempoh tertentu kepada orang yang telah didiskriminasikan oleh pesalah itu apa-apa ganti rugi yang difikirkannya sesuai sebagai pampasan bagi orang itu;","(b) suatu perintah supaya pekerja itu dikembalikan atau diambil bekerja semula pada jawatannya yang dahulu atau, jika jawatan itu tidak ada, pada jawatan yang serupa."],"p":"VI"},{"ref":"s.27A(1)","sec":"27A","title":"Notis menduduki tempat kerja","gist":"Sesiapa yang menduduki premis sebagai tempat kerja atau menjalankan aktiviti di tempat kerja mesti memberi notis kepada pegawai mengikut butiran, cara dan masa yang ditentukan KP.","verbatim":["(1) Tertakluk kepada subseksyen (2), mana-mana orang yang menduduki atau menggunakan mana-mana premis sebagai tempat kerja atau mengusahakan apa-apa aktiviti di dalam tempat kerja hendaklah memberikan notis kepada seorang pegawai yang mengandungi apa-apa butiran, dan mengikut apa-apa cara dan dalam apa-apa tempoh, sebagaimana yang ditentukan oleh Ketua Pengarah."],"p":"VIA"},{"ref":"s.27A(2)","sec":"27A","title":"Notis menduduki tempat kerja","gist":"Kewajipan notis hanya bagi tempat kerja dan aktiviti yang ditetapkan Menteri.","verbatim":["(2) Kehendak untuk memberikan notis di bawah subseksyen (1) hendaklah hanya terpakai bagi tempat kerja dan aktiviti sebagaimana yang ditetapkan oleh Menteri."],"p":"VIA"},{"ref":"s.27A(3)","sec":"27A","title":"Notis menduduki tempat kerja","gist":"Penalti: hingga RM100,000 atau 1 tahun atau kedua-duanya.","verbatim":["(3) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"VIA"},{"ref":"s.27B","sec":"27B","title":"Penetapan loji yang menghendaki perakuan kelayakan","gist":"Menteri boleh menetapkan loji yang memerlukan PMA (cth. dandang, bejana tekanan, lif, kren).","verbatim":["Menteri boleh menetapkan mana-mana loji yang baginya suatu perakuan kelayakan dikehendaki."],"p":"VIA"},{"ref":"s.27C(1)","sec":"27C","title":"Pemasangan loji","gist":"Tidak boleh memasang loji yang ditetapkan kecuali memenuhi semua keperluan dan mendapat kelulusan bertulis KP.","verbatim":["(1) Tiada seorang pun boleh memasang atau menyebabkan untuk dipasang mana-mana loji yang ditetapkan di bawah seksyen 27B melainkan jika orang itu memastikan bahawa loji itu telah memenuhi semua kehendak yang ditetapkan oleh Menteri dan telah mendapat kelulusan bertulis daripada Ketua Pengarah."],"p":"VIA"},{"ref":"s.27C(2)","sec":"27C","title":"Pemasangan loji","gist":"Permohonan kelulusan dikemukakan kepada KP dengan butiran yang ditentukan.","verbatim":["(2) Seseorang boleh memohon bagi kelulusan yang disebut dalam subseksyen (1) dengan mengemukakan kepada Ketua Pengarah apa-apa butiran mengikut apa-apa cara dan dalam apa-apa tempoh sebagaimana yang ditentukan oleh Ketua Pengarah."],"p":"VIA"},{"ref":"s.27C(3)","sec":"27C","title":"Pemasangan loji","gist":"KP boleh meluluskan dengan terma dan syarat.","verbatim":["(3) Apabila menerima dan mempertimbangkan suatu permohonan di bawah subseksyen (2), Ketua Pengarah boleh memberikan kelulusan tertakluk pada apa-apa terma dan syarat sebagaimana yang boleh dikenakan oleh Ketua Pengarah."],"p":"VIA"},{"ref":"s.27C(4)","sec":"27C","title":"Pemasangan loji","gist":"Penalti: hingga RM100,000 atau 1 tahun atau kedua-duanya.","verbatim":["(4) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"VIA"},{"ref":"s.27D(1)","sec":"27D","title":"Perakuan kelayakan","gist":"Loji yang dipasang tidak boleh dikendalikan tanpa PMA daripada pegawai atau orang berlesen.","verbatim":["(1) Tiada seorang pun boleh mengendalikan atau menyebabkan atau membenarkan untuk dikendalikan mana-mana loji yang telah dipasang di bawah seksyen 27C melainkan jika loji itu mempunyai suatu perakuan kelayakan yang dikeluarkan oleh seorang pegawai atau orang berlesen."],"p":"VIA"},{"ref":"s.27D(2)","sec":"27D","title":"Perakuan kelayakan","gist":"Selepas pemasangan, notis bertulis diberi kepada pegawai/orang berlesen, yang kemudian memeriksa loji.","verbatim":["(2) Apabila loji yang ditetapkan telah dipasang di bawah seksyen 27C, orang itu hendaklah menyampaikan suatu notis bertulis ke atas seorang pegawai atau orang berlesen yang, selepas menerima notis itu, hendaklah membuat pemeriksaan ke atas loji itu."],"p":"VIA"},{"ref":"s.27D(3)","sec":"27D","title":"Perakuan kelayakan","gist":"Jika (a) patuh: PMA dikeluarkan selepas bayaran fi; (b) tidak patuh: fi tetap dibayar walaupun PMA tidak dikeluarkan.","verbatim":["(3) Jika, apabila pemeriksaan, pegawai atau orang berlesen itu mendapati loji itu—","(a) mematuhi semua kehendak yang ditetapkan oleh Menteri berkenaan dengan loji itu, pegawai atau orang berlesen itu hendaklah mengeluarkan suatu perakuan kelayakan selepas pembayaran apa-apa fi oleh orang itu sebagaimana yang ditetapkan oleh Menteri; atau","(b) tidak mematuhi mana-mana kehendak yang ditetapkan oleh Menteri berkenaan dengan loji itu, orang itu hendaklah membayar kepada pegawai atau orang berlesen itu apa-apa fi yang ditetapkan oleh Menteri bagi perkhidmatan yang diberikan walaupun tiada perakuan kelayakan dikeluarkan."],"p":"VIA"},{"ref":"s.27D(4)","sec":"27D","title":"Perakuan kelayakan","gist":"Bentuk, syarat dan tempoh sah PMA ditetapkan Menteri.","verbatim":["(4) Suatu perakuan kelayakan yang dikeluarkan di bawah subseksyen (3) hendaklah dalam apa-apa bentuk dan tertakluk kepada apa-apa terma dan syarat, dan hendaklah sah bagi apa-apa tempoh, sebagaimana yang ditetapkan oleh Menteri."],"p":"VIA"},{"ref":"s.27D(5)","sec":"27D","title":"Perakuan kelayakan","gist":"Kendali tanpa PMA: hingga RM100,000 atau 1 tahun atau kedua-duanya.","verbatim":["(5) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"VIA"},{"ref":"s.27D(6)","sec":"27D","title":"Perakuan kelayakan","gist":"Pegawai mesti segera memberi notis larangan kendali, atau menjadikan loji tidak boleh dikendalikan, sehingga PMA dikeluarkan.","verbatim":["(6) Dalam hal apa-apa pelanggaran subseksyen (1), seseorang pegawai hendaklah dengan serta-merta menyampaikan kepada orang yang mengendalikan atau menyebabkan atau membenarkan untuk dikendalikan loji suatu notis bertulis yang melarang pengendalian loji itu atau boleh menyebabkan loji itu tidak boleh dikendalikan sehingga suatu perakuan kelayakan dikeluarkan."],"p":"VIA"},{"ref":"s.27D(7)","sec":"27D","title":"Perakuan kelayakan","gist":"Ingkar notis di s.27D(6): hingga RM500,000 atau 2 tahun atau kedua-duanya.","verbatim":["(7) Seseorang yang tidak mematuhi notis yang dikeluarkan di bawah subseksyen (6) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi lima ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"VIA"},{"ref":"s.27D(8)","sec":"27D","title":"Perakuan kelayakan","gist":"PMA tamat apabila loji dibuka, dibaiki atau rosak, kecuali dikecualikan KP jika tidak membahayakan.","verbatim":["(8) Suatu perakuan kelayakan berkenaan dengan apa-apa loji yang sedang dibuka atau dibaiki atau rosak atas apa-apa sebab hendaklah tamat apabila loji itu dibuka, dibaiki atau rosak, tetapi Ketua Pengarah boleh mengecualikan mana-mana loji daripada pemakaian subseksyen ini jika pada pendapatnya loji itu tidak akan menyebabkan apa-apa bahaya kepada mana-mana orang atau harta."],"p":"VIA"},{"ref":"s.27D(9)","sec":"27D","title":"Perakuan kelayakan","gist":"Tafsiran (a) \"rosak\", (b) \"buka\" dan (c) \"baiki\" bagi tujuan s.27D(8).","verbatim":["(9) Bagi maksud subseksyen (8)—","(a) “rosak” ertinya apa-apa kecacatan fizikal yang terjadi kepada mana-mana loji semasa pengendalian atau selainnya yang boleh menjejaskan kekuatan dan integriti loji itu semasa pengendalian berikutnya;","(b) “dibuka” ertinya untuk membuka mana-mana bahagian mana-mana loji yang boleh menjejaskan kekuatan, integriti atau keupayaan fungsian loji itu;","(c) “dibaiki” ertinya apa-apa kerja yang dilakukan untuk membaik pulih mana-mana bahagian mana-mana loji yang telah rosak."],"p":"VIA"},{"ref":"s.27E(1)","sec":"27E","title":"Pemeriksaan berkala loji","gist":"Loji yang ditetapkan mesti diperiksa secara berkala oleh pegawai atau orang berlesen mengikut tempoh dan cara yang ditetapkan.","verbatim":["(1) Suatu loji yang ditetapkan di bawah seksyen 27B hendaklah diperiksa oleh seorang pegawai atau orang berlesen pada bila-bila masa dan mengikut apa-apa cara sebagaimana yang ditetapkan oleh Menteri."],"p":"VIA"},{"ref":"s.27E(2)","sec":"27E","title":"Pemeriksaan berkala loji","gist":"Pemeriksaan tertakluk kepada bayaran fi.","verbatim":["(2) Suatu pemeriksaan di bawah subseksyen (1) hendaklah tertakluk kepada pembayaran apa-apa fi sebagaimana yang ditetapkan oleh Menteri."],"p":"VIA"},{"ref":"s.27F(1)","sec":"27F","title":"Skim pemeriksaan khas","gist":"Penghuni boleh memohon kepada KP skim pemeriksaan khas bagi kelas loji tertentu, dengan fi.","verbatim":["(1) Walau apa pun seksyen 27E, seseorang penghuni boleh memohon kepada Ketua Pengarah untuk kelulusan bagi skim pemeriksaan khas mengenai pemeriksaan bagi kelas loji tertentu dan tambahannya bersama-sama dengan apa-apa fi sebagaimana yang ditetapkan oleh Menteri."],"p":"VIA"},{"ref":"s.27F(2)","sec":"27F","title":"Skim pemeriksaan khas","gist":"KP boleh meluluskan jika keperluan Menteri dipenuhi.","verbatim":["(2) Ketua Pengarah boleh meluluskan suatu permohonan di bawah subseksyen (1) jika dia berpuas hati bahawa kehendak yang ditetapkan oleh Menteri berkenaan dengan loji itu telah dipenuhi."],"p":"VIA"},{"ref":"s.27F(3)","sec":"27F","title":"Skim pemeriksaan khas","gist":"Selepas diluluskan, pemeriksaan dijalankan mengikut skim khas itu.","verbatim":["(3) Apabila kelulusan di bawah subseksyen (2) diberikan, pemeriksaan loji itu hendaklah dijalankan mengikut skim pemeriksaan khas."],"p":"VIA"},{"ref":"s.27G(1)","sec":"27G","title":"Ketua Pengarah boleh membuat perintah dalam hal keadaan tertentu","gist":"KP boleh membuat perintah khas untuk keselamatan orang yang bekerja dengan atau berhampiran loji atau proses.","verbatim":["(1) Ketua Pengarah boleh membuat perintah khas bagi kelakuan dan panduan orang yang diambil kerja dalam mana-mana perkhidmatan yang melibatkan pengurusan atau pengendalian, atau penjagaan, atau kedekatan dengan, mana-mana loji atau proses yang dijalankan di dalam mana-mana tempat kerja yang ternyata padanya adalah perlu untuk memastikan keselamatan dan kesihatan mereka."],"p":"VIA"},{"ref":"s.27G(2)","sec":"27G","title":"Ketua Pengarah boleh membuat perintah dalam hal keadaan tertentu","gist":"Majikan mesti memastikan pekerja yang terdedah mengetahuinya, dan pekerja mesti mematuhinya.","verbatim":["(2) Majikan hendaklah memastikan dengan segala cara yang munasabah bahawa orang yang terdedah kepada bahaya sedar akan apa-apa perintah khas yang dibuat di bawah subseksyen (1) dan orang itu hendaklah mematuhi perintah khas itu."],"p":"VIA"},{"ref":"s.27G(3)","sec":"27G","title":"Ketua Pengarah boleh membuat perintah dalam hal keadaan tertentu","gist":"Menampal salinan perintah dalam bahasa yang sesuai di tempat mudah dilihat berhampiran loji dianggap cara yang munasabah.","verbatim":["(3) Bagi maksud subseksyen (2), suatu salinan perintah khas Ketua Pengarah yang dicetak atau ditulis dalam bahasa yang sesuai dan ditampalkan di tempat yang mudah dilihat yang berhampiran dengan loji atau proses yang dimaksudkan oleh perintah khas itu, supaya semua orang yang disebut itu mempunyai akses dan peluang yang bebas untuk membaca perintah khas itu, hendaklah disifatkan menjadi cara yang munasabah."],"p":"VIA"},{"ref":"s.28(1)","sec":"28","title":"Perkhidmatan kesihatan pekerjaan","gist":"[DIPINDA 2024] Menteri boleh membuat peraturan mewajibkan perkhidmatan kesihatan pekerjaan jika: (a) berlaku penyakit yang mungkin disebabkan kerja; (b) perubahan proses atau bahan baharu mungkin menjejaskan kesihatan; (c) dipotong; (d) ada risiko bagi pekerjaan dalam Jadual Ketiga atau bahan yang dibawa masuk.","verbatim":["(1) Jika Menteri mendapati bahawa dalam mana-mana tempat kerja atau kelas atau jenis tempat kerja—","(a) kes-kes penyakit telah terjadi yang dia mempunyai sebab untuk percaya mungkin disebabkan oleh jenis proses atau keadaan lain kerja;","(b) oleh sebab perubahan dalam mana-mana proses atau dalam bahan yang digunakan dalam mana-mana proses atau, oleh sebab pengenalan apa-apa proses baru atau bahan baru bagi kegunaan dalam sesuatu proses, mungkin terdapat risiko kesan buruk kepada kesihatan orang-orang yang diambil kerja dalam proses itu; atau","(c) (Dipotong oleh Akta A1648);","(d) mungkin terdapat risiko kesan buruk kepada kesihatan orang-orang yang diambil kerja dalam mana-mana pekerjaan yang dinyatakan dalam Jadual Ketiga, atau daripada apa-apa bahan atau benda yang dibawa ke tempat kerja itu untuk digunakan atau dikendalikan dalamnya atau daripada apa-apa perubahan keadaan dalam tempat kerja itu, dia boleh membuat peraturan-peraturan menghendaki perkiraan bagi perkhidmatan kesihatan pekerjaan."],"p":"VII"},{"ref":"s.28(2)–(3)","sec":"28","title":"Perkhidmatan kesihatan pekerjaan","gist":"Dipotong oleh Akta A1648.","verbatim":["(2) (Dipotong oleh Akta A1648).","(3) (Dipotong oleh Akta A1648)."],"p":"VII"},{"ref":"s.28A","sec":"28A","title":"Tiada tindakan terhadap orang yang menjalankan perkhidmatan kesihatan pekerjaan","gist":"[BAHARU 2024] Majikan tidak boleh mengambil tindakan terhadap pemberi perkhidmatan kesihatan pekerjaan kerana (a) mengadu tentang risiko kesihatan, atau (b) melaporkan kepada KP pesakit yang disyaki menghidap penyakit atau keracunan pekerjaan.","verbatim":["Tiada majikan boleh mengambil apa-apa tindakan terhadap mana-mana orang yang menjalankan perkhidmatan kesihatan pekerjaan kerana—","(a) membuat suatu aduan mengenai apa-apa perkara yang dianggap sebagai suatu risiko kepada kesihatan; atau","(b) membuat laporan kepada Ketua Pengarah mengenai mana-mana pesakit yang dipercayainya menghidapi apa-apa penyakit pekerjaan atau keracunan pekerjaan."],"p":"VII"},{"ref":"s.29(1)","sec":"29","title":"Pegawai keselamatan dan kesihatan","gist":"Seksyen ini terpakai kepada kelas tempat kerja yang dinyatakan Menteri melalui perintah dalam Warta.","verbatim":["(1) Seksyen ini hendaklah terpakai bagi apa-apa kelas atau jenis tempat kerja yang ditentukan oleh Menteri melalui perintah yang disiarkan dalam Warta."],"p":"VII"},{"ref":"s.29(2)","sec":"29","title":"Pegawai keselamatan dan kesihatan","gist":"Penghuni tempat kerja tersebut mesti melantik orang kompeten sebagai Pegawai Keselamatan dan Kesihatan (PKK).","verbatim":["(2) Seseorang penghuni suatu tempat kerja yang baginya seksyen ini terpakai hendaklah melantik seorang orang yang kompeten untuk bertindak sebagai pegawai keselamatan dan kesihatan di tempat kerja."],"p":"VII"},{"ref":"s.29(3)","sec":"29","title":"Pegawai keselamatan dan kesihatan","gist":"PKK dilantik khusus untuk memastikan pematuhan Akta dan peraturan, dan menggalakkan kerja selamat.","verbatim":["(3) Pegawai keselamatan dan kesihatan hendaklah dilantik semata-mata bagi maksud menjamin pematuhan wajar di tempat kerja akan peruntukan Akta ini dan mana-mana peraturan yang dibuat di bawahnya dan penggalakan penjalanan selamat kerja di tempat kerja itu."],"p":"VII"},{"ref":"s.29(4)","sec":"29","title":"Pegawai keselamatan dan kesihatan","gist":"Seorang PKK hanya untuk satu tempat kerja pada satu masa, kecuali dibenarkan KP.","verbatim":["(4) Seseorang hendaklah dilantik sebagai pegawai keselamatan dan kesihatan hanya untuk satu tempat kerja pada satu-satu masa, melainkan jika dibenarkan selainnya oleh Ketua Pengarah."],"p":"VII"},{"ref":"s.29(5)","sec":"29","title":"Pegawai keselamatan dan kesihatan","gist":"[DIPINDA 2024] Penalti: hingga RM50,000 atau 6 bulan atau kedua-duanya (dahulu RM5,000).","verbatim":["(5) Seseorang penghuni yang melanggar peruntukan seksyen ini adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi lima puluh ribu ringgit atau dipenjarakan selama tempoh tidak melebihi enam bulan atau kedua-duanya."],"p":"VII"},{"ref":"s.29A(1)","sec":"29A","title":"Penyelaras keselamatan dan kesihatan pekerjaan","gist":"[BAHARU 2024] Majikan yang tempat kerjanya tidak wajib ada PKK, tetapi ada 5 pekerja atau lebih, mesti melantik seorang pekerja sebagai Penyelaras KKP.","verbatim":["(1) Seseorang majikan yang tempat kerjanya tidak termasuk dalam mana-mana kelas atau jenis tempat kerja sebagaimana yang disiarkan dalam Warta di bawah subseksyen 29(1) hendaklah melantik salah seorang daripada pekerjanya untuk bertindak sebagai penyelaras keselamatan dan kesihatan pekerjaan jika dia mengambil kerja lima atau lebih pekerja di tempat kerjanya."],"p":"VII"},{"ref":"s.29A(2)","sec":"29A","title":"Penyelaras keselamatan dan kesihatan pekerjaan","gist":"Penyelaras KKP dilantik untuk menyelaras isu KKP di tempat kerja.","verbatim":["(2) Seseorang pekerja yang dilantik sebagai penyelaras keselamatan dan kesihatan pekerjaan di bawah subseksyen (1) hendaklah dilantik bagi maksud menyelaraskan isu keselamatan dan kesihatan pekerjaan di tempat kerja."],"p":"VII"},{"ref":"s.29A(3)","sec":"29A","title":"Penyelaras keselamatan dan kesihatan pekerjaan","gist":"Jika majikan sudah melantik PKK, dianggap telah mematuhi.","verbatim":["(3) Walau apa pun subseksyen (1), seseorang majikan yang disebut dalam subseksyen (1) yang telah melantik seorang pegawai keselamatan dan kesihatan di tempat kerja hendaklah disifatkan telah mematuhi subseksyen (1)."],"p":"VII"},{"ref":"s.29A(4)","sec":"29A","title":"Penyelaras keselamatan dan kesihatan pekerjaan","gist":"Penalti: hingga RM50,000 atau 6 bulan atau kedua-duanya.","verbatim":["(4) Seseorang majikan yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi lima puluh ribu ringgit atau dipenjarakan selama tempoh tidak melebihi enam bulan atau kedua-duanya."],"p":"VII"},{"ref":"s.30(1)","sec":"30","title":"Penubuhan jawatankuasa keselamatan dan kesihatan di tempat kerja","gist":"Majikan mesti menubuhkan JKK jika (a) 40 orang atau lebih bekerja di tempat kerja, atau (b) diarahkan oleh KP.","verbatim":["(1) Tiap-tiap majikan hendaklah menubuhkan jawatankuasa keselamatan dan kesihatan di tempat kerja mengikut seksyen ini jika—","(a) terdapat empat puluh orang atau lebih diambil kerja di tempat kerja; atau","(b) Ketua Pengarah mengarahkan penubuhan jawatankuasa sedemikian di tempat kerja."],"p":"VII"},{"ref":"s.30(2)","sec":"30","title":"Penubuhan jawatankuasa keselamatan dan kesihatan di tempat kerja","gist":"Komposisi, pemilihan ahli, kuasa dan prosedur JKK mengikut peraturan (Peraturan JKK 1996).","verbatim":["(2) Keanggotaan jawatankuasa keselamatan dan kesihatan yang ditubuhkan di bawah subseksyen (1), pemilihan atau pelantikan orang-orang ke jawatankuasa itu, kuasa anggota-anggota jawatankuasa itu dan apa-apa perkara lain yang berhubungan dengan penubuhan atau prosedur jawatankuasa itu hendaklah sebagaimana yang ditetapkan."],"p":"VII"},{"ref":"s.30(3)","sec":"30","title":"Penubuhan jawatankuasa keselamatan dan kesihatan di tempat kerja","gist":"Majikan mesti berunding dengan JKK supaya majikan dan pekerja dapat bekerjasama mempromosi dan menyemak keberkesanan langkah keselamatan.","verbatim":["(3) Tiap-tiap majikan hendaklah berunding dengan jawatankuasa keselamatan dan kesihatan itu dengan tujuan untuk membuat dan menyenggarakan perkiraan yang akan membolehkannya dan pekerja-pekerjanya bekerjasama dengan berkesan dalam menggalakkan dan membangunkan langkah-langkah untuk memastikan keselamatan dan kesihatan pekerja-pekerja di tempat kerja, dan dalam mengukur keberkesanan langkah-langkah itu."],"p":"VII"},{"ref":"s.30(4)","sec":"30","title":"Penubuhan jawatankuasa keselamatan dan kesihatan di tempat kerja","gist":"[DIPINDA 2024] Penalti: hingga RM100,000 atau 1 tahun atau kedua-duanya (dahulu RM5,000 / 6 bulan).","verbatim":["(4) Seseorang yang melanggar peruntukan seksyen ini adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"VII"},{"ref":"s.31(a)","sec":"31","title":"Fungsi jawatankuasa keselamatan dan kesihatan","gist":"JKK mengkaji semula langkah keselamatan dan kesihatan di tempat kerja.","verbatim":["Jawatankuasa keselamatan dan kesihatan yang ditubuhkan di tempat kerja menurut seksyen 30—","(a) hendaklah sentiasa mengkaji semula langkah-langkah yang diambil untuk memastikan keselamatan dan kesihatan orang-orang di tempat kerja;"],"p":"VII"},{"ref":"s.31(b)","sec":"31","title":"Fungsi jawatankuasa keselamatan dan kesihatan","gist":"JKK menyiasat perkara yang dianggap tidak selamat oleh ahli atau pekerja dan telah dimaklumkan kepada majikan.","verbatim":["Jawatankuasa keselamatan dan kesihatan yang ditubuhkan di tempat kerja menurut seksyen 30—","(b) hendaklah menyiasat apa-apa perkara di tempat kerja— (i) yang dianggap oleh anggota jawatankuasa itu atau orang yang diambil kerja di tempat kerja itu adalah tidak selamat atau merupakan risiko kepada kesihatan; dan (ii) yang telah dibawa kepada perhatian majikan;"],"p":"VII"},{"ref":"s.31(c)","sec":"31","title":"Fungsi jawatankuasa keselamatan dan kesihatan","gist":"JKK cuba menyelesaikannya; jika gagal, meminta KP memeriksa tempat kerja.","verbatim":["Jawatankuasa keselamatan dan kesihatan yang ditubuhkan di tempat kerja menurut seksyen 30—","(c) hendaklah cuba menyelesaikan apa-apa perkara yang disebut dalam perenggan (b) dan, jika ia tidak berupaya berbuat demikian, hendaklah meminta Ketua Pengarah supaya menjalankan suatu pemeriksaan tempat kerja itu bagi maksud itu; dan"],"p":"VII"},{"ref":"s.31(d)","sec":"31","title":"Fungsi jawatankuasa keselamatan dan kesihatan","gist":"Fungsi lain yang ditetapkan.","verbatim":["Jawatankuasa keselamatan dan kesihatan yang ditubuhkan di tempat kerja menurut seksyen 30—","(d) hendaklah mempunyai apa-apa fungsi lain yang boleh ditetapkan."],"p":"VII"},{"ref":"s.31A(1)","sec":"31A","title":"Kursus latihan keselamatan dan kesihatan pekerjaan","gist":"[BAHARU 2024] Menteri boleh, melalui perintah Warta, mewajibkan golongan tertentu menghadiri kursus latihan KKP oleh pemberi latihan berdaftar.","verbatim":["(1) Menteri boleh, melalui perintah yang disiarkan dalam Warta, menghendaki mana-mana kelas atau perihal orang untuk menghadiri kursus latihan keselamatan dan kesihatan pekerjaan sebagaimana yang dinyatakan dalam perintah itu yang dijalankan oleh seorang penyedia latihan berdaftar."],"p":"VII"},{"ref":"s.31A(2)","sec":"31A","title":"Kursus latihan keselamatan dan kesihatan pekerjaan","gist":"Majikan mesti memastikan orang itu tamat kursus sebelum membenarkannya melakukan kerja tersebut.","verbatim":["(2) Majikan mana-mana orang yang dikehendaki untuk menghadiri apa-apa kursus latihan di bawah subseksyen (1) hendaklah memastikan yang orang itu telah menyelesaikan kursus latihan tersebut sebelum membenarkan orang itu untuk melaksanakan apa-apa kerja yang baginya latihan itu diperlukan."],"p":"VII"},{"ref":"s.31A(3)","sec":"31A","title":"Kursus latihan keselamatan dan kesihatan pekerjaan","gist":"KP boleh mengarahkan secara bertulis kursus ulang kaji jika perlu.","verbatim":["(3) Walaupun seseorang telah menyelesaikan apa-apa kursus latihan keselamatan dan kesihatan pekerjaan sebagaimana yang dikehendaki di bawah seksyen ini, Ketua Pengarah boleh, jika difikirkannya kursus ulangkaji adalah perlu, mengeluarkan suatu arahan bertulis yang menghendaki orang itu untuk menghadiri kursus latihan itu yang lain."],"p":"VII"},{"ref":"s.31A(4)","sec":"31A","title":"Kursus latihan keselamatan dan kesihatan pekerjaan","gist":"Penalti (majikan langgar s.31A(2)): hingga RM50,000 atau 6 bulan atau kedua-duanya.","verbatim":["(4) Seseorang majikan yang melanggar subseksyen (2) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi lima puluh ribu ringgit atau dipenjarakan selama tempoh tidak melebihi enam bulan atau kedua-duanya."],"p":"VII"},{"ref":"s.31B(1)","sec":"31B","title":"Aktiviti yang hendaklah dijalankan oleh orang kompeten dan penyedia latihan berdaftar","gist":"Tiada sesiapa boleh (a) menjalankan aktiviti Jadual Kelima kecuali berdaftar sebagai orang kompeten, atau (b) mengendalikan kursus latihan KKP kecuali berdaftar sebagai pemberi latihan.","verbatim":["(1) Bagi maksud Akta ini, tiada seorang pun boleh—","(a) menjalankan apa-apa aktiviti yang dinyatakan dalam Jadual Kelima melainkan jika dia telah berdaftar sebagai orang kompeten di bawah Akta ini; atau","(b) menjalankan apa-apa kursus latihan keselamatan dan kesihatan pekerjaan melainkan jika dia telah berdaftar sebagai penyedia latihan berdaftar di bawah Akta ini."],"p":"VIIA"},{"ref":"s.31B(2)","sec":"31B","title":"Aktiviti yang hendaklah dijalankan oleh orang kompeten dan penyedia latihan berdaftar","gist":"Penalti: denda hingga RM100,000.","verbatim":["(2) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit."],"p":"VIIA"},{"ref":"s.31C(1)","sec":"31C","title":"Permohonan bagi pendaftaran","gist":"Permohonan pendaftaran dikemukakan kepada KP.","verbatim":["(1) Seseorang yang berniat untuk berdaftar sebagai orang kompeten atau penyedia latihan berdaftar hendaklah mengemukakan suatu permohonan bagi pendaftaran kepada Ketua Pengarah mengikut apa-apa cara sebagaimana yang ditentukan oleh Ketua Pengarah."],"p":"VIIA"},{"ref":"s.31C(2)","sec":"31C","title":"Permohonan bagi pendaftaran","gist":"Tertakluk kepada fi dan dokumen yang diperlukan.","verbatim":["(2) Permohonan di bawah subseksyen (1) hendaklah tertakluk kepada pembayaran apa-apa fi sebagaimana yang ditetapkan oleh Menteri dan hendaklah disertakan dengan apa-apa dokumen dan maklumat sebagaimana yang dikehendaki oleh Ketua Pengarah."],"p":"VIIA"},{"ref":"s.31C(3)","sec":"31C","title":"Permohonan bagi pendaftaran","gist":"KP boleh meluluskan dengan syarat atau menolak.","verbatim":["(3) Ketua Pengarah boleh, selepas mempertimbangkan permohonan itu, meluluskan permohonan itu tertakluk kepada apa-apa syarat yang difikirkannya patut, atau menolak permohonan itu."],"p":"VIIA"},{"ref":"s.31C(4)","sec":"31C","title":"Permohonan bagi pendaftaran","gist":"Permohonan boleh ditarik balik sebelum keputusan; fi tidak dikembalikan.","verbatim":["(4) Permohonan di bawah subseksyen (1) boleh ditarik balik pada bila-bila masa sebelum permohonan itu diluluskan atau ditolak, dalam keadaan sedemikian fi yang telah dibayar tidak boleh dibayar balik."],"p":"VIIA"},{"ref":"s.31D","sec":"31D","title":"Kesahan pendaftaran","gist":"Pendaftaran sah selama 3 tahun dari tarikh yang dinyatakan.","verbatim":["Tiap-tiap pendaftaran yang diluluskan di bawah seksyen 31 C hendaklah sah bagi tempoh tiga tahun dari tarikh yang dinyatakan dalam kelulusan."],"p":"VIIA"},{"ref":"s.31E(1)","sec":"31E","title":"Pembaharuan pendaftaran","gist":"Pembaharuan dipohon sebelum tarikh tamat.","verbatim":["(1) Seseorang orang kompeten atau penyedia latihan berdaftar boleh membuat permohonan untuk membaharui pendaftaran sebelum tarikh habis tempoh pendaftaran pada bila-bila masa dan mengikut apa-apa cara sebagaimana yang ditentukan oleh Ketua Pengarah."],"p":"VIIA"},{"ref":"s.31E(2)","sec":"31E","title":"Pembaharuan pendaftaran","gist":"Tertakluk kepada fi dan dokumen.","verbatim":["(2) Permohonan di bawah subseksyen (1) hendaklah tertakluk kepada pembayaran apa-apa fi sebagaimana yang ditetapkan oleh Menteri dan hendaklah disertakan dengan apa-apa dokumen sebagaimana yang dikehendaki oleh Ketua Pengarah."],"p":"VIIA"},{"ref":"s.31E(3)","sec":"31E","title":"Pembaharuan pendaftaran","gist":"KP boleh (a) membaharui (dengan/tanpa syarat) atau (b) menolak.","verbatim":["(3) Ketua Pengarah boleh, selepas permohonan di bawah subseksyen (1)— mempertimbangkan","(a) membaharui pendaftaran itu, dengan atau tanpa syarat; atau","(b) menolak untuk membaharui pendaftaran itu."],"p":"VIIA"},{"ref":"s.31E(4)","sec":"31E","title":"Pembaharuan pendaftaran","gist":"KP boleh menolak jika pemohon (a) melanggar Akta atau perundangan subsidiari; (b) melanggar syarat pendaftaran; atau (c) memberi maklumat palsu.","verbatim":["(4) Ketua Pengarah boleh menolak permohonan untuk membaharui pendaftaran jika Ketua Pengarah berpuas hati bahawa—","(a) pemohon telah gagal untuk mematuhi mana-mana peruntukan Akta ini atau mana-mana perundangan subsidiari yang dibuat di bawah Akta ini;","(b) pemohon telah gagal untuk mematuhi mana-mana syarat pendaftaran; atau","(c) pemohon telah mengemukakan apa-apa pernyataan, maklumat atau dokumen yang didapati palsu, tidak kira sama ada pemohon mengetahui atau mempercayai pernyataan, maklumat atau dokumen itu palsu atau selainnya."],"p":"VIIA"},{"ref":"s.31E(5)","sec":"31E","title":"Pembaharuan pendaftaran","gist":"Permohonan boleh ditarik balik; fi tidak dikembalikan.","verbatim":["(5) Permohonan di bawah subseksyen (1) boleh ditarik balik pada bila-bila masa sebelum permohonan itu diluluskan atau ditolak, dalam keadaan sedemikian fi yang telah dibayar tidak boleh dibayar balik."],"p":"VIIA"},{"ref":"s.31F(1)","sec":"31F","title":"Pembatalan pendaftaran","gist":"KP boleh membatalkan pendaftaran jika (a) melanggar Akta; (b) melanggar syarat; (c) didaftarkan melalui penipuan; atau (d) tidak lagi layak.","verbatim":["(1) Ketua Pengarah boleh membatalkan pendaftaran orang kompeten atau penyedia latihan berdaftar jika Ketua Pengarah berpuas hati bahawa dia—","(a) telah gagal untuk mematuhi mana-mana peruntukan Akta ini atau mana-mana perundangan subsidiari yang dibuat di bawah Akta ini;","(b) telah gagal untuk mematuhi mana-mana syarat yang dikenakan ke atas pendaftaran;","(c) telah mendapatkan atau memperoleh pendaftarannya dengan fraud atau salah nyataan; atau","(d) tidak lagi sesuai untuk bertindak sebagai orang kompeten atau penyedia latihan berdaftar."],"p":"VIIA"},{"ref":"s.31F(2)","sec":"31F","title":"Pembatalan pendaftaran","gist":"Sebelum membatalkan, KP mesti memberi peluang representasi bertulis.","verbatim":["(2) Walau apa pun subseksyen (1), Ketua Pengarah tidak boleh membatalkan pendaftaran orang kompeten atau penyedia latihan berdaftar melainkan jika Ketua Pengarah berpuas hati bahawa, setelah memberi orang kompeten atau penyedia latihan berdaftar itu suatu peluang untuk membuat apa-apa representasi secara bertulis yang dihasratkannya untuk dibuat, pendaftaran itu patut dibatalkan."],"p":"VIIA"},{"ref":"s.31F(3)","sec":"31F","title":"Pembatalan pendaftaran","gist":"Notis pembatalan dikeluarkan dan berkuat kuasa pada tarikh yang dinyatakan.","verbatim":["(3) Jika pendaftaran orang kompeten atau penyedia latihan berdaftar dibatalkan, Ketua Pengarah hendaklah mengeluarkan suatu notis pembatalan pendaftaran kepada orang kompeten atau penyedia latihan berdaftar itu, dan pembatalan itu berkuat kuasa pada tarikh yang dinyatakan dalam notis itu."],"p":"VIIA"},{"ref":"s.32(1)","sec":"32","title":"Pemberitahuan mengenai kemalangan, kejadian berbahaya, keracunan pekerjaan dan penyakit pekerjaan, dan siasatan","gist":"[DIPINDA 2024] Majikan mesti memberitahu pejabat JKKP terdekat tentang kemalangan, kejadian berbahaya, keracunan atau penyakit pekerjaan yang telah atau mungkin berlaku. (Butiran dalam Peraturan NADOPOD 2004.)","verbatim":["(1) Seseorang majikan hendaklah memberitahu pejabat keselamatan dan kesihatan pekerjaan yang terdekat mengenai apa-apa kemalangan, kejadian berbahaya, keracunan pekerjaan atau penyakit pekerjaan yang telah terjadi atau mungkin akan terjadi di tempat kerja."],"p":"VIII"},{"ref":"s.32(2)","sec":"32","title":"Pemberitahuan mengenai kemalangan, kejadian berbahaya, keracunan pekerjaan dan penyakit pekerjaan, dan siasatan","gist":"Pengamal perubatan atau pegawai perubatan yang merawat pesakit yang disyaki menghidap penyakit atau keracunan pekerjaan mesti melaporkan kepada KP.","verbatim":["(2) Tiap-tiap pengamal perubatan berdaftar atau pegawai perubatan yang merawat, atau dipanggil untuk melawat, seseorang pesakit yang dia percaya menghidap penyakit pekerjaan atau keracunan pekerjaan yang dinyatakan dalam mana-mana peraturan atau perintah yang dibuat oleh Menteri di bawah Akta ini hendaklah melaporkan perkara itu kepada Ketua Pengarah."],"p":"VIII"},{"ref":"s.33(1)","sec":"33","title":"Ketua Pengarah boleh mengarahkan supaya siasatan diadakan","gist":"KP boleh mengarahkan pegawai KKP menjalankan siasatan tentang sifat dan punca kejadian.","verbatim":["(1) Jika pada pendapat Ketua Pengarah, suatu siasatan patut diadakan mengenai sifat dan punca kemalangan, kejadian berbahaya, keracunan pekerjaan atau penyakit pekerjaan, dia boleh menyebabkan siasatan sedemikian diadakan oleh seorang pegawai keselamatan dan kesihatan pekerjaan."],"p":"VIII"},{"ref":"s.33(2)","sec":"33","title":"Ketua Pengarah boleh mengarahkan supaya siasatan diadakan","gist":"KP boleh melantik penilai yang mahir (kejuruteraan, perubatan dll.).","verbatim":["(2) Ketua Pengarah boleh melantik seorang atau lebih daripada seorang yang mempunyai kemahiran atau kepakaran kejuruteraan, perubatan atau kemahiran atau kepakaran lain yang sesuai untuk berkhidmat sebagai pengapit dalam mana-mana siasatan sedemikian."],"p":"VIII"},{"ref":"s.33(2A)","sec":"33","title":"Ketua Pengarah boleh mengarahkan supaya siasatan diadakan","gist":"Penilai berkuasa memasuki dan memeriksa premis bagi tujuan siasatan.","verbatim":["(2A) Pengapit yang dilantik di bawah subseksyen (2) hendaklah mempunyai, bagi maksud siasatan, kuasa untuk memasuki dan memeriksa mana-mana premis, yang kemasukan atau pemeriksaan itu adalah perlu bagi maksud siasatan itu."],"p":"VIII"},{"ref":"s.33(3)","sec":"33","title":"Ketua Pengarah boleh mengarahkan supaya siasatan diadakan","gist":"Penilai bukan pegawai awam boleh dibayar elaun.","verbatim":["(3) Tiap-tiap orang yang bukan pegawai awam yang berkhidmat sebagai pengapit dalam siasatan itu boleh dibayar elaun pada kadar atau kadar-kadar yang ditentukan oleh Menteri."],"p":"VIII"},{"ref":"s.34","sec":"34","title":"Kuasa pegawai keselamatan dan kesihatan pekerjaan dalam siasatan","gist":"Pegawai yang menjalankan siasatan boleh mengangkat sumpah dan mempunyai kuasa Majistret Kelas Pertama untuk memanggil saksi dan dokumen. Orang yang dipanggil wajib hadir.","verbatim":["Bagi maksud mengadakan suatu siasatan di bawah Akta ini, seseorang pegawai keselamatan dan kesihatan pekerjaan hendaklah mempunyai kuasa untuk mengendalikan sumpah dan ikrar dan hendaklah terletakhak dengan kuasa Majistret Kelas Pertama untuk memaksa kehadiran saksi-saksi dan memaksa pengemukaan dokumen-dokumen, memelihara keteraturan dan selainnya menjalankan siasatan dengan sewajarnya, dan semua orang yang dipanggil untuk menghadiri siasatan itu adalah terikat di sisi undang-undang untuk hadir."],"p":"VIII"},{"ref":"s.34A","sec":"34A","title":"Kewajipan pemunya, penghuni, dsb., dalam siasatan","gist":"[BAHARU 2024] Pemilik, penghuni, majikan dan pekerja mesti memberi bantuan yang diperlukan untuk siasatan.","verbatim":["Pemunya atau penghuni, atau mana-mana majikan di dalam, mana-mana tempat kerja dan mana-mana pekerja bagi pemunya, penghuni atau majikan itu, hendaklah memberikan apa-apa bantuan yang diperlukan bagi maksud apa-apa siasatan di bawah Akta ini."],"p":"VIII"},{"ref":"s.35(1)","sec":"35","title":"Kuasa untuk melarang penggunaan loji atau bahan","gist":"KP boleh, melalui perintah Warta, melarang penggunaan loji atau bahan yang mungkin menjejaskan keselamatan dan kesihatan pekerja.","verbatim":["(1) Walau apa pun mana-mana undang-undang bertulis yang berlawanan, Ketua Pengarah boleh, melalui perintah yang disiarkan dalam Warta, melarang penggunaan apa-apa loji atau bahan yang pada pendapatnya mungkin akan menjejaskan keselamatan dan kesihatan orang-orang semasa bekerja."],"p":"IX"},{"ref":"s.35(2)","sec":"35","title":"Kuasa untuk melarang penggunaan loji atau bahan","gist":"Sebelum membuat perintah, KP mesti berunding dengan jabatan atau badan yang berkaitan.","verbatim":["(2) Jika Ketua Pengarah bercadang untuk menjalankan kuasanya di bawah subseksyen (1) dia hendaklah, sebelum membuat perintah itu, meminta pendapat mana-mana jabatan Kerajaan atau badan lain yang pada hematnya sesuai."],"p":"IX"},{"ref":"s.35(3)","sec":"35","title":"Kuasa untuk melarang penggunaan loji atau bahan","gist":"[DIPINDA 2024] Ingkar perintah: hingga RM500,000 atau 2 tahun atau kedua-duanya.","verbatim":["(3) Seseorang yang tidak mematuhi perintah di bawah subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi lima ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"IX"},{"ref":"s.36","sec":"36","title":"(Dipotong)","gist":"Dipotong oleh Akta A1648.","verbatim":["(Dipotong oleh Akta A1648)."],"p":"IX"},{"ref":"s.37(1)","sec":"37","title":"Kelulusan tataamalan industri","gist":"Menteri, atas syor Majlis atau KP, boleh meluluskan tataamalan industri (ICOP) sebagai panduan mematuhi Akta.","verbatim":["(1) Menteri boleh, atas syor Majlis atau Ketua Pengarah meluluskan tataamalan industri yang terdiri daripada arahan-arahan yang pada hematnya perlu atau patut untuk panduan orang-orang dalam mematuhi kehendak-kehendak peruntukan Akta ini."],"p":"X"},{"ref":"s.37(2)","sec":"37","title":"Kelulusan tataamalan industri","gist":"Menteri boleh menyemak semula ICOP (pinda, potong, ubah, tambah).","verbatim":["(2) Menteri boleh, atas syor Majlis atau Ketua Pengarah, dari semasa ke semasa mengkaji semula tataamalan industri itu dengan meminda, memotong, mengubah atau menambah peruntukan tataamalan industri itu."],"p":"X"},{"ref":"s.37(3)","sec":"37","title":"Kelulusan tataamalan industri","gist":"ICOP boleh (a) mengandungi kod, standard, peraturan atau spesifikasi KKP; atau (b) merujuk dokumen yang diterbitkan badan lain (cth. MS, ISO).","verbatim":["(3) Suatu tataamalan industri boleh—","(a) terdiri daripada apa-apa tata, standard, kaedah, spesifikasi atau peruntukan berhubungan dengan keselamatan atau kesihatan pekerjaan yang diluluskan oleh Menteri; atau","(b) memakai, mengandungi atau merujuk kepada mana-mana dokumen yang dirumus atau disiarkan oleh mana-mana badan atau pihak berkuasa yang berkuat kuasa pada masa tataamalan industri itu diluluskan atau sebagaimana yang dipinda, dirumus atau disiarkan dari semasa ke semasa."],"p":"X"},{"ref":"s.37(4)","sec":"37","title":"Kelulusan tataamalan industri","gist":"Kelulusan, pindaan dan pembatalan ICOP mesti diwartakan.","verbatim":["(4) Menteri hendaklah menyebabkan disiarkan dalam Warta kelulusan sesuatu tataamalan industri dan pemindaan atau pembatalannya."],"p":"X"},{"ref":"s.38(a)","sec":"38","title":"Penggunaan tataamalan industri dalam prosiding","gist":"ICOP yang diluluskan boleh diterima sebagai keterangan di mahkamah.","verbatim":["Dalam mana-mana prosiding di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya yang dalamnya dikatakan bahawa seseorang telah melanggar atau tidak mematuhi peruntukan Akta atau mana-mana peraturan yang dibuat di bawahnya yang berhubungan dengannya suatu tataamalan industri yang diluluskan berkuat kuasa pada masa pelanggaran atau ketakpatuhan yang dikatakan itu—","(a) tataamalan industri yang diluluskan itu hendaklah boleh diterima sebagai keterangan dalam prosiding itu; dan"],"p":"X"},{"ref":"s.38(b)","sec":"38","title":"Penggunaan tataamalan industri dalam prosiding","gist":"Jika peruntukan ICOP berkaitan dan tertuduh tidak mematuhinya, kesalahan dianggap terbukti, kecuali tertuduh membuktikan dia mematuhi Akta dengan cara lain.","verbatim":["Dalam mana-mana prosiding di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya yang dalamnya dikatakan bahawa seseorang telah melanggar atau tidak mematuhi peruntukan Akta atau mana-mana peraturan yang dibuat di bawahnya yang berhubungan dengannya suatu tataamalan industri yang diluluskan berkuat kuasa pada masa pelanggaran atau ketakpatuhan yang dikatakan itu—","(b) jika mahkamah berpuas hati berhubungan dengan apa-apa perkara yang perlu dibuktikan oleh pihak pendakwa bagi membuktikan pelanggaran atau kegagalan yang dikatakan itu bahawa— (i) peruntukan tataamalan industri yang diluluskan itu adalah relevan kepada perkara itu; dan (ii) orang itu pada bila-bila masa tidak mematuhi peruntukan tataamalan industri yang diluluskan itu, perkara itu hendaklah dikira sebagai terbukti melainkan jika mahkamah berpuas hati bahawa berkenaan dengan perkara itu orang itu telah mematuhi peruntukan Akta ini selain daripada dengan cara mematuhi peruntukan tataamalan industri yang diluluskan itu."],"p":"X"},{"ref":"s.39(1)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"Pegawai boleh memasuki, memeriksa dan meneliti mana-mana tempat kerja pada masa munasabah dengan menunjukkan kad kuasa. Rumah kediaman hanya dengan izin pemilik atau jika ada sebab munasabah mempercayai berlaku kesalahan.","verbatim":["(1) Seseorang pegawai keselamatan dan kesihatan pekerjaan, dalam Bahagian ini disebut “Pegawai”, boleh, bagi maksud melaksanakan tujuan Akta ini atau mana-mana peraturan yang dibuat di bawahnya, pada bila-bila masa yang munasabah dan apabila dikemukakan perakuan pemberikuasaannya memasuki, memeriksa dan meneliti mana-mana tempat kerja selain daripada tempat yang digunakan semata-mata bagi maksud kediaman: Dengan syarat bahawa dia boleh memasuki tempat kediaman itu dengan kebenaran pemunyanya atau jika dia mempunyai sebab munasabah untuk mempercayai bahawa pelanggaran Akta ini atau mana-mana peraturan yang dibuat di bawahnya telah atau mungkin akan dilakukan."],"p":"XI"},{"ref":"s.39(2)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"[DIPINDA 2024] Pegawai boleh: (a) memeriksa loji, bahan atau barang; (b) mengarahkan kawasan dibiarkan tidak diusik; (c) mengambil ukuran, gambar dan rakaman; (d) mengambil sampel bahan dan udara; (e) mengarahkan pekerja menjalani pemeriksaan perubatan jika ada penyakit/keracunan pekerjaan; (f) meminta buku, rekod, perakuan, data komputer atau dokumen dan membuat salinan; (g) menilai tahap bising, pencahayaan, haba atau bahan berbahaya; (h) meminta hospital, klinik atau rumah mayat memberi maklumat (termasuk laporan perubatan) pekerja yang cedera atau disyaki sakit akibat kerja.","verbatim":["(2) Dalam menjalankan kuasanya di bawah subseksyen (1), seseorang pegawai boleh—","(a) membuat pemeriksaan, penelitian dan penyiasatan mengenai apa-apa loji, bahan, artikel atau benda lain jua pun sebagaimana yang perlu untuk menentukan sama ada atau tidak Akta ini atau mana-mana peraturan yang dibuat di bawahnya telah dipatuhi;","(b) mengarahkan supaya tempat kerja itu atau mana-mana bahagiannya, atau apa-apa jua di dalamnya, hendaklah tidak diganggu, sama ada pada amnya atau dalam hal-hal tertentu, selama yang semunasabahnya perlu bagi maksud apa-apa pemeriksaan, penelitian atau penyiasatan di bawah perenggan (a);","(c) mengambil apa-apa ukuran atau gambar dan membuat apa-apa rekod yang dianggapnya perlu bagi maksud apa-apa pemeriksaan, penelitian atau penyiasatan di bawah perenggan (a);","(d) mengambil sampel apa-apa artikel atau bahan yang dijumpai dalam tempat kerja yang dia mempunyai kuasa untuk memasukinya, dan udara dalam atau di sekitar mana-mana tempat kerja itu;","(e) menghendaki mana-mana orang yang diambil khidmat di sesuatu tempat kerja di mana-mana penyakit pekerjaan atau keracunan pekerjaan yang dinyatakan dalam mana-mana peraturan atau perintah yang dibuat oleh Menteri di bawah Akta ini telah terjadi atau mungkin akan terjadi, diperiksa secara perubatan oleh seorang pegawai perubatan atau pengamal perubatan berdaftar;","(f) menghendaki pengemukaan apa-apa buku, rekod, perakuan, notis, data berkomputer atau dokumen, atau apa-apa salinannya yang diperakui, dan membuat salinannya yang difikirkannya perlu bagi maksud apa-apa pemeriksaan, penelitian atau penyiasatan;","(g) menilai tahap bising, pencahayaan, panas atau bahan yang merosakkan atau berbahaya di mana-mana tempat kerja dan tahap pendedahan orang yang sedang bekerja di dalamnya;","(h) menghendaki mana-mana hospital, klinik perubatan atau bilik mayat untuk memberikan apa-apa maklumat (termasuk laporan perubatan) tentang mana-mana orang yang atau telah bekerja di tempat kerja yang cedera dalam kemalangan di tempat kerja atau yang disyaki menghidapi penyakit pekerjaan yang didapati dari tempat kerja dan sedang menerima rawatan di hospital atau klinik perubatan itu."],"p":"XI"},{"ref":"s.39(3)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"Jika loji atau bahan berbahaya, pegawai boleh (a) menyuruhnya dibuka atau diuji (tanpa merosakkannya); (b) mengambil milik dan menahannya untuk pemeriksaan, elak diusik, atau dijadikan keterangan.","verbatim":["(3) Jika seseorang pegawai berpendapat bahawa loji atau bahan telah menyebabkan atau mungkin akan menyebabkan bahaya kepada keselamatan dan kesihatan, dia boleh—","(a) menyebabkannya dirombak atau dikenakan apa-apa proses atau ujian di mana-mana tempat yang sesuai dan pada bila-bila masa yang munasabah yang ditetapkannya, tetapi tidak sehingga merosakkan atau memusnahkannya;","(b) mengambil milik dan menahannya selama yang perlu bagi semua atau mana-mana maksud yang berikut: (i) memeriksanya dan melakukan apa-apa jua padanya yang dia mempunyai kuasa untuk melakukannya; (ii) memastikan bahawa ia tidak diganggu sebelum dia selesai memeriksanya; (iii) memastikan bahawa ia tersedia untuk digunakan sebagai bukti dalam apa-apa prosiding bagi sesuatu kesalahan di bawah mana-mana peruntukan Akta ini atau peraturan yang dibuat di bawahnya."],"p":"XI"},{"ref":"s.39(4)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"Pegawai yang juga pegawai perubatan boleh (a) menjalankan pemeriksaan perubatan dan (b) menggunakan kuasa di s.39(2) dan (3).","verbatim":["(4) Jika seseorang pegawai ialah seorang pegawai perubatan, dia boleh—","(a) menjalankan apa-apa pemeriksaan perubatan yang perlu bagi maksud kewajipannya di bawah Akta ini atau peraturan yang dibuat di bawahnya; dan","(b) menjalankan apa-apa kuasa lain yang perlu atau yang diberikan di bawah subseksyen (2) dan (3)."],"p":"XI"},{"ref":"s.39(5)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"Pegawai boleh meminta bantuan polis jika menjangka halangan serius.","verbatim":["(5) Seseorang pegawai boleh bagi maksud seksyen ini meminta bilamasa perlu bantuan polis jika dia mempunyai sebab munasabah untuk mengkhuatiri apa-apa halangan serius dalam pelaksanaan tugasnya."],"p":"XI"},{"ref":"s.39(6)","sec":"39","title":"Kuasa untuk masuk, memeriksa, meneliti, menyita, dsb.","gist":"Pegawai boleh membawa (a) orang lain yang diberi kuasa KP dan (b) peralatan yang diperlukan.","verbatim":["(6) Tanpa menjejaskan subseksyen (5), dalam memasuki mana-mana tempat kerja atau tempat kediaman alasan yang oleh sebab subseksyen (1), seseorang pegawai boleh membawa bersamanya—","(a) mana-mana orang lain yang diberi kuasa dengan sewajarnya oleh Ketua Pengarah; atau","(b) apa-apa kelengkapan atau benda yang dikehendaki bagi apa-apa maksud yang baginya kuasa untuk masuk dijalankan."],"p":"XI"},{"ref":"s.40","sec":"40","title":"Kemasukan ke dalam premis dengan waran geledah dan kuasa untuk menyita","gist":"Dengan waran geledah daripada Majistret, pegawai boleh memasuki tempat kerja atau kediaman pada bila-bila masa munasabah (siang atau malam), menggeledah, dan menyita atau memeterai barang keterangan.","verbatim":["Dalam tiap-tiap hal jika maklumat diberikan dengan bersumpah kepada seseorang Majistret bahawa ada sebab yang munasabah untuk mengesyaki bahawa di dalam tempat kerja atau tempat kediaman terdapat apa-apa artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagiannya yang telah digunakan untuk melakukan atau dicadangkan hendak digunakan untuk melakukan sesuatu kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya, dia hendaklah mengeluarkan suatu waran di bawah tandatangannya yang menurut kuasanya seseorang pegawai yang dinamakan atau disebut dalam waran itu boleh memasuki tempat kerja atau tempat kediaman itu pada bila-bila masa yang munasabah pada waktu siang atau malam, dan mencari dan menyita atau mengelak artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagiannya itu."],"p":"XI"},{"ref":"s.41","sec":"41","title":"Kemasukan ke dalam premis tanpa waran geledah dan kuasa untuk menyita","gist":"Tanpa waran: jika kelewatan mendapatkan waran mungkin menyebabkan barang keterangan dialihkan atau dimusnahkan, pegawai boleh masuk dan menyita atau memeterainya. Memecahkan meterai atau mengalihkan barang tanpa kuasa adalah kesalahan.","verbatim":["Jika seseorang pegawai berpuas hati berdasarkan maklumat yang diterima bahawa dia mempunyai alasan yang munasabah bagi mempercayai bahawa, oleh sebab kelengahan dalam mendapatkan waran geledah, apa-apa artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagiannya dalam tempat kerja atau tempat kediaman yang digunakan untuk melakukan atau dicadangkan hendak digunakan untuk melakukan sesuatu kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya mungkin akan dialihkan atau dimusnahkan, dia boleh memasuki tempat kerja atau tempat kediaman itu tanpa waran dan menyita atau mengelak artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagiannya itu yang dijumpai dalamnya: Dengan syarat bahawa adalah menjadi suatu kesalahan jika seseorang tanpa kuasa yang sah memecahkan, mengganggu atau merosakkan lak sedemikian atau mengalihkan mana-mana artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagian itu atau cuba berbuat demikian."],"p":"XI"},{"ref":"s.42(1)","sec":"42","title":"Kuasa untuk masuk secara paksa dan penyampaian kepada penghuni salinan bertandatangan senarai benda yang disita dari premis","gist":"Semasa menjalankan s.40 atau 41, pegawai boleh (a) memecah pintu; (b) masuk secara paksa; (c) mengalihkan halangan secara paksa; (d) menahan orang di situ sehingga geledahan selesai.","verbatim":["(1) Seseorang pegawai boleh, dalam menjalankan kuasanya di bawah seksyen 40 atau 41, jika perlu untuk berbuat demikian—","(a) memecah buka mana-mana pintu luar atau dalam sesuatu tempat kerja atau tempat kediaman dan memasukinya;","(b) dengan menggunakan kekerasan memasuki tempat itu dan tiap-tiap bahagiannya;","(c) dengan menggunakan kekerasan mengalihkan apa-apa halangan kepada kemasukan, penggeledahan, penyitaan dan pengalihan yang dia diberi kuasa untuk melaksanakannya; dan","(d) menahan tiap-tiap orang yang dijumpai di tempat itu sehingga tempat itu digeledah."],"p":"XI"},{"ref":"s.42(2)","sec":"42","title":"Kuasa untuk masuk secara paksa dan penyampaian kepada penghuni salinan bertandatangan senarai benda yang disita dari premis","gist":"Pegawai mesti menyediakan senarai barang yang disita dan menyerahkan salinan bertandatangan kepada penghuni (atau menampalnya jika premis kosong).","verbatim":["(2) Pegawai yang menyita apa-apa artikel, benda, buku, dokumen, loji, bahan, pepasangan atau bahagiannya di bawah seksyen 40 atau 41 hendaklah menyediakan suatu senarai benda yang disita dan dengan serta-merta, atau dengan seberapa segera yang praktik, menyerahkan suatu salinan senarai itu yang ditandatangani olehnya kepada penghuni, atau ejen atau pengkhidmatnya yang berada di premis itu, dan jika premis itu tidak dihuni, pegawai itu hendaklah, di mana-mana mungkin, menampalkan suatu senarai benda yang disita di premis itu."],"p":"XI"},{"ref":"s.43(1)","sec":"43","title":"Peruntukan lanjut berhubungan dengan pemeriksaan","gist":"Apabila masuk, pegawai mesti memaklumkan majikan dan JKK.","verbatim":["(1) Apabila memasuki mana-mana tempat kerja seseorang pegawai hendaklah mengambil segala langkah yang munasabah untuk memberitahu majikan dan jawatankuasa keselamatan dan kesihatan mengenai kemasukan itu."],"p":"XI"},{"ref":"s.43(2)","sec":"43","title":"Peruntukan lanjut berhubungan dengan pemeriksaan","gist":"Selepas pemeriksaan, pegawai memberitahu majikan dan JKK pemerhatian dan tindakan yang dicadangkan.","verbatim":["(2) Apabila selesai sesuatu siasatan seseorang pegawai hendaklah memberi majikan dan jawatankuasa keselamatan dan kesihatan maklumat berkenaan dengan pemerhatiannya dan apa-apa tindakan yang dia bercadang untuk mengambilnya berhubungan dengan tempat kerja."],"p":"XI"},{"ref":"s.43(3)","sec":"43","title":"Peruntukan lanjut berhubungan dengan pemeriksaan","gist":"Jika mengambil sampel, pegawai memaklumkan majikan dan JKK, dan (a) membahagi serta memeterai sampel; (b) memberi satu bahagian kepada majikan/JKK jika diminta; (c) menyimpan satu bahagian; (d) menghantar satu bahagian untuk analisis.","verbatim":["(3) Jika seseorang pegawai bercadang untuk mengambil dan mengalihkan suatu sampel dari tempat kerja bagi maksud penganalisisan, dia hendaklah memberitahu majikan dan jawatankuasa keselamatan dan kesihatan dan selepas mengambil sampel itu dia hendaklah jika mungkin—","(a) membahagi sampel yang diambil kepada seberapa banyak bahagian yang perlu dan menandakan dan mengelak atau menandakan dan menutup setiap bahagian mengikut cara yang dibenarkan oleh sifatnya;","(b) jika dikehendaki oleh majikan atau jawatankuasa keselamatan dan kesihatan, menyerahkan satu bahagian setiap satunya kepada majikan atau jawatankuasa keselamatan dan kesihatan;","(c) menyimpan satu bahagian bagi perbandingan masa hadapan; dan","(d) jika penganalisisan sampel hendak dibuat, mengemukakan satu bahagian lain kepada seseorang penganalisis bagi penganalisisan."],"p":"XI"},{"ref":"s.44(1)","sec":"44","title":"Kuasa untuk menyiasat","gist":"Pegawai berkuasa menyiasat kesalahan di bawah Akta dan peraturan.","verbatim":["(1) Seseorang pegawai hendaklah mempunyai kuasa untuk menyiasat pelakuan apa-apa kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya."],"p":"XI"},{"ref":"s.44(2)","sec":"44","title":"Kuasa untuk menyiasat","gist":"Pegawai boleh menggunakan kuasa khas penyiasatan polis, kecuali menangkap tanpa waran.","verbatim":["(2) Seseorang pegawai boleh, berhubungan dengan suatu kesalahan yang dilakukan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya, menjalankan kuasa-kuasa khas berhubungan dengan penyiasatan polis kecuali bahawa kuasa untuk menangkap tanpa waran yang diberikan oleh Kanun Prosedur Jenayah [Akta 593] bagi mana-mana kesalahan boleh tangkap tidak boleh dijalankan olehnya."],"p":"XI"},{"ref":"s.44(3)","sec":"44","title":"Kuasa untuk menyiasat","gist":"Selepas siasatan, maklumat diserahkan kepada pegawai balai polis; polis boleh menangkap dengan waran.","verbatim":["(3) Apabila penyiasatannya selesai, pegawai itu hendaklah dengan segera memberikan segala maklumat yang berhubungan dengan pelakuan kesalahan itu kepada pegawai penjaga suatu balai polis dan seseorang pegawai polis boleh, dengan waran, menangkap mana-mana orang yang mungkin telah melakukan kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya."],"p":"XI"},{"ref":"s.45(1)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Pegawai boleh memeriksa secara lisan sesiapa yang mengetahui fakta kes.","verbatim":["(1) Seseorang pegawai yang membuat suatu siasatan di bawah seksyen 39 atau 44 boleh memeriksa secara lisan mana-mana orang yang pada hematnya mengetahui fakta-fakta dan hal keadaan kes itu."],"p":"XI"},{"ref":"s.45(2)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Orang itu wajib menjawab, tetapi boleh enggan jika pegawai tidak menunjukkan kad kuasa, atau jika jawapan boleh mendedahkannya kepada pertuduhan jenayah.","verbatim":["(2) Orang yang disebut dalam subseksyen (1) adalah terikat di sisi undang-undang untuk menjawab segala soalan yang berhubungan dengan kes itu yang diajukan kepadanya oleh pegawai itu: Dengan syarat bahawa orang itu boleh enggan menjawab mana-mana soalan jika pegawai itu tidak atau enggan, apabila diminta, untuk mengemukakan kepadanya perakuan pemberikuasaan yang dikeluarkan oleh Ketua Pengarah kepada pegawai itu di bawah subseksyen 7(1): Dengan syarat selanjutnya bahawa orang itu boleh enggan menjawab mana-mana soalan yang jawapannya akan cenderung ke arah mendedahkannya kepada suatu pertuduhan atau penalti jenayah atau perlucuthakan."],"p":"XI"},{"ref":"s.45(3)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Orang itu wajib bercakap benar.","verbatim":["(3) Seseorang yang membuat pernyataan di bawah seksyen ini adalah terikat di sisi undang-undang untuk menyatakan yang benar sama ada atau tidak pernyataan itu dibuat pada keseluruhannya atau sebahagiannya sebagai jawapan kepada soalan-soalan."],"p":"XI"},{"ref":"s.45(4)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Pegawai mesti memaklumkan dahulu tentang s.45(2) dan (3).","verbatim":["(4) Seseorang pegawai yang mendapatkan maklumat daripada seseorang hendaklah terlebih dahulu memberitahu orang itu tentang peruntukan subseksyen (2) dan (3)."],"p":"XI"},{"ref":"s.45(5)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Pernyataan dicatat secara bertulis, dibacakan semula dalam bahasanya, dan ditandatangani atau dicap ibu jari.","verbatim":["(5) Sesuatu pernyataan yang dibuat oleh seseorang di bawah seksyen ini hendaklah, bilamana mungkin, ditukar ke dalam bentuk bertulis dan ditandatangani olehnya atau dicapkan dengan cap ibu jarinya, mengikut mana-mana yang berkenaan, selepas pernyataan itu dibacakan kepadanya dalam bahasa pernyataan yang dibuatnya dan selepas dia diberi peluang untuk membuat apa-apa pembetulan yang dia mahu."],"p":"XI"},{"ref":"s.45(6)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Soalan dan jawapan melalui jurubahasa dianggap dibuat terus kepada/oleh pegawai.","verbatim":["(6) Jika seseorang pegawai menggunakan bantuan jurubahasa, apa-apa siasatan atau rekuisisi kepada seseorang yang dibuat bagi pihak pegawai itu oleh jurubahasa itu hendaklah, bagi semua maksud, disifatkan sebagai telah sebenarnya dibuat oleh pegawai itu, dan apa-apa jawapan yang dibuat kepada jurubahasa itu hendaklah disifatkan sebagai telah sebenarnya dibuat kepada pegawai itu."],"p":"XI"},{"ref":"s.46","sec":"46","title":"Majikan, dsb., hendaklah membantu pegawai","gist":"Pemilik, penghuni, majikan, ejen dan pekerja mesti memberi bantuan yang diperlukan pegawai.","verbatim":["Pemunya atau penghuni, atau majikan di mana-mana tempat kerja dan ejen atau pekerja pemunya, penghuni atau majikan itu hendaklah memberikan apa-apa bantuan yang diperlukan oleh pegawai itu bagi apa-apa kemasukan, pemeriksaan atau siasatan atau bagi penjalanan kuasanya di bawah Akta ini."],"p":"XI"},{"ref":"s.47","sec":"47","title":"Kesalahan berhubungan dengan pemeriksaan, penelitian atau penyiasatan","gist":"[DIPINDA 2024] Kesalahan: (a) menghalang pegawai masuk; (b) menghalang pegawai atau menghasut orang lain berbuat demikian; (c) tidak mengemukakan dokumen; (d) menyembunyikan orang, loji atau bahan; (e) menghalang orang lain membantu; (ea) [BAHARU] tidak mematuhi arahan pegawai; (f) menghalang pegawai dengan apa cara lain. Hingga RM10,000 atau 1 tahun atau kedua-duanya.","verbatim":["Seseorang yang—","(a) enggan memberikan laluan masuk ke sesuatu tempat kerja kepada seseorang pegawai atau orang yang membantunya;","(b) menghalang seseorang pegawai menjalankan kuasanya di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya atau mendorong atau cuba untuk mendorong mana-mana orang lain untuk berbuat demikian;","(c) tidak menunjukkan apa-apa dokumen yang dikehendaki di bawah Akta ini oleh pegawai itu;","(d) menyembunyikan lokasi atau kewujudan mana-mana orang lain atau apa-apa loji atau bahan daripada pegawai itu;","(e) menghalang atau cuba menghalang mana-mana orang lain daripada membantu pegawai itu;","(ea) tidak mematuhi apa-apa arahan yang diberikan oleh seseorang pegawai yang semunasabahnya perlu bagi maksud apa-apa pemeriksaan, penelitian atau penyiasatan; atau","(f) dengan apa-apa cara lain, menghalang, menyekat, atau menentang pegawai itu dalam menjalankan kuasanya di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya, adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi sepuluh ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"XI"},{"ref":"s.48(1)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Jika tempat kerja, loji, bahan atau proses mungkin berbahaya, pegawai mesti mengeluarkan Notis Penambahbaikan (NIP) supaya bahaya dihapuskan atau kecacatan dibaiki dalam tempoh tertentu.","verbatim":["(1) Jika seseorang pegawai berpendapat bahawa tempat kerja, loji, bahan atau proses mungkin akan menjadi bahaya, atau mungkin akan menyebabkan kecederaan badan atau menjadi risiko yang serius kepada kesihatan mana-mana orang, atau mungkin akan menyebabkan kerosakan kepada mana-mana harta, dia hendaklah menyerahkan suatu notis perbaikan kepada orang yang di bawah kawalannya tempat kerja, loji, bahan atau proses itu terletak menghendaki orang itu mengambil langkah-langkah untuk menghapuskan bahaya itu atau membetulkan apa-apa kecacatan dalam apa-apa tempoh yang dinyatakan olehnya dalam notis itu atau apa-apa tempoh lanjutan yang dibenarkan olehnya."],"p":"XI"},{"ref":"s.48(2)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Jika kecacatan itu mungkin menyebabkan bahaya segera kepada nyawa atau harta, pegawai mesti mengeluarkan Notis Larangan (NL) melarang penggunaan sehingga bahaya dihapuskan.","verbatim":["(2) Jika seseorang pegawai berpendapat bahawa kecacatan dalam subseksyen (1) adalah mungkin akan menyebabkan bahaya serta-merta kepada kehidupan atau harta, dia hendaklah menyampaikan suatu notis larangan melarang penggunaan atau pengendalian tempat kerja, loji, bahan atau proses itu sehingga masa apa-apa bahaya yang timbul dihapuskan dan kecacatan itu diperbaiki hingga pegawai itu berpuas hati."],"p":"XI"},{"ref":"s.48(3)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Notis mesti menyatakan (a) pendapat pegawai dan sebabnya, dan (b) peruntukan yang dilanggar dan sebabnya.","verbatim":["(3) Notis perbaikan atau notis larangan di bawah subseksyen (1) atau (2) hendaklah—","(a) menyatakan bahawa pegawai itu berpendapat bahawa berkenaan dengan loji, bahan atau proses di tempat kerja itu, berlaku atau mungkin berlaku aktiviti yang menjadi atau mungkin akan menjadi bahaya atau mungkin akan menyebabkan kecederaan badan atau risiko yang serius kepada kesihatan mana-mana orang atau mungkin akan menyebabkan kerosakan atau mungkin akan menyebabkan bahaya serta-merta kepada nyawa atau harta, dan menyatakan sebab-sebab bagi pendapat itu; dan","(b) jika pada pendapat pegawai itu aktiviti yang berkenaan ialah suatu pelanggaran atau mungkin menjadi suatu pelanggaran mana-mana peruntukan Akta ini atau mana-mana peraturan yang dibuat di bawahnya, menyatakan peruntukan itu dan sebab-sebab bagi pendapat itu."],"p":"XI"},{"ref":"s.48(4)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Notis boleh mengandungi arahan langkah yang perlu diambil, termasuk merujuk ICOP.","verbatim":["(4) Seseorang pegawai boleh memasukkan dalam sesuatu notis perbaikan atau notis larangan arahan mengenai langkah-langkah yang hendaklah diambil untuk menghapuskan apa-apa bahaya, kemungkinan bahaya, risiko, perkara-perkara atau aktiviti-aktiviti yang notis itu berhubungan dengannya dan arahan itu boleh merujuk kepada mana-mana tataamalan industri yang diluluskan."],"p":"XI"},{"ref":"s.48(5)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Pegawai boleh menjadikan tempat kerja, loji, bahan atau proses tidak boleh dikendalikan.","verbatim":["(5) Tanpa menjejaskan peruntukan subseksyen (2) seseorang pegawai boleh, jika difikirkannya perlu, terus menjadikan tempat kerja, loji, bahan atau proses itu tidak berfungsi melalui apa-apa cara yang difikirkannya sesuai bagi maksud itu."],"p":"XI"},{"ref":"s.48(6)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Pegawai boleh menuntut kos tindakan itu daripada penghuni atau orang yang mengawal.","verbatim":["(6) Jika tindakan sedemikian diambil oleh pegawai itu di bawah subseksyen (5) dia boleh, jika difikirkannya patut, mendapatkan kos bagi tindakan itu daripada penghuni atau orang yang mempunyai tanggungjawab atau kawalan ke atas tempat kerja, loji, bahan atau proses itu."],"p":"XI"},{"ref":"s.49(1)","sec":"49","title":"Penalti kerana tidak mematuhi notis","gist":"NIP atau NL mesti dipatuhi walaupun rayuan telah dibuat.","verbatim":["(1) Seseorang yang kepadanya suatu notis perbaikan atau larangan dikeluarkan di bawah seksyen 48 mesti mematuhinya walaupun rayuan terhadap pengeluaran notis itu telah dibuat."],"p":"XI"},{"ref":"s.49(2)","sec":"49","title":"Penalti kerana tidak mematuhi notis","gist":"[DIPINDA 2024] Gagal mematuhi: hingga RM500,000 atau 2 tahun atau kedua-duanya, ditambah RM2,000 sehari selagi berterusan (dahulu RM50,000 / 5 tahun / RM500 sehari).","verbatim":["(2) Seseorang yang tanpa alasan munasabah tidak mematuhi mana-mana notis perbaikan atau larangan yang dikeluarkan di bawah seksyen 48 adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi lima ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya, dan boleh didenda selanjutnya dua ribu ringgit bagi setiap hari kesalahan itu berterusan."],"p":"XI"},{"ref":"s.50(1)","sec":"50","title":"Orang terkilan boleh merayu","gist":"Rayuan terhadap notis kepada KP dalam 30 hari; KP boleh mengesahkan, membatalkan atau mengubah notis.","verbatim":["(1) Seseorang yang terkilan oleh mana-mana notis yang dikeluarkan oleh seseorang pegawai di bawah seksyen 48 boleh, dalam tempoh tiga puluh hari dari tarikh notis itu, merayu kepada Ketua Pengarah yang boleh, selepas menimbangkan rayuan itu, melalui perintah bertulis mengesahkan, membatalkan atau mengubah notis itu."],"p":"XI"},{"ref":"s.50(2)","sec":"50","title":"Orang terkilan boleh merayu","gist":"Rayuan terhadap keputusan KP kepada jawatankuasa rayuan dalam 30 hari.","verbatim":["(2) Seseorang yang terkilan dengan keputusan Ketua Pengarah yang dibuat di bawah subseksyen (1) boleh, dalam tempoh tiga puluh hari dari tarikh keputusan itu, merayu kepada suatu jawatankuasa rayuan yang dilantik oleh Menteri di bawah seksyen 63."],"p":"XI"},{"ref":"s.50(3)","sec":"50","title":"Orang terkilan boleh merayu","gist":"Jika notis dikeluarkan oleh KP atau Timbalan KP, rayuan terus kepada jawatankuasa rayuan.","verbatim":["(3) Jika notis perbaikan atau larangan dikeluarkan oleh Ketua Pengarah atau Timbalan Ketua Pengarah dalam menjalankan kuasa yang diberikan di bawah seksyen 48, rayuan itu hendaklah dibuat kepada suatu jawatankuasa rayuan yang dilantik oleh Menteri di bawah seksyen 63."],"p":"XI"},{"ref":"s.51","sec":"51","title":"Penalti am","gist":"[DIPINDA 2024] Penalti am jika tiada penalti khusus: hingga RM100,000 atau 1 tahun atau kedua-duanya, dan bagi kesalahan berterusan hingga RM2,000 sehari selepas sabitan (dahulu RM10,000 / RM1,000 sehari).","verbatim":["Seseorang yang melalui apa-apa perbuatan atau peninggalan melanggar mana-mana peruntukan Akta ini atau mana-mana perundangan subsidiari yang dibuat di bawahnya adalah melakukan suatu kesalahan dan, jika tiada penalti dinyatakan secara nyata, apabila disabitkan, boleh didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya dan, dalam hal kesalahan yang berterusan, boleh didenda tidak melebihi dua ribu ringgit bagi tiap-tiap hari atau sebahagian daripada sehari semasa kesalahan itu berterusan selepas sabitan."],"p":"XII"},{"ref":"s.52(a)","sec":"52","title":"Tanggungan pengarah, dsb., bagi syarikat, dsb.","gist":"[DIPINDA 2024] Jika syarikat, PLT, firma atau pertubuhan melakukan kesalahan, pengarah, pegawai pematuhan, rakan kongsi, pengurus, setiausaha atau pegawai seumpamanya boleh dituduh bersama atau berasingan.","verbatim":["Jika mana-mana orang yang melakukan suatu kesalahan di bawah Akta ini atau mana-mana perundangan subsidiari yang dibuat di bawah Akta ini ialah suatu syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain, seseorang yang pada masa pelakuan kesalahan itu ialah seorang pengarah, pegawai pematuhan, pekongsi, pengurus, setiausaha atau pegawai lain yang seumpamanya bagi syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain itu atau yang berupa sebagai bertindak atas sifat itu atau yang dengan apa-apa cara atau sehingga apa-apa takat bertanggungjawab bagi pengurusan apa-apa hal ehwal syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain itu atau yang membantu dalam pengurusannya—","(a) boleh dipertuduh secara berasingan atau bersesama dalam prosiding yang sama bersekali dengan syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain itu; dan"],"p":"XII"},{"ref":"s.52(b)","sec":"52","title":"Tanggungan pengarah, dsb., bagi syarikat, dsb.","gist":"Jika syarikat didapati bersalah, mereka dianggap bersalah juga, kecuali membuktikan (i) kesalahan berlaku tanpa pengetahuannya, dan (ii) tanpa persetujuannya serta dia telah mengambil semua langkah berjaga-jaga dan usaha wajar.","verbatim":["Jika mana-mana orang yang melakukan suatu kesalahan di bawah Akta ini atau mana-mana perundangan subsidiari yang dibuat di bawah Akta ini ialah suatu syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain, seseorang yang pada masa pelakuan kesalahan itu ialah seorang pengarah, pegawai pematuhan, pekongsi, pengurus, setiausaha atau pegawai lain yang seumpamanya bagi syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain itu atau yang berupa sebagai bertindak atas sifat itu atau yang dengan apa-apa cara atau sehingga apa-apa takat bertanggungjawab bagi pengurusan apa-apa hal ehwal syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain itu atau yang membantu dalam pengurusannya—","(b) jika syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang itu didapati bersalah atas kesalahan itu, hendaklah disifatkan bersalah atas kesalahan itu dan boleh dikenakan hukuman atau penalti yang sama sebagaimana seorang individu melainkan jika, dengan mengambil kira jenis fungsinya atas sifat itu dan segala hal keadaan, dia membuktikan— (i) bahawa kesalahan itu pengetahuannya; dan telah dilakukan tanpa (ii) bahawa kesalahan itu telah dilakukan tanpa persetujuan atau pembiarannya dan bahawa dia telah mengambil segala langkah yang munasabah dan menjalankan usaha yang wajar untuk menghalang pelakuan kesalahan itu."],"p":"XII"},{"ref":"s.52A","sec":"52A","title":"Tanggungan seseorang bagi perbuatan, dsb., pekerja, dsb.","gist":"[BAHARU 2024] Seseorang bertanggungan atas kesalahan (a) pekerjanya semasa bekerja; (b) ejennya; atau (c) pekerja ejennya, seolah-olah dia sendiri yang melakukannya.","verbatim":["Jika mana-mana orang boleh dikenakan apa-apa hukuman atau penalti di bawah Akta ini bagi apa-apa perbuatan, peninggalan, pengabaian atau keingkaran yang dilakukan—","(a) oleh pekerja orang itu dalam penjalanan pekerjaannya;","(b) oleh ejen orang itu apabila bertindak bagi pihak orang itu; atau","(c) oleh pekerja ejen orang itu semasa bertindak dalam penjalanan pekerjaannya dengan ejen orang itu atau selainnya bagi pihak ejen orang itu yang bertindak bagi pihak orang itu, orang itu boleh dikenakan hukuman atau penalti yang sama bagi tiap-tiap perbuatan, peninggalan, pengabaian atau keingkaran oleh pekerja atau ejen orang itu, atau pekerja ejen orang itu."],"p":"XII"},{"ref":"s.53(1)","sec":"53","title":"Kesalahan yang dilakukan oleh kesatuan sekerja","gist":"Jika kesatuan sekerja melakukan kesalahan, setiap pegawai, pekerja dan orang yang bertindak atas arahannya dianggap bersalah.","verbatim":["(1) Jika sesuatu kesatuan sekerja melalui apa-apa perbuatan atau peninggalan melanggar mana-mana peruntukan Akta ini atau mana-mana peraturan yang dibuat di bawahnya, tiap-tiap pegawai, pekerja dan orang yang berupa sebagai bertindak atas arahan mana-mana pegawai kesatuan sekerja itu hendaklah disifatkan telah melanggar peruntukan itu dan boleh dipertuduh bersesama dalam prosiding yang sama dengan kesatuan sekerja itu atau berasingan, dan tiap-tiap pegawai, pekerja atau orang itu hendaklah disifatkan telah melakukan kesalahan itu."],"p":"XII"},{"ref":"s.53(2)","sec":"53","title":"Kesalahan yang dilakukan oleh kesatuan sekerja","gist":"Mereka boleh didakwa walaupun kesatuan sekerja itu tidak didakwa.","verbatim":["(2) Prosiding boleh dimulakan terhadap seseorang dan dia boleh disabitkan di bawah peruntukan subseksyen (1) sama ada atau tidak prosiding telah dimulakan terhadap kesatuan sekerja itu atau kesatuan sekerja itu telah disabitkan di bawah peruntukan itu."],"p":"XII"},{"ref":"s.54","sec":"54","title":"Kesalahan yang dilakukan oleh ejen","gist":"Seseorang bertanggungan atas perbuatan ejennya seolah-olah dia yang melakukannya.","verbatim":["Seseorang yang boleh dikenakan apa-apa penalti di bawah Akta ini atau mana-mana peraturan yang dibuat bawahnya bagi apa-apa jua yang dibuat atau ditinggalkan jika perkara itu telah dibuat atau ditinggalkan olehnya sendiri boleh dikenakan penalti yang sama jika perkara itu telah dibuat atau ditinggalkan oleh ejennya."],"p":"XII"},{"ref":"s.55","sec":"55","title":"(Dipotong)","gist":"Dipotong oleh Akta A1648.","verbatim":["(Dipotong oleh Akta A1648)."],"p":"XII"},{"ref":"s.56","sec":"56","title":"Pertubuhan perbadanan atau kesatuan sekerja boleh didenda","gist":"Pertubuhan perbadanan atau kesatuan sekerja yang disabitkan hanya boleh dikenakan denda.","verbatim":["Jika seseorang yang disabitkan berkenaan dengan sesuatu kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya ialah suatu pertubuhan perbadanan atau kesatuan sekerja, ia hanya boleh dikenakan apa-apa hukuman denda yang diperuntukkan terhadapnya."],"p":"XII"},{"ref":"s.57","sec":"57","title":"Pembantuan dan persubahatan","gist":"Bersubahat dalam kesalahan dihukum dengan hukuman yang sama seperti kesalahan itu.","verbatim":["Seseorang yang membantu atau bersubahat pelakuan sesuatu kesalahan di bawah Akta ini hendaklah dihukum dengan hukuman yang diperuntukkan bagi kesalahan itu."],"p":"XII"},{"ref":"s.58","sec":"58","title":"Perlindungan terhadap liabiliti persendirian lanjut","gist":"Tiada liabiliti peribadi atas kerugian semasa menjalankan tugas di bawah Akta, kecuali dengan sengaja, melulu atau kecuaian melampau.","verbatim":["Tertakluk pada peruntukan Akta ini dan mana-mana peraturan yang dibuat di bawahnya, tiada seorang pun boleh menanggung apa-apa liabiliti persendirian bagi apa-apa kerugian atau kerosakan yang disebabkan oleh apa-apa perbuatan atau peninggalan olehnya dalam menjalankan kewajipan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya, melainkan jika kerugian atau kerosakan itu telah disebabkan dengan sengaja atau perbuatan melulu atau kecuaian melampau."],"p":"XII"},{"ref":"s.59","sec":"59","title":"Liabiliti sivil tidak ters
