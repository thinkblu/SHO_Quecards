soalan yang jawapannya akan cenderung ke arah mendedahkannya kepada suatu pertuduhan atau penalti jenayah atau perlucuthakan."],"p":"XI","ex":"Saksi boleh enggan menjawab soalan yang boleh membuktikan dia sendiri bersalah."},{"ref":"s.45(3)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Orang itu wajib bercakap benar.","verbatim":["(3) Seseorang yang membuat pernyataan di bawah seksyen ini adalah terikat di sisi undang-undang untuk menyatakan yang benar sama ada atau tidak pernyataan itu dibuat pada keseluruhannya atau sebahagiannya sebagai jawapan kepada soalan-soalan."],"p":"XI","ex":"Saksi yang memberi keterangan palsu kepada pegawai melakukan kesalahan."},{"ref":"s.45(4)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Pegawai mesti memaklumkan dahulu tentang s.45(2) dan (3).","verbatim":["(4) Seseorang pegawai yang mendapatkan maklumat daripada seseorang hendaklah terlebih dahulu memberitahu orang itu tentang peruntukan subseksyen (2) dan (3)."],"p":"XI","ex":"Sebelum menyoal, pegawai menerangkan hak saksi dan kewajipannya untuk bercakap benar."},{"ref":"s.45(5)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Pernyataan dicatat secara bertulis, dibacakan semula dalam bahasanya, dan ditandatangani atau dicap ibu jari.","verbatim":["(5) Sesuatu pernyataan yang dibuat oleh seseorang di bawah seksyen ini hendaklah, bilamana mungkin, ditukar ke dalam bentuk bertulis dan ditandatangani olehnya atau dicapkan dengan cap ibu jarinya, mengikut mana-mana yang berkenaan, selepas pernyataan itu dibacakan kepadanya dalam bahasa pernyataan yang dibuatnya dan selepas dia diberi peluang untuk membuat apa-apa pembetulan yang dia mahu."],"p":"XI","ex":"Pernyataan pekerja Myanmar dibacakan semula dalam bahasanya sebelum dia menurunkan cap ibu jari."},{"ref":"s.45(6)","sec":"45","title":"Kuasa untuk memeriksa saksi","gist":"Soalan dan jawapan melalui jurubahasa dianggap dibuat terus kepada/oleh pegawai.","verbatim":["(6) Jika seseorang pegawai menggunakan bantuan jurubahasa, apa-apa siasatan atau rekuisisi kepada seseorang yang dibuat bagi pihak pegawai itu oleh jurubahasa itu hendaklah, bagi semua maksud, disifatkan sebagai telah sebenarnya dibuat oleh pegawai itu, dan apa-apa jawapan yang dibuat kepada jurubahasa itu hendaklah disifatkan sebagai telah sebenarnya dibuat kepada pegawai itu."],"p":"XI","ex":"Jawapan saksi melalui jurubahasa Nepal dianggap diberi terus kepada pegawai."},{"ref":"s.46","sec":"46","title":"Majikan, dsb., hendaklah membantu pegawai","gist":"Pemilik, penghuni, majikan, ejen dan pekerja mesti memberi bantuan yang diperlukan pegawai.","verbatim":["Pemunya atau penghuni, atau majikan di mana-mana tempat kerja dan ejen atau pekerja pemunya, penghuni atau majikan itu hendaklah memberikan apa-apa bantuan yang diperlukan oleh pegawai itu bagi apa-apa kemasukan, pemeriksaan atau siasatan atau bagi penjalanan kuasanya di bawah Akta ini."],"p":"XI","ex":"Penyelia membuka stor dan menunjukkan rekod penyelenggaraan apabila diminta pegawai."},{"ref":"s.47","sec":"47","title":"Kesalahan berhubungan dengan pemeriksaan, penelitian atau penyiasatan","gist":"[DIPINDA 2024] Kesalahan: (a) menghalang pegawai masuk; (b) menghalang pegawai atau menghasut orang lain berbuat demikian; (c) tidak mengemukakan dokumen; (d) menyembunyikan orang, loji atau bahan; (e) menghalang orang lain membantu; (ea) [BAHARU] tidak mematuhi arahan pegawai; (f) menghalang pegawai dengan apa cara lain. Hingga RM10,000 atau 1 tahun atau kedua-duanya.","verbatim":["Seseorang yang—","(a) enggan memberikan laluan masuk ke sesuatu tempat kerja kepada seseorang pegawai atau orang yang membantunya;","(b) menghalang seseorang pegawai menjalankan kuasanya di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya atau mendorong atau cuba untuk mendorong mana-mana orang lain untuk berbuat demikian;","(c) tidak menunjukkan apa-apa dokumen yang dikehendaki di bawah Akta ini oleh pegawai itu;","(d) menyembunyikan lokasi atau kewujudan mana-mana orang lain atau apa-apa loji atau bahan daripada pegawai itu;","(e) menghalang atau cuba menghalang mana-mana orang lain daripada membantu pegawai itu;","(ea) tidak mematuhi apa-apa arahan yang diberikan oleh seseorang pegawai yang semunasabahnya perlu bagi maksud apa-apa pemeriksaan, penelitian atau penyiasatan; atau","(f) dengan apa-apa cara lain, menghalang, menyekat, atau menentang pegawai itu dalam menjalankan kuasanya di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya, adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi sepuluh ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"XI","ex":"Pengawal keselamatan yang menghalang pegawai masuk ke kilang boleh didenda hingga RM10,000."},{"ref":"s.48(1)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Jika tempat kerja, loji, bahan atau proses mungkin berbahaya, pegawai mesti mengeluarkan Notis Penambahbaikan (NIP) supaya bahaya dihapuskan atau kecacatan dibaiki dalam tempoh tertentu.","verbatim":["(1) Jika seseorang pegawai berpendapat bahawa tempat kerja, loji, bahan atau proses mungkin akan menjadi bahaya, atau mungkin akan menyebabkan kecederaan badan atau menjadi risiko yang serius kepada kesihatan mana-mana orang, atau mungkin akan menyebabkan kerosakan kepada mana-mana harta, dia hendaklah menyerahkan suatu notis perbaikan kepada orang yang di bawah kawalannya tempat kerja, loji, bahan atau proses itu terletak menghendaki orang itu mengambil langkah-langkah untuk menghapuskan bahaya itu atau membetulkan apa-apa kecacatan dalam apa-apa tempoh yang dinyatakan olehnya dalam notis itu atau apa-apa tempoh lanjutan yang dibenarkan olehnya."],"p":"XI","ex":"Pegawai mengeluarkan Notis Penambahbaikan supaya pengadang mesin dipasang dalam 14 hari."},{"ref":"s.48(2)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Jika kecacatan itu mungkin menyebabkan bahaya segera kepada nyawa atau harta, pegawai mesti mengeluarkan Notis Larangan (NL) melarang penggunaan sehingga bahaya dihapuskan.","verbatim":["(2) Jika seseorang pegawai berpendapat bahawa kecacatan dalam subseksyen (1) adalah mungkin akan menyebabkan bahaya serta-merta kepada kehidupan atau harta, dia hendaklah menyampaikan suatu notis larangan melarang penggunaan atau pengendalian tempat kerja, loji, bahan atau proses itu sehingga masa apa-apa bahaya yang timbul dihapuskan dan kecacatan itu diperbaiki hingga pegawai itu berpuas hati."],"p":"XI","ex":"Pegawai mengeluarkan Notis Larangan supaya perancah yang hampir runtuh tidak digunakan."},{"ref":"s.48(3)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Notis mesti menyatakan (a) pendapat pegawai dan sebabnya, dan (b) peruntukan yang dilanggar dan sebabnya.","verbatim":["(3) Notis perbaikan atau notis larangan di bawah subseksyen (1) atau (2) hendaklah—","(a) menyatakan bahawa pegawai itu berpendapat bahawa berkenaan dengan loji, bahan atau proses di tempat kerja itu, berlaku atau mungkin berlaku aktiviti yang menjadi atau mungkin akan menjadi bahaya atau mungkin akan menyebabkan kecederaan badan atau risiko yang serius kepada kesihatan mana-mana orang atau mungkin akan menyebabkan kerosakan atau mungkin akan menyebabkan bahaya serta-merta kepada nyawa atau harta, dan menyatakan sebab-sebab bagi pendapat itu; dan","(b) jika pada pendapat pegawai itu aktiviti yang berkenaan ialah suatu pelanggaran atau mungkin menjadi suatu pelanggaran mana-mana peruntukan Akta ini atau mana-mana peraturan yang dibuat di bawahnya, menyatakan peruntukan itu dan sebab-sebab bagi pendapat itu."],"p":"XI","ex":"Notis menyatakan pengadang tiada dan ini melanggar kewajipan majikan di bawah s.15(2)(a)."},{"ref":"s.48(4)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Notis boleh mengandungi arahan langkah yang perlu diambil, termasuk merujuk ICOP.","verbatim":["(4) Seseorang pegawai boleh memasukkan dalam sesuatu notis perbaikan atau notis larangan arahan mengenai langkah-langkah yang hendaklah diambil untuk menghapuskan apa-apa bahaya, kemungkinan bahaya, risiko, perkara-perkara atau aktiviti-aktiviti yang notis itu berhubungan dengannya dan arahan itu boleh merujuk kepada mana-mana tataamalan industri yang diluluskan."],"p":"XI","ex":"Notis mengarahkan majikan memasang LEV mengikut ICOP berkaitan."},{"ref":"s.48(5)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Pegawai boleh menjadikan tempat kerja, loji, bahan atau proses tidak boleh dikendalikan.","verbatim":["(5) Tanpa menjejaskan peruntukan subseksyen (2) seseorang pegawai boleh, jika difikirkannya perlu, terus menjadikan tempat kerja, loji, bahan atau proses itu tidak berfungsi melalui apa-apa cara yang difikirkannya sesuai bagi maksud itu."],"p":"XI","ex":"Pegawai memutuskan bekalan elektrik mesin yang berbahaya supaya ia tidak boleh dikendalikan."},{"ref":"s.48(6)","sec":"48","title":"Notis perbaikan dan notis larangan","gist":"Pegawai boleh menuntut kos tindakan itu daripada penghuni atau orang yang mengawal.","verbatim":["(6) Jika tindakan sedemikian diambil oleh pegawai itu di bawah subseksyen (5) dia boleh, jika difikirkannya patut, mendapatkan kos bagi tindakan itu daripada penghuni atau orang yang mempunyai tanggungjawab atau kawalan ke atas tempat kerja, loji, bahan atau proses itu."],"p":"XI","ex":"Kos mengunci dan menghentikan mesin dituntut daripada pemilik kilang."},{"ref":"s.49(1)","sec":"49","title":"Penalti kerana tidak mematuhi notis","gist":"NIP atau NL mesti dipatuhi walaupun rayuan telah dibuat.","verbatim":["(1) Seseorang yang kepadanya suatu notis perbaikan atau larangan dikeluarkan di bawah seksyen 48 mesti mematuhinya walaupun rayuan terhadap pengeluaran notis itu telah dibuat."],"p":"XI","ex":"Walaupun majikan telah merayu, mesin itu tetap tidak boleh digunakan selagi Notis Larangan berkuat kuasa."},{"ref":"s.49(2)","sec":"49","title":"Penalti kerana tidak mematuhi notis","gist":"[DIPINDA 2024] Gagal mematuhi: hingga RM500,000 atau 2 tahun atau kedua-duanya, ditambah RM2,000 sehari selagi berterusan (dahulu RM50,000 / 5 tahun / RM500 sehari).","verbatim":["(2) Seseorang yang tanpa alasan munasabah tidak mematuhi mana-mana notis perbaikan atau larangan yang dikeluarkan di bawah seksyen 48 adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi lima ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya, dan boleh didenda selanjutnya dua ribu ringgit bagi setiap hari kesalahan itu berterusan."],"p":"XI","ex":"Majikan yang terus menggunakan mesin selama 5 hari selepas sabitan boleh didenda tambahan RM2,000 sehari."},{"ref":"s.50(1)","sec":"50","title":"Orang terkilan boleh merayu","gist":"Rayuan terhadap notis kepada KP dalam 30 hari; KP boleh mengesahkan, membatalkan atau mengubah notis.","verbatim":["(1) Seseorang yang terkilan oleh mana-mana notis yang dikeluarkan oleh seseorang pegawai di bawah seksyen 48 boleh, dalam tempoh tiga puluh hari dari tarikh notis itu, merayu kepada Ketua Pengarah yang boleh, selepas menimbangkan rayuan itu, melalui perintah bertulis mengesahkan, membatalkan atau mengubah notis itu."],"p":"XI","ex":"Majikan merayu kepada KP dalam 30 hari kerana tidak bersetuju dengan Notis Penambahbaikan."},{"ref":"s.50(2)","sec":"50","title":"Orang terkilan boleh merayu","gist":"Rayuan terhadap keputusan KP kepada jawatankuasa rayuan dalam 30 hari.","verbatim":["(2) Seseorang yang terkilan dengan keputusan Ketua Pengarah yang dibuat di bawah subseksyen (1) boleh, dalam tempoh tiga puluh hari dari tarikh keputusan itu, merayu kepada suatu jawatankuasa rayuan yang dilantik oleh Menteri di bawah seksyen 63."],"p":"XI","ex":"Majikan yang tidak berpuas hati dengan keputusan KP merayu kepada jawatankuasa rayuan dalam 30 hari."},{"ref":"s.50(3)","sec":"50","title":"Orang terkilan boleh merayu","gist":"Jika notis dikeluarkan oleh KP atau Timbalan KP, rayuan terus kepada jawatankuasa rayuan.","verbatim":["(3) Jika notis perbaikan atau larangan dikeluarkan oleh Ketua Pengarah atau Timbalan Ketua Pengarah dalam menjalankan kuasa yang diberikan di bawah seksyen 48, rayuan itu hendaklah dibuat kepada suatu jawatankuasa rayuan yang dilantik oleh Menteri di bawah seksyen 63."],"p":"XI","ex":"Notis yang dikeluarkan oleh Timbalan KP terus dirayu kepada jawatankuasa rayuan."},{"ref":"s.51","sec":"51","title":"Penalti am","gist":"[DIPINDA 2024] Penalti am jika tiada penalti khusus: hingga RM100,000 atau 1 tahun atau kedua-duanya, dan bagi kesalahan berterusan hingga RM2,000 sehari selepas sabitan (dahulu RM10,000 / RM1,000 sehari).","verbatim":["Seseorang yang melalui apa-apa perbuatan atau peninggalan melanggar mana-mana peruntukan Akta ini atau mana-mana perundangan subsidiari yang dibuat di bawahnya adalah melakukan suatu kesalahan dan, jika tiada penalti dinyatakan secara nyata, apabila disabitkan, boleh didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya dan, dalam hal kesalahan yang berterusan, boleh didenda tidak melebihi dua ribu ringgit bagi tiap-tiap hari atau sebahagian daripada sehari semasa kesalahan itu berterusan selepas sabitan."],"p":"XII","ex":"Kesalahan tanpa penalti khusus, seperti gagal menyimpan rekod, boleh didenda hingga RM100,000."},{"ref":"s.52(a)","sec":"52","title":"Tanggungan pengarah, dsb., bagi syarikat, dsb.","gist":"[DIPINDA 2024] Jika syarikat, PLT, firma atau pertubuhan melakukan kesalahan, pengarah, pegawai pematuhan, rakan kongsi, pengurus, setiausaha atau pegawai seumpamanya boleh dituduh bersama atau berasingan.","verbatim":["Jika mana-mana orang yang melakukan suatu kesalahan di bawah Akta ini atau mana-mana perundangan subsidiari yang dibuat di bawah Akta ini ialah suatu syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain, seseorang yang pada masa pelakuan kesalahan itu ialah seorang pengarah, pegawai pematuhan, pekongsi, pengurus, setiausaha atau pegawai lain yang seumpamanya bagi syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain itu atau yang berupa sebagai bertindak atas sifat itu atau yang dengan apa-apa cara atau sehingga apa-apa takat bertanggungjawab bagi pengurusan apa-apa hal ehwal syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain itu atau yang membantu dalam pengurusannya—","(a) boleh dipertuduh secara berasingan atau bersesama dalam prosiding yang sama bersekali dengan syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain itu; dan"],"p":"XII","ex":"Pengarah syarikat kontraktor didakwa bersama syarikatnya selepas pekerja jatuh dari bangunan."},{"ref":"s.52(b)","sec":"52","title":"Tanggungan pengarah, dsb., bagi syarikat, dsb.","gist":"Jika syarikat didapati bersalah, mereka dianggap bersalah juga, kecuali membuktikan (i) kesalahan berlaku tanpa pengetahuannya, dan (ii) tanpa persetujuannya serta dia telah mengambil semua langkah berjaga-jaga dan usaha wajar.","verbatim":["Jika mana-mana orang yang melakukan suatu kesalahan di bawah Akta ini atau mana-mana perundangan subsidiari yang dibuat di bawah Akta ini ialah suatu syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain, seseorang yang pada masa pelakuan kesalahan itu ialah seorang pengarah, pegawai pematuhan, pekongsi, pengurus, setiausaha atau pegawai lain yang seumpamanya bagi syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain itu atau yang berupa sebagai bertindak atas sifat itu atau yang dengan apa-apa cara atau sehingga apa-apa takat bertanggungjawab bagi pengurusan apa-apa hal ehwal syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang yang lain itu atau yang membantu dalam pengurusannya—","(b) jika syarikat, perkongsian liabiliti terhad, firma, pertubuhan atau kumpulan orang itu didapati bersalah atas kesalahan itu, hendaklah disifatkan bersalah atas kesalahan itu dan boleh dikenakan hukuman atau penalti yang sama sebagaimana seorang individu melainkan jika, dengan mengambil kira jenis fungsinya atas sifat itu dan segala hal keadaan, dia membuktikan— (i) bahawa kesalahan itu pengetahuannya; dan telah dilakukan tanpa (ii) bahawa kesalahan itu telah dilakukan tanpa persetujuan atau pembiarannya dan bahawa dia telah mengambil segala langkah yang munasabah dan menjalankan usaha yang wajar untuk menghalang pelakuan kesalahan itu."],"p":"XII","ex":"Pengarah boleh terlepas jika membuktikan kesalahan berlaku tanpa pengetahuannya dan dia telah berusaha mencegahnya."},{"ref":"s.52A","sec":"52A","title":"Tanggungan seseorang bagi perbuatan, dsb., pekerja, dsb.","gist":"[BAHARU 2024] Seseorang bertanggungan atas kesalahan (a) pekerjanya semasa bekerja; (b) ejennya; atau (c) pekerja ejennya, seolah-olah dia sendiri yang melakukannya.","verbatim":["Jika mana-mana orang boleh dikenakan apa-apa hukuman atau penalti di bawah Akta ini bagi apa-apa perbuatan, peninggalan, pengabaian atau keingkaran yang dilakukan—","(a) oleh pekerja orang itu dalam penjalanan pekerjaannya;","(b) oleh ejen orang itu apabila bertindak bagi pihak orang itu; atau","(c) oleh pekerja ejen orang itu semasa bertindak dalam penjalanan pekerjaannya dengan ejen orang itu atau selainnya bagi pihak ejen orang itu yang bertindak bagi pihak orang itu, orang itu boleh dikenakan hukuman atau penalti yang sama bagi tiap-tiap perbuatan, peninggalan, pengabaian atau keingkaran oleh pekerja atau ejen orang itu, atau pekerja ejen orang itu."],"p":"XII","ex":"Majikan bertanggungan apabila pekerjanya mengendalikan kren tanpa PMA semasa bekerja."},{"ref":"s.53(1)","sec":"53","title":"Kesalahan yang dilakukan oleh kesatuan sekerja","gist":"Jika kesatuan sekerja melakukan kesalahan, setiap pegawai, pekerja dan orang yang bertindak atas arahannya dianggap bersalah.","verbatim":["(1) Jika sesuatu kesatuan sekerja melalui apa-apa perbuatan atau peninggalan melanggar mana-mana peruntukan Akta ini atau mana-mana peraturan yang dibuat di bawahnya, tiap-tiap pegawai, pekerja dan orang yang berupa sebagai bertindak atas arahan mana-mana pegawai kesatuan sekerja itu hendaklah disifatkan telah melanggar peruntukan itu dan boleh dipertuduh bersesama dalam prosiding yang sama dengan kesatuan sekerja itu atau berasingan, dan tiap-tiap pegawai, pekerja atau orang itu hendaklah disifatkan telah melakukan kesalahan itu."],"p":"XII","ex":"Pegawai kesatuan yang mengarahkan ahli menanggalkan pengadang mesin dianggap bersalah."},{"ref":"s.53(2)","sec":"53","title":"Kesalahan yang dilakukan oleh kesatuan sekerja","gist":"Mereka boleh didakwa walaupun kesatuan sekerja itu tidak didakwa.","verbatim":["(2) Prosiding boleh dimulakan terhadap seseorang dan dia boleh disabitkan di bawah peruntukan subseksyen (1) sama ada atau tidak prosiding telah dimulakan terhadap kesatuan sekerja itu atau kesatuan sekerja itu telah disabitkan di bawah peruntukan itu."],"p":"XII","ex":"Pegawai kesatuan didakwa walaupun kesatuan sekerjanya tidak didakwa."},{"ref":"s.54","sec":"54","title":"Kesalahan yang dilakukan oleh ejen","gist":"Seseorang bertanggungan atas perbuatan ejennya seolah-olah dia yang melakukannya.","verbatim":["Seseorang yang boleh dikenakan apa-apa penalti di bawah Akta ini atau mana-mana peraturan yang dibuat bawahnya bagi apa-apa jua yang dibuat atau ditinggalkan jika perkara itu telah dibuat atau ditinggalkan olehnya sendiri boleh dikenakan penalti yang sama jika perkara itu telah dibuat atau ditinggalkan oleh ejennya."],"p":"XII","ex":"Syarikat bertanggungan apabila ejen pembeliannya membeli bahan kimia yang dilarang."},{"ref":"s.55","sec":"55","title":"(Dipotong)","gist":"Dipotong oleh Akta A1648.","verbatim":["(Dipotong oleh Akta A1648)."],"p":"XII","ex":"Peruntukan ini telah dipotong dan tiada lagi kesannya."},{"ref":"s.56","sec":"56","title":"Pertubuhan perbadanan atau kesatuan sekerja boleh didenda","gist":"Pertubuhan perbadanan atau kesatuan sekerja yang disabitkan hanya boleh dikenakan denda.","verbatim":["Jika seseorang yang disabitkan berkenaan dengan sesuatu kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya ialah suatu pertubuhan perbadanan atau kesatuan sekerja, ia hanya boleh dikenakan apa-apa hukuman denda yang diperuntukkan terhadapnya."],"p":"XII","ex":"Syarikat yang disabitkan hanya didenda kerana syarikat tidak boleh dipenjarakan."},{"ref":"s.57","sec":"57","title":"Pembantuan dan persubahatan","gist":"Bersubahat dalam kesalahan dihukum dengan hukuman yang sama seperti kesalahan itu.","verbatim":["Seseorang yang membantu atau bersubahat pelakuan sesuatu kesalahan di bawah Akta ini hendaklah dihukum dengan hukuman yang diperuntukkan bagi kesalahan itu."],"p":"XII","ex":"Penyelia yang menyuruh pekerja menanggalkan pengadang mesin dihukum sama seperti pekerja yang melakukannya."},{"ref":"s.58","sec":"58","title":"Perlindungan terhadap liabiliti persendirian lanjut","gist":"Tiada liabiliti peribadi atas kerugian semasa menjalankan tugas di bawah Akta, kecuali dengan sengaja, melulu atau kecuaian melampau.","verbatim":["Tertakluk pada peruntukan Akta ini dan mana-mana peraturan yang dibuat di bawahnya, tiada seorang pun boleh menanggung apa-apa liabiliti persendirian bagi apa-apa kerugian atau kerosakan yang disebabkan oleh apa-apa perbuatan atau peninggalan olehnya dalam menjalankan kewajipan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya, melainkan jika kerugian atau kerosakan itu telah disebabkan dengan sengaja atau perbuatan melulu atau kecuaian melampau."],"p":"XII","ex":"Pegawai JKKP yang menutup kilang dengan suci hati tidak boleh disaman secara peribadi atas kerugian syarikat."},{"ref":"s.59","sec":"59","title":"Liabiliti sivil tidak tersentuh oleh Bahagian IV, V dan VI","gist":"Bahagian IV, V dan VI serta ICOP tidak (a) memberi hak menyaman secara sivil; (b) memberi pembelaan dalam tindakan sivil; atau (c) menjejaskan hak tuntutan sivil di bawah undang-undang lain.","verbatim":["Tiada apa-apa jua dalam Bahagian IV, V dan VI dan tataamalan industri yang relevan boleh ditafsirkan sebagai—","(a) memberikan hak tindakan dalam mana-mana prosiding sivil berkenaan dengan apa-apa pelanggaran, sama ada melalui perbuatan atau peninggalan, mana-mana peruntukan Bahagian itu;","(b) memberikan pembelaan terhadap sesuatu tindakan dalam mana-mana prosiding sivil atau selainnya yang menyentuh hal tindakan dalam mana-mana prosiding sivil; atau","(c) menyentuh takat, jika ada, sesuatu hak tindakan berbangkit atau prosiding sivil boleh diambil berkenaan dengan kemungkiran kewajipan-kewajipan yang dikenakan oleh perundangan lain berkaitan dengan keselamatan dan kesihatan."],"p":"XII","ex":"Pekerja tidak boleh menyaman majikan secara sivil hanya berdasarkan pelanggaran s.15, tetapi masih boleh menyaman atas kecuaian."},{"ref":"s.60","sec":"60","title":"Beban membuktikan had apa yang praktik","gist":"Bagi kesalahan berkaitan kewajipan \"setakat yang praktik\", tertuduh yang mesti membuktikan bahawa tidak praktik untuk berbuat lebih daripada yang telah dibuat.","verbatim":["Dalam apa-apa prosiding bagi sesuatu kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya kerana tidak mematuhi kewajipan atau kehendak supaya berbuat sesuatu setakat yang praktik, atau supaya menggunakan cara praktik yang terbaik untuk membuat sesuatu, tertuduh hendaklah membuktikan bahawa tidaklah praktik untuk membuat lebih daripada yang telah sebenarnya dibuat untuk memenuhi kewajipan atau kehendak itu, atau bahawa tidak ada cara praktik yang lebih baik daripada yang telah sebenarnya digunakan untuk memenuhi kewajipan atau kehendak itu."],"p":"XII","ex":"Majikan perlu membuktikan bahawa memasang pengadang tambahan tidak praktik dari segi kos dan teknikal."},{"ref":"s.60A","sec":"60A","title":"Keterangan","gist":"[BAHARU 2024] Laporan, rekod atau daftar yang disimpan dan diperakui pegawai adalah keterangan prima facie.","verbatim":["Dalam mana-mana prosiding di bawah Akta ini atau perundangan subsidiarinya, semua laporan, rekod atau daftar dan apa-apa cabutan daripadanya yang disimpan dan diperakui oleh seseorang pegawai hendaklah menjadi keterangan prima facie mengenai fakta yang dinyatakan di dalamnya."],"p":"XII","ex":"Rekod pemeriksaan yang diperakui pegawai JKKP diterima di mahkamah sebagai bukti awal."},{"ref":"s.61","sec":"61","title":"Pendakwaan","gist":"Pendakwaan boleh dijalankan oleh pegawai KKP atau pegawai yang diberi kuasa KP, dengan izin bertulis Pendakwa Raya.","verbatim":["Pendakwaan berkenaan dengan kesalahan-kesalahan yang dilakukan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya boleh, dengan keizinan bertulis terlebih dahulu daripada Pendakwa Raya, dimulakan dan dijalankan oleh seseorang pegawai keselamatan dan kesihatan pekerjaan atau oleh seseorang pegawai yang khusus diberi kuasa secara bertulis oleh Ketua Pengarah tertakluk pada peruntukan Kanun Prosedur Jenayah."],"p":"XII","ex":"Pegawai JKKP mendakwa majikan di mahkamah dengan izin bertulis Pendakwa Raya."},{"ref":"s.62(1)","sec":"62","title":"Pengkompaunan kesalahan","gist":"Menteri boleh, melalui perintah Warta, menetapkan kesalahan yang boleh dikompaun.","verbatim":["(1) Menteri boleh melalui perintah dalam Warta, menetapkan mana-mana kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya sebagai kesalahan yang boleh dikompaun."],"p":"XII","ex":"Menteri menyenaraikan kesalahan tertentu yang boleh dikompaun dalam perintah Warta."},{"ref":"s.62(2)","sec":"62","title":"Pengkompaunan kesalahan","gist":"KP boleh mengkompaun sebelum sabitan, hingga jumlah denda maksimum, hanya jika orang itu mengaku bersalah secara bertulis dan memintanya.","verbatim":["(2) Ketua Pengarah boleh pada bila-bila masa sebelum sabitan mengkompaun mana-mana kesalahan yang ditetapkan di bawah subseksyen (1) sebagai kesalahan yang boleh dikompaun dengan memungut daripada orang yang semunasabahnya disyaki telah melakukan kesalahan itu sejumlah wang yang tidak melebihi suatu amaun denda maksimum yang boleh dikenakan ke atas orang itu sekiranya dia disabitkan atas kesalahan itu: Dengan syarat bahawa Ketua Pengarah tidak boleh menjalankan kuasanya di bawah seksyen ini melainkan jika orang itu secara bertulis mengaku bahawa dia telah melakukan kesalahan itu dan meminta Ketua Pengarah memperlakukan kesalahan itu di bawah seksyen ini."],"p":"XII","ex":"Majikan mengaku salah secara bertulis dan membayar kompaun tanpa dibicarakan di mahkamah."},{"ref":"s.63(1)","sec":"63","title":"Jawatankuasa rayuan","gist":"Menteri melantik jawatankuasa rayuan untuk mendengar rayuan di bawah s.50.","verbatim":["(1) Menteri boleh melantik jawatankuasa-jawatankuasa rayuan bagi maksud menimbangkan apa-apa rayuan yang dibuat di bawah seksyen 50."],"p":"XIII","ex":"Menteri melantik jawatankuasa rayuan untuk mendengar rayuan terhadap Notis Larangan."},{"ref":"s.63(2)","sec":"63","title":"Jawatankuasa rayuan","gist":"Anggota: Pengerusi (daripada ahli Majlis) dan 2 orang lain yang berpengalaman dalam perkara yang dirayu.","verbatim":["(2) Sesuatu jawatankuasa rayuan hendaklah terdiri daripada Pengerusi yang hendaklah dilantik oleh Menteri daripada kalangan anggota Majlis dan dua orang lain yang hendaklah dilantik oleh Menteri yang, pada pendapatnya, mempunyai pengalaman dan pengetahuan luas dalam perkara-perkara yang berhubungan dengan hal perkara rayuan itu."],"p":"XIII","ex":"Jawatankuasa rayuan dipengerusikan ahli Majlis dan dianggotai dua jurutera berpengalaman."},{"ref":"s.63(3)","sec":"63","title":"Jawatankuasa rayuan","gist":"Anggota boleh dibayar elaun.","verbatim":["(3) Tiap-tiap anggota sesuatu jawatankuasa rayuan boleh dibayar elaun pada kadar atau kadar-kadar yang ditentukan oleh Menteri."],"p":"XIII","ex":"Ahli jawatankuasa rayuan dibayar elaun bagi setiap pendengaran."},{"ref":"s.64(1)","sec":"64","title":"Kuasa jawatankuasa rayuan","gist":"Jawatankuasa boleh mengesahkan, membatalkan atau mengubah keputusan KP atau notis yang dikeluarkan KP.","verbatim":["(1) Sesuatu jawatankuasa rayuan boleh, selepas mendengar suatu rayuan mengesahkan, membatalkan atau mengubah sesuatu keputusan yang dibuat oleh Ketua Pengarah di bawah subseksyen 50(1), atau sesuatu notis perbaikan atau larangan yang dikeluarkan oleh Ketua Pengarah di bawah seksyen 48."],"p":"XIII","ex":"Jawatankuasa membatalkan Notis Larangan selepas mendapati mesin telah dibaiki dengan betul."},{"ref":"s.64(2)","sec":"64","title":"Kuasa jawatankuasa rayuan","gist":"Jawatankuasa mesti memutuskan dan memaklumkan keputusan dengan segera.","verbatim":["(2) Sesuatu jawatankuasa rayuan hendaklah memutuskan dan memberitahu keputusannya dengan cepat kepada orang yang membuat rayuan itu."],"p":"XIII","ex":"Jawatankuasa memaklumkan keputusannya kepada majikan sebaik sahaja diputuskan."},{"ref":"s.65","sec":"65","title":"Keputusan jawatankuasa rayuan","gist":"Keputusan jawatankuasa rayuan adalah muktamad dan tidak boleh dipersoalkan di mahkamah.","verbatim":["Keputusan sesuatu jawatankuasa rayuan adalah muktamad dan konklusif dan tidak boleh dipersoalkan dalam mana-mana mahkamah."],"p":"XIII","ex":"Majikan tidak boleh membawa keputusan jawatankuasa rayuan ke mahkamah."},{"ref":"s.66(1)","sec":"66","title":"Peraturan-peraturan","gist":"Menteri boleh membuat peraturan tentang keselamatan, kesihatan dan kebajikan orang yang bekerja.","verbatim":["(1) Menteri boleh membuat peraturan-peraturan bagi atau berkenaan dengan keselamatan, kesihatan dan kebajikan orang-orang semasa bekerja bagi mencapai tujuan-tujuan Akta ini."],"p":"XIV","ex":"Menteri membuat Peraturan KKP (Pendedahan Bising) 2019 di bawah s.66."},{"ref":"s.66(2)","sec":"66","title":"Peraturan-peraturan","gist":"[DIPINDA 2024] Antaranya: (a) mengawal atau melarang loji, bahan, proses atau operasi; (b) reka bentuk, pemasangan, pemeriksaan, pembaikan loji; (ba) skim pemeriksaan khas; (c)–(d) ujian dan pelabelan bahan; (e) larangan makan, minum, merokok berhampiran bahan; (f) latihan dan penyeliaan; (g) prosedur notifikasi kemalangan; (h)–(i) tindakan kecemasan; (j) PPE dan peralatan menyelamat; (k) standard pendedahan hazard fizikal, biologi, kimia, psikologi; (l) pemantauan ergonomik dan kesihatan; (m) kemudahan kebajikan; (n) rekod; (o) JKK; (p) siasatan dan rayuan; (q) fi; (r) kompaun; (s) pegawai perubatan; (t) PKK; (ta) notifikasi pengurusan aktiviti; (tb) orang kompeten; (u) perkara lain yang perlu.","verbatim":["(2) Khususnya dan tanpa menjejaskan subseksyen (1), peraturan-peraturan itu boleh— keluasan makna","(a) mengawalselia atau melarang— (i) pengilangan, pembekalan atau penggunaan apa-apa loji; (ii) pengilangan, pembekalan, penyimpanan, pengangkutan atau penggunaan apa-apa bahan; dan (iii) penjalanan apa-apa proses atau penjalanan apa-apa pengendalian;","(b) menetapkan kehendak berkenaan dengan reka bentuk, pembinaan, pengawalan, penempatan, pemasangan, permulaan penggunaan, penelitian, kelayakan semula, pembaikan, penyenggaraan, pengubahan, penyesuaian, pembukaan, pengujian, penandaan atau pemeriksaan mana-mana loji;","(ba) menetapkan kehendak berkenaan dengan apa-apa loji bagi maksud skim pemeriksaan khas di bawah seksyen 27F;","(c) menetapkan kehendak berkenaan dengan penelitian, pengujian penganalisisan, pelabelan atau penandaan apa-apa bahan;","(d) menetapkan masa dan cara majikan atau orang-orang yang ditentukan lain yang dikehendaki meneliti, menguji, menganalisis, melabel menandakan atau membekalkan maklumat tentang apa-apa bahan;","(e) menetapkan kehendak supaya menahan diri daripada makan, minum atau merokok dalam mana-mana keadaan yang melibatkan risiko penyerapan apa-apa bahan atau risiko kecederaan atau keracunan yang berbangkit daripada penggunaan apa-apa bahan;","(f) menetapkan kehendak berkenaan dengan arahan, latihan dan penyeliaan orang-orang yang sedang bekerja;","(g) menetapkan prosedur bagi seseorang majikan untuk memberitahu apa-apa kemalangan, kejadian berbahaya, keracunan pekerjaan atau penyakit pekerjaan;","(h) menetapkan perkiraan yang hendaklah dibuat berkenaan dengan pengambilan apa-apa tindakan atau langkah berjaga-jaga untuk mengelakkan, atau sekiranya berlaku, apa-apa kemalangan atau kejadian berbahaya dan untuk meminimumkan risiko dan untuk mengurangkan kesannya;","(i) melarang atau menghendaki pengambilan apa-apa tindakan sekiranya berlaku apa-apa kemalangan atau kejadian berbahaya;","(j) menetapkan kehendak berkenaan dengan pengadaan dan penggunaan kelengkapan pelindung diri dan kelengkapan kemudahan pemantauan dan pengujian dan kelengkapan penyelamat dalam hal keadaan tertentu;","(k) menetapkan standard berhubungan dengan penggunaan bagi, termasuklah standard pendedahan kepada, apa-apa bahaya fizikal, biologi, kimia atau psikologi;","(l) mengawalselia dan menghendaki pengawasan oleh majikan atau penghuni keadaan di tempat kerja termasuklah keperluan ergonomik, fisiologi dan psikologi dan kesihatan pekerja mereka;","(m) memastikan pengadaan kemudahan kebajikan, keselamatan dan kesihatan yang memadai oleh majikan bagi orang-orang yang sedang bekerja;","(n) menghendaki majikan menyimpan dan rekod-rekod dan dokumen-dokumen lain; memelihara","(o) menetapkan komposisi, kuasa, fungsi dan prosedur jawatankuasa-jawatankuasa keselamatan dan kesihatan dan mengawalselia pemilihan atau pelantikan anggota jawatankuasa itu dan perkara-perkara berkaitan yang lain;","(p) menetapkan cara menjalankan siasatan di bawah seksyen 33 dan bagi mendengar rayuan di bawah seksyen 50;","(q) menetapkan fee yang kena dibayar atau boleh dikenakan bagi melakukan apa-apa perbuatan atau mengadakan apa-apa perkhidmatan bagi maksud Akta ini atau mana-mana peraturan yang dibuat di bawahnya;","(r) menetapkan kesalahan-kesalahan yang boleh dikompaun dan kaedah dan prosedur yang dikehendaki dipatuhi;","(s) menetapkan kehendak bagi mengguna-khidmat pegawai perubatan dan prosedur bagi pendaftaran pengawai perubatan itu;","(t) menetapkan kehendak bagi melantik pegawai keselamatan dan kesihatan, latihan yang diperlukan bagi pegawai keselamatan dan pendaftarannya; kesihatan dan prosedur bagi","(ta) menetapkan kehendak dan cara bagi pemberitahuan tentang pengusahaan, perancangan dan pengurusan reka bentuk apa-apa aktiviti di tempat kerja;","(tb) menetapkan masa apabila dan cara bagaimana orang kompeten dikehendaki untuk mengambil alih atau mengawal apa-apa loji, tempat kerja, proses, bahan dan aktiviti, dan apa-apa kehendak yang berhubungan dengannya;","(u) menetapkan apa-apa perkara lain yang pada hemat Menteri suai-manfaat atau perlu bagi menjalankan Akta ini dengan lebih baik."],"p":"XIV","ex":"Peraturan USECHH dibuat di bawah kuasa ini untuk mengawal pendedahan bahan kimia."},{"ref":"s.66(3)","sec":"66","title":"Peraturan-peraturan","gist":"Pelanggaran peraturan boleh dikenakan hingga RM500,000 atau 2 tahun atau kedua-duanya.","verbatim":["(3) Peraturan-peraturan yang dibuat di bawah Akta ini boleh menetapkan apa-apa perbuatan atau peninggalan yang melanggar peraturan-peraturan itu sebagai suatu kesalahan dan boleh menetapkan hukuman denda tidak melebihi lima ratus ribu ringgit atau pemenjaraan selama tempoh tidak melebihi dua tahun atau kedua-duanya bagi kesalahan itu."],"p":"XIV","ex":"Melanggar Peraturan Bising boleh didenda hingga RM500,000 atau dipenjara 2 tahun."},{"ref":"s.67(1)","sec":"67","title":"Kerahsiaan maklumat","gist":"[DIPINDA 2024] Tiada sesiapa boleh mendedahkan rahsia pengilangan atau perdagangan yang diketahui semasa bertugas, kecuali untuk tujuan Akta atau prosiding mahkamah.","verbatim":["(1) Kecuali bagi maksud Akta ini atau bagi maksud mana-mana prosiding sivil atau jenayah di bawah Akta ini atau mana-mana undang-undang bertulis lain, tiada seorang pun boleh mendedahkan apa-apa rahsia pengeluaran atau perdagangan yang boleh pada bila-bila masa sampai kepada pengetahuannya atau yang telah diperolehnya dalam penjalanan tugasnya di bawah Akta ini."],"p":"XV","ex":"Pegawai JKKP tidak boleh mendedahkan formula rahsia produk kilang yang diketahui semasa pemeriksaan."},{"ref":"s.67(2)","sec":"67","title":"Kerahsiaan maklumat","gist":"\"Rahsia pengilangan atau perdagangan\" = maklumat sangat sensitif tentang (a) proses pengilangan; (b) formulasi produk atau bahan mentah; (c) idea penduaan produk; (d) maklumat teknikal sistem operasi, yang diisytiharkan bertulis oleh penghuni/pemilik.","verbatim":["(2) Bagi maksud seksyen ini, “rahsia pengeluaran atau perdagangan” ertinya maklumat yang sangat sensitif yang berhubungan dengan—","(a) apa-apa proses pengeluaran;","(b) apa-apa keluaran, bahan mentah atau perumusan keluaran sampingan;","(c) apa-apa idea untuk penduaan atau pengklonan keluaran; atau","(d) apa-apa maklumat teknikal mengenai sistem pengendalian, dan bahawa maklumat itu telah diisytiharkan sebagai rahsia pengeluaran atau perdagangan secara bertulis oleh penghuni atau pemunya."],"p":"XV","ex":"Formula rahsia minuman yang diisytiharkan secara bertulis oleh pengilang ialah rahsia perdagangan."},{"ref":"s.67(3)","sec":"67","title":"Kerahsiaan maklumat","gist":"Penalti: hingga RM100,000 atau 2 tahun atau kedua-duanya.","verbatim":["(3) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"XV","ex":"Mendedahkan rahsia perdagangan boleh didenda hingga RM100,000 atau dipenjara 2 tahun."},{"ref":"s.67A(1)","sec":"67A","title":"Kuasa untuk mengecualikan","gist":"[BAHARU 2024] Menteri, atas syor KP, boleh mengecualikan mana-mana loji, bahan, proses, orang atau tempat kerja daripada Akta melalui perintah Warta.","verbatim":["(1) Menteri boleh, atas syor Ketua Pengarah, melalui perintah yang disiarkan dalam Warta, mengecualikan mana-mana loji, bahan, proses, orang atau tempat kerja, atau kelas orang atau kelas tempat kerja, daripada mana-mana peruntukan Akta ini atau perundangan subsidiarinya."],"p":"XV","ex":"Menteri mengecualikan loji eksperimen di universiti daripada keperluan PMA."},{"ref":"s.67A(2)","sec":"67A","title":"Kuasa untuk mengecualikan","gist":"Pengecualian boleh tertakluk kepada syarat.","verbatim":["(2) Pengecualian di bawah subseksyen (1) boleh tertakluk kepada apa-apa syarat yang difikirkan patut oleh Menteri."],"p":"XV","ex":"Pengecualian diberi dengan syarat loji itu diperiksa oleh jurutera bertauliah."},{"ref":"s.67A(3)","sec":"67A","title":"Kuasa untuk mengecualikan","gist":"Menteri boleh mengubah atau membatalkan pengecualian.","verbatim":["(3) Menteri boleh, atas syor Ketua Pengarah, melalui perintah yang disiarkan dalam Warta, mengubah atau membatalkan suatu pengecualian yang diberikan di bawah subseksyen (1)."],"p":"XV","ex":"Menteri membatalkan pengecualian selepas berlaku kemalangan."},{"ref":"s.67B","sec":"67B","title":"Kuasa untuk meminda Jadual","gist":"[BAHARU 2024] Menteri boleh meminda Jadual-Jadual melalui perintah Warta, kecuali Jadual Pertama.","verbatim":["Kecuali bagi Jadual Pertama, Menteri boleh, melalui perintah yang disiarkan dalam Warta, meminda Jadual-Jadual kepada Akta ini."],"p":"XV","ex":"Menteri menambah aktiviti baharu ke Jadual Kelima melalui perintah Warta."},{"ref":"Jadual Pertama","title":"Jadual Pertama","gist":"Di mana Akta TIDAK terpakai: pembantu rumah, angkatan tentera, kerja di atas kapal di bawah undang-undang perkapalan saudagar.","verbatim":["[Subseksyen 1(3)] Ketidakpakaian","1. Pengambilan kerja domestik berhubung dengan seseorang yang mengambil kerja orang lain, atau yang diambil kerja, sebagai pembantu rumah mengikut pengertian Akta Kerja 1955 [Akta 265]","2. Angkatan tentera","3. Pekerjaan atas kapal yang ditadbir oleh Ordinan Perkapalan Saudagar 1952 [Ord. No 70 Tahun 1952], Ordinan Perkapalan Saudagar 1960 (Sabah) [Ord. No. 11 Tahun 1960] atau Ordinan Perkapalan Saudagar 1960 (Sarawak) [Ord. No. 2 Tahun 1960]"],"p":"J","ex":"Kemalangan di atas kapal dagang yang diatur oleh Ordinan Perkapalan Saudagar tidak tertakluk kepada Akta 514."},{"ref":"Jadual Kedua","title":"Jadual Kedua","gist":"Peraturan Majlis: tempoh 3 tahun (maksimum 2 kali dilantik semula), peletakan jawatan dan pemecatan, hilang kelayakan, bermesyuarat sekurang-kurangnya sekali setiap 3 bulan, kuorum 11, undi pemutus Pengerusi, isytihar kepentingan.","verbatim":["(Seksyen 10)","1. Anggota Majlis hendaklah memegang jawatan bagi tempoh tiga tahun atau, selama apa-apa tempoh yang lebih singkat yang ditentukan oleh Menteri dan adalah layak untuk dilantik semula untuk tempoh maksimum dua penggal.","2. (1) Seseorang anggota Majlis boleh pada bila-bila masa— (a) meletakkan jawatannya daripada Majlis melalui notis bertulis kepada Menteri; atau (b) diberhentikan daripada Majlis oleh Menteri ketakupayaan kekal atau sebab memadai yang lain, disebabkan oleh dan apabila dia meletakkan jawatan atau diberhentikan sedemikian tempoh pelantikannya hendaklah disifatkan telah tamat. (2) Jika apa-apa soalan berbangkit tentang sama ada apa-apa ketakupayaan atau sebab wujud atau sama ada apa-apa ketakupayaan adalah sementara atau kekal atau apa-apa sebab adalah memadai, keputusan Menteri adalah muktamad.","3. (1) Orang-orang yang berikut tidak layak dilantik untuk menganggotai atau menjadi anggota Majlis: (a) seseorang yang didapati atau diisytiharkan tak sempurna akal; (b) seseorang yang bankrap; (c) seseorang yang telah, disabitkan atas apa-apa kesalahan yang melibatkan fraud, kecurangan atau keburukan akhlak, atau apa-apa kesalahan yang berhubungan dengan keselamatan dan kesihatan pekerjaan di bawah mana-mana undang-undang yang dibuat di bawahnya; atau (d) seseorang yang selainnya tak dapat atau tak upaya melaksanakan fungsi sebagai anggota Majlis. (2) Seseorang anggota Majlis yang dilantik di bawah subseksyen 9(1) hendaklah terhenti menjadi anggota— (a) jika dia tidak menghadiri tiga mesyuarat Majlis berturut-turut tanpa kebenaran bertulis Pengerusi; (b) jika dia hilang kelayakan di bawah subperenggan (1); atau (c) jika pelantikannya dibatalkan oleh Menteri.","4. (1) Menteri hendaklah memanggil mesyuarat pertama Majlis dan selepas itu Majlis hendaklah bermesyuarat tidak kurang daripada tiga bulan sekali di tempat yang ditetapkan Pengerusi. (2) Pengerusi hendaklah memanggil mesyuarat Majlis atas permintaan mana-mana dua orang anggota Majlis dan permintaan itu hendaklah secara bertulis dengan sebabnya. (3) Pada mana-mana mesyuarat Majlis Pengerusi hendaklah mempengerusikan, dan jika dia tidak hadir anggota-anggota hendaklah memilih seorang daripada kalangan mereka untuk mempengerusikan mesyuarat itu. (4) Kuorum Majlis hendaklah sebelas. (5) Jika mengenai apa-apa soalan yang dikehendaki diputuskan oleh Majlis terdapat persamaan undi, Pengerusi atau, dalam hal jika Pengerusi tidak hadir, anggota yang mempengerusikan mesyuarat, hendaklah mempunyai undi pemutus. (6) Tertakluk kepada subperenggan (3), (4) dan (5) Majlis hendaklah menentukan prosedurnya sendiri. (7) Majlis hendaklah memastikan supaya rekod yang sepatutnya mengenai prosidingnya disimpan.","4A. Majlis boleh mengundang mana-mana orang untuk menghadiri mana-mana mesyuarat Majlis bagi maksud menasihati Majlis terhadap apa-apa perkara yang dibincangkan tetapi orang itu hendaklah tidak layak untuk membuat undian dalam mesyuarat itu.","5. Maka hendaklah dibayar kepada anggota Majlis kerana menghadiri mesyuarat Majlis apa-apa elaun ditentukan oleh Menteri.","6. Anggota Majlis yang mempunyai kepentingan wang sama ada secara langsung atau tak langsung dalam apa-apa perkara yang dikehendaki dipertimbangkan oleh Majlis hendaklah mengisytiharkan sifat kepentingan itu pada tiap-tiap mesyuarat yang menimbangkan perkara itu.","7. Tiada anggota Majlis boleh menanggung apa-apa liabiliti persendirian bagi apa-apa kerugian atau kerosakan yang disebabkan oleh apa-apa perbuatan atau peninggalan dalam mentadbirkan hal-ehwal Majlis melainkan jika kerugian atau kerosakan itu disebabkan dengan sengaja atau melalui perbuatan melulu atau kecuaian lampau."],"p":"J","ex":"Ahli Majlis yang tidak hadir mesyuarat berturut-turut tanpa kebenaran boleh hilang keanggotaan."},{"ref":"Jadual Ketiga","title":"Jadual Ketiga","gist":"Pekerjaan yang melibatkan risiko khas kepada kesihatan: pendedahan kepada silika, asbestos, habuk kapas, plumbum, merkuri, arsenik, benzena, racun perosak dll.; tar, bitumen, minyak mineral, kromat; sinaran mengion; kerja dalam udara termampat.","verbatim":["(Perenggan 28(1)(d)) Pekerjaan yang Melibatkan Risiko Khusus kepada Kesihatan","1. Apa-apa pekerjaan yang melibatkan penggunaan atau pengendalian, atau pendedahan kepada, wasap, habuk atau wap silika, asbestos, habuk kapas mentah, plumbum, merkuri, arsenik, fosforus, karbon bisulphida, benzena, fosfat organik, wasap nitrus, kadmium, berilium atau racun makhluk perosak.","2. Apa-apa pekerjaan yang melibatkan penggunaan atau pengendalian, atau pendedahan kepada, tar, gegala, bitumen, minyak mineral termasuklah parafin, asid kromat, kromat atau bikromat ammonia, kalium, zink atau natrium.","3. Apa-apa pekerjaan yang melibatkan pendedahan kepada sinar-x, partikel mengion, radium atau bahan radioaktif lain atau bentuk-bentuk lain tenaga sinaran.","4. Apa-apa pekerjaan atau proses yang dijalankan dalam udara termampat."],"p":"J","ex":"Pekerja yang mengendalikan asbestos atau benzena memerlukan pengawasan kesihatan pekerjaan."},{"ref":"Jadual Keempat","title":"Jadual Keempat","gist":"[BAHARU 2024] Senarai 17 \"kecederaan tubuh yang serius\", cth. hilang penglihatan atau pendengaran, patah atau terkehel tulang, kudung, lecur melebihi 10% badan, kecederaan elektrik, pengsan akibat kecederaan kepala atau asfiksia, atau dimasukkan ke hospital lebih 24 jam.","verbatim":["[Subseksyen 3(1)] Kecederaan badan yang serius","1. Emaskulasi","2. Kehilangan penglihatan yang kekal salah satu mata","3. Kehilangan pendengaran yang kekal salah satu telinga","4. Kehilangan mana-mana anggota atau sendi","5. Kemusnahan atau kerosakan kekal kekuatan mana-mana anggota atau sendi","6. Kecacatan yang kekal pada kepala atau muka","7. Patah atau terkehel tulang","8. Amputasi lengan, tangan, jari, ibu jari, kaki, tapak kaki atau ibu jari kaki","9. Apa-apa kecederaan yang menghancurkan kepala atau torso yang menyebabkan kerosakan kepada otak atau organ dalaman di dada atau abdomen","10. Apa-apa kecederaan luka terbakar (termasuk kulit melecur/apa-apa kecederaan di kulit kepala) yang— (a) meliputi lebih 10% daripada jumlah keseluruhan kawasan permukaan badan; atau (b) menyebabkan kerosakan yang ketara pada mata, sistem pernafasan atau organ penting lain","11. Apa-apa tahap melecur yang memerlukan rawatan daripada pengamal perubatan yang berdaftar","12. Apa-apa kecederaan lain yang timbul daripada bekerja dalam ruang tertutup yang menyebabkan hipotermia atau penyakit yang disebabkan haba","13. Hilang kesedaran yang disebabkan oleh kecederaan kepala atau asphyxia (kekurangan oksigen)","14. Kecederaan elektrik","15. Hilang kesedaran atau sakit akut daripada penyerapan, penyedutan atau pengingesan apa-apa bahan yang memerlukan rawatan oleh pengamal perubatan berdaftar","16. Apa-apa hal tentang keadaan tidak sihat akut jika terdapat sebab untuk mempercayai bahawa hal ini ialah akibat daripada pendedahan kepada patogen terasing atau bahan yang dijangkiti","17. Apa-apa kecederaan atau luka terbakar lain yang berhubungan dengan kerja yang mengakibatkan orang yang tercedera dimasukkan ke dalam hospital dengan serta-merta selama lebih daripada 24 jam"],"p":"J","ex":"Pekerja yang patah kaki atau dimasukkan ke hospital lebih 24 jam mengalami kecederaan tubuh yang serius."},{"ref":"Jadual Kelima","title":"Jadual Kelima","gist":"[BAHARU 2024] Aktiviti yang hanya boleh dibuat oleh orang kompeten berdaftar: kerja ke atas loji, mengendalikan loji, pengawasan perubatan, CHRA, penilaian kualiti udara dalaman, pemantauan tempat kerja (kimia, bising, audiometri), latihan dan penilaian KKP.","verbatim":["[Perenggan 31B(1)(a)] Aktiviti","1. Untuk memasang siap, memasang, mendirikan, membuka, menguji, memeriksa, menyenggara, membaiki atau menservis apa-apa loji atau kelengkapan kawalan kejuruteraan","2. Untuk mengendalikan, menangani atau menjaga mana-mana loji","3. Untuk menjalankan pengawasan perubatan dan pemeriksaan kesihatan","4. Untuk menjalankan pentaksiran risiko kesihatan bagi apa-apa bahan kimia yang berbahaya kepada kesihatan","5. Untuk menjalankan pentaksiran kualiti udara dalaman","6. Untuk memantau atau menguji persekitaran kerja, loji atau tempat kerja termasuk pemantauan pendedahan kimia, pemantauan bunyi dan ujian audio metrik","7. Untuk menjalankan apa-apa latihan, pentaksiran atau penelitian bagi keselamatan dan kesihatan pekerjaan"],"p":"J","ex":"Hanya orang kompeten berdaftar boleh menjalankan CHRA, pemantauan bising atau ujian audiometri."}];

rtificate of Completion and Compliance","s":"M2 2.12","x":"Perakuan Siap dan Pematuhan yang dikeluarkan setelah bangunan siap mengikut pelan yang diluluskan.","e":"Bangunan baharu hanya boleh diduduki selepas CCC dikeluarkan."},{"g":"C–D","a":"CCTV","m":"Closed-Circuit Television","s":"M4 4.04","x":"Televisyen litar tertutup untuk pengawasan.","e":"CCTV di kawasan pemunggahan membantu menyiasat kemalangan forklift."},{"g":"C–D","a":"CDC","m":"Centers for Disease Control and Prevention (US)","s":"M3 3.02, 3.09, 3.14","x":"Pusat Kawalan dan Pencegahan Penyakit Amerika Syarikat.","e":"Panduan CDC tentang kawalan jangkitan dirujuk semasa wabak COVID-19."},{"g":"C–D","a":"CDM","m":"Construction (Design and Management) Regulations 2024","s":"M1 1.01, 1.11, M2","x":"Peraturan KKP (Pengurusan Reka Bentuk dan Pembinaan) 2024 di bawah Akta 514 yang menetapkan tugas pihak dalam projek pembinaan.","e":"Di bawah CDM, klien mesti melantik Pereka Bentuk Utama dan Kontraktor Utama."},{"g":"C–D","a":"CE","m":"Conformité Européenne (EU product marking)","s":"M4 4.05","x":"Tanda pematuhan produk dengan keperluan keselamatan Kesatuan Eropah.","e":"Topi keselamatan bertanda CE menunjukkan ia mematuhi piawai Eropah."},{"g":"C–D","a":"CEM","m":"Chemical Exposure Monitoring","s":"M3 3.13","x":"Pemantauan pendedahan kimia, iaitu persampelan udara di zon pernafasan pekerja.","e":"Pengamal higiene memakai pam persampelan pada pekerja untuk mengukur wap pelarut selama 8 jam."},{"g":"C–D","a":"CEP","m":"Continuous Education Programme","s":"M1 1.01, 1.04","x":"Program pendidikan berterusan untuk mengekalkan pendaftaran SHO dan orang kompeten.","e":"SHO mesti mengumpul mata CEP dengan menghadiri seminar setiap tahun untuk memperbaharui pendaftaran."},{"g":"C–D","a":"CF","m":"Certificate of Fitness (perakuan kelayakan)","s":"M1 1.01, 1.12, 1.13, 1.19, M2, Act 514","x":"Perakuan kelayakan (PMA) untuk loji berisiko seperti dandang, bekas tekanan dan mesin angkat.","e":"Kren menara mesti mempunyai CF achinery Act 1967","s":"M1 1.01, 1.13, Act 835 (full)","x":"Akta Kilang dan Jentera 1967 (Akta 139), dimansuhkan melalui Akta 835 mulai 1 Jun 2024.","e":"Keperluan perakuan kelayakan dandang kini dipindahkan daripada FMA ke Akta 514."},{"g":"E–H","a":"FMD","m":"Factories and Machinery Department (renamed DOSH in 1994)","s":"M3 3.05","x":"Jabatan Kilang dan Jentera, nama lama JKKP sebelum 1994.","e":"Pemeriksa FMD dahulu menguatkuasakan FMA 1967."},{"g":"E–H","a":"FMEA","m":"Failure Mode and Effects Analysis","s":"M4 4.02","x":"Analisis cara kegagalan dan kesannya untuk mengenal pasti bagaimana komponen boleh gagal.","e":"FMEA bagi pam menyenaraikan kegagalan seal dan kesannya terhadap kebocoran."},{"g":"E–H","a":"FR / FRC","m":"Flame-Resistant / Flame-Resistant Clothing","s":"M4 4.05","x":"Pakaian tahan nyala yang tidak terus terbakar apabila terkena api atau percikan arka.","e":"Juruelektrik yang bekerja pada panel bertenaga memakai FRC."},{"g":"E–H","a":"FW","m":"Fire Watch","s":"M2 2.11","x":"Pengawas api yang memerhati kerja panas dan bersedia memadamkan api.","e":"Semasa kerja kimpalan di dalam tangki, FW berjaga dengan alat pemadam api."},{"g":"E–H","a":"GC","m":"Gas Chromatography","s":"M3 3.13","x":"Kromatografi gas, kaedah memisahkan dan mengukur sebatian meruap.","e":"Wap pelarut dari tiub persampelan dianalisis dengan GC."},{"g":"E–H","a":"GHS","m":"Globally Harmonized System","s":"M1 1.08","x":"Sistem global untuk mengklasifikasi bahan kimia dan berkomunikasi tentang bahayanya melalui label dan SDS.","e":"Piktogram tengkorak dan tulang bersilang pada label GHS menandakan ketoksikan akut."},{"g":"E–H","a":"GIT","m":"Gastrointestinal Tract","s":"M3 3.04","x":"Saluran gastrousus, iaitu laluan pencernaan.","e":"Bahan kimia boleh masuk melalui GIT jika pekerja makan tanpa mencuci tangan."},{"g":"E–H","a":"GOFF","m":"Guidelines for Offshore Floating Facilities","s":"M1 1.15","x":"Garis panduan JKKP untuk kemudahan terapung luar pesisir.","e":"Kemudahan FPSO di n berfungsi semasa bekalan elektrik terputus."},{"g":"T–Z","a":"USECHH","m":"Use and Standards of Exposure of Chemicals Hazardous to Health","s":"M1 1.01, 1.07, 1.13, M3, M4","x":"Peraturan Penggunaan dan Standard Pendedahan Bahan Kimia Berbahaya kepada Kesihatan 2000.","e":"USECHH mewajibkan CHRA, pemantauan pendedahan dan pengawasan perubatan."},{"g":"T–Z","a":"USEPA","m":"US Environmental Protection Agency","s":"M3 3.13","x":"Agensi Perlindungan Alam Sekitar Amerika Syarikat.","e":"Kaedah persampelan USEPA digunakan untuk sebatian organik."},{"g":"T–Z","a":"UV","m":"Ultraviolet","s":"M2 2.12, M3 3.04, 3.17, 3.18, M4 4.05","x":"Sinaran ultraungu daripada matahari atau arka kimpalan.","e":"Pekerja binaan di luar perlu melindungi kulit daripada UV."},{"g":"T–Z","a":"VKT","m":"Vehicle Kilometres Travelled","s":"M1 1.17","x":"Jumlah kilometer kenderaan yang dilalui.","e":"Kadar kemalangan dikira per 100 juta VKT."},{"g":"T–Z","a":"VOSI","m":"Value of Serious (or Statistical) Injury","s":"M1 1.17","x":"Nilai kewangan bagi satu kecederaan serius.","e":"VOSI digunakan dalam analisis kos-manfaat langkah keselamatan jalan raya."},{"g":"T–Z","a":"VOSL","m":"Value of Statistical Life","s":"M1 1.17","x":"Nilai statistik bagi satu nyawa yang digunakan dalam analisis kos-manfaat.","e":"VOSL membantu menilai sama ada pembinaan pengadang jalan berbaloi."},{"g":"T–Z","a":"VR / AR","m":"Virtual Reality / Augmented Reality","s":"M4 4.04","x":"Realiti maya (VR) dan realiti terimbuh (AR) untuk latihan dan simulasi.","e":"Latihan pemadam api menggunakan VR membolehkan pekerja berlatih tanpa api sebenar."},{"g":"T–Z","a":"VWF","m":"Vibration-induced White Finger","s":"M3 3.18","x":"Jari putih akibat getaran, iaitu jari menjadi pucat kerana saluran darah rosak.","e":"Pengendali penukul pneumatik mengalami VWF apabila tangan sejuk."},{"g":"T–Z","a":"WBGT","m":"Wet Bulb Globe Temperature","s":"M3 3.18","x":"Suhu bola basah dan glob, indeks tekanan haba yang mengambil kira suhu, kelembapan, });

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function mkState(key) {
  return { key, seen: new Set(), groups: new Set(store.get(key + "-parts", [])), srcs: new Set(store.get(key + "-srcs", [])), deck: [], history: [], hpos: -1 };
}
const STATE = { akta: mkState("a514"), akr: mkState("akr") };

const S = () => STATE[mode];

const $ = id => document.getElementById(id);
const cardEl = $("card");

function pool() {
  const st = S();
  if (mode === "akta")
    return CARDS.filter(c => (st.groups.size === 0 || st.groups.has(c.p)) && (!onlyNew || c.isNew || c.isAmend));
  return ACRO.filter(c => (st.groups.size === 0 || st.groups.has(c.g)) && (st.srcs.size === 0 || [...st.srcs].some(x => c.src.has(x))));
}
function reshuffle() {
  const st = S();
  st.deck = pool().map(c => c.i);
  for (let i = st.deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [st.deck[i], st.deck[j]] = [st.deck[j], st.deck[i]]; }
}
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
function fmtVerb(paras) {
  return paras.map(p => {
    const t = esc(p);
    const m = t.match(/^(\(\d+[A-Z]?\)|\([a-z]{1,2}\)|\d+[A-Z]?\.)(\s|$)/);
    const ind = /^\([a-z]{1,2}\)/.test(t);
    const html = m ? `<b>${m[1]}</b>${t.slice(m[1].length)}` : t;
    return `<p${ind ? ' class="ind"' : ""}>${html}</p>`;
  }).join("");
}
function refHTML(c) {
  if (c.p === "J") return `<small>Jadual</small> ${esc(c.ref.split(" ")[1])}`;
  return `<small>s.</small>${esc(c.ref.slice(2))}`;
}
function srcHTML(s) {
  // split "M1 1.01, 1.03, M2 2.04, Act 514 (full)" into chips per source
  const chips = []; let cur = null;
  s.split(/,\s*/).forEach(tok => {
    const m = tok.match(/^(M\d(?:\s*[–-]\s*M\d)?|Acts?|All four Acts)\b\s*(.*)$/);
    if (m) { cur = { k: m[1], d: [m[2]].filter(Boolean) }; chips.push(cur); }
    else if (cur) cur.d.push(tok); else chips.push(cur = { k: tok, d: [] });
  });
  return chips.map(c => `<li>${esc(c.k)}${c.d.length ? ` <span>${esc(c.d.join(", "))}</span>` : ""}</li>`).join("");
}
function veil(key, label) { return `<button class="veil" data-r="${key}"><span>${label}</span></button>`; }

    document.documentElement.style.setProperty("--hue", hue);
    document.documentElement.style.setProperty("--hue-ink", ink);
    const full = /\(full\)/.test(c.s) ? '<span class="tag">Akta guna istilah penuh</span>' : "";
    const mods = [...c.src].filter(x => MOD[x]).sort().map(x => `${x} = ${MOD[x]}`).join(" · ");
    html = `
    <div class="top">
      <div class="toprow">
        <div class="part">Akronim SHO · ${esc(c.g)}</div>
      </div>
      <div class="ref acr${c.a.length > 10 ? " long" : ""}">${esc(c.a)}</div>
      <p class="title">Apakah maksud akronim ini?</p>
      <div class="tags">${full}</div>
    </div>
    <div class="body">
      <section class="cover${hideG ? " hidden-ans" : ""}">
        ${hideG ? veil("gist", "Ketuk untuk maksud") : ""}
        <p class="label">Maksud</p>
        <p class="gist">${esc(c.m)}</p>
      </section>
      <section class="cover${hideV ? " hidden-ans" : ""}">
        ${hideV ? veil("verb", "Ketuk untuk penerangan & contoh") : ""}
        <p class="label">Penerangan</p>
        <p class="expl">${esc(c.x)}</p>
        <p class="label ex">Contoh</p>
        <p class="example">${esc(c.e)}</p>
      </section>
      <section>
        <p class="label">Sumber</p>
        <ul class="src">${srcHTML(c.s)}</ul>
        ${mods ? `<p class="legend">${esc(mods)}</p>` : ""}
      </section>
    </div>`;
  }
  cardEl.innerHTML = html;
  cardEl.classList.remove("deal"); void cardEl.offsetWidth; cardEl.classList.add("deal");
  cardEl.querySelectorAll(".veil").forEach(v => v.onclick = () => { revealed[v.dataset.r] = true; render(); });
  st.seen.add(idx);
  updateStats();
}
function updateStats() {
  const st = S(), p = pool();
  $("stSeen").textContent = `${p.filter(c => st.seen.has(c.i)).length} / ${p.length} dilihat`;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1600); }

function go(i) {
  const st = S();
  revealed = { gist: false, verb: false };
  st.history = st.history.slice(0, st.hpos + 1); st.history.push(i); st.hpos = st.history.length - 1;
  render();
}
function draw() {
  const st = S();
  if (!st.deck.length) { reshuffle(); if (st.deck.length && st.history.length) toast("Dek dikocok semula 🎉"); }
  if (!st.deck.length) { st.history = []; st.hpos = -1; render(); return; }
  const b = $("draw"); b.classList.remove("roll"); void b.offsetWidth; b.classList.add("roll");
  go(st.deck.pop());
}
function step(d) {
  const st = S();
  if (d < 0 && st.hpos > 0) { st.hpos--; revealed = { gist: true, verb: true }; render(); return; }
  if (d > 0 && st.hpos < st.history.length - 1) { st.hpos++; revealed = { gist: true, verb: true }; render(); return; }
  if (d > 0) draw(); else toast("Ini kad pertama anda");
}
function chip(attr, val, on, label, dot, title) {
  return `<button class="fchip" ${attr}="${esc(val)}" aria-pressed="${on}"${title ? ` title="${esc(title)}"` : ""}>${dot ? `<span class="dot" style="background:${dot}"></span>` : ""}${esc(label)}</button>`;
}
function buildFilters() {
  const f = $("filters"), st = S();
  let h = chip("data-g", "*", st.groups.size === 0 && st.srcs.size === 0, "Semua");
  if (mode === "akta") {
    h += PARTS.map(([k, n]) => chip("data-g", k, st.groups.has(k), k === "J" ? "Jadual" : "Bhg " + k, HUES[k][0], n)).join("");
  } else {
    h += GROUPS.map(g => chip("data-g", g, st.groups.has(g), g, GHUES[g][0])).join("");
    h += '<span class="fsep" aria-hidden="true"></span>';
    h += SOURCES.map(([k, n]) => chip("data-s", k, st.srcs.has(k), k, null, n)).join("");
  }
  f.innerHTML = h;
  f.querySelectorAll(".fchip").forEach(b => b.onclick = () => {
    const g = b.dataset.g, s = b.dataset.s;
    if (g === "*") { st.groups.clear(); st.srcs.clear(); }
    else if (g) { st.groups.has(g) ? st.groups.delete(g) : st.groups.add(g); }
    else if (s) { st.srcs.has(s) ? st.srcs.delete(s) : st.srcs.add(s); }
    store.set(st.key + "-parts", [...st.groups]); store.set(st.key + "-srcs", [...st.srcs]);
    buildFilters(); reshuffle(); draw();
  });
}
function setTgl(id, v) { $(id).setAttribute("aria-pressed", v); }
function setMode(m) {
  mode = m; store.set("cc-mode", m);
  setTgl("deckAkta", m === "akta"); setTgl("deckAkr", m === "akr");
  $("deckName").textContent = m === "akta" ? "Akta 514" : "Akronim SHO";
  $("deckSub").textContent = m === "akta" ? "AKKP 1994 · cetakan semula 1 Jun 2024 · seksyen dipilih secara rawak" : "411 akronim daripada Akta 302, 514, 835, 872 dan Modul 1–4 · maksud, penerangan dan contoh";
  $("onlyNew").hidden = m !== "akta";
  $("jumpIn").placeholder = m === "akta" ? "cth. 18A" : "cth. HIRARC";
  revealed = { gist: false, verb: false };
  buildFilters();
  if (S().hpos < 0) { reshuffle(); draw(); } else render();
}

$("draw").onclick = draw;
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("deckAkta").onclick = () => setMode("akta");
$("deckAkr").onclick = () => setMode("akr");
$("quiz").onclick = () => { quiz = !quiz; store.set("a514-quiz", quiz); setTgl("quiz", quiz); revealed = { gist: false, verb: false }; render(); toast(quiz ? "Mod kuiz: hidup" : "Mod kuiz: mati"); };
$("onlyNew").onclick = () => { onlyNew = !onlyNew; setTgl("onlyNew", onlyNew); reshuffle(); draw(); };
$("jumpForm").addEventListener("submit", e => {
  e.preventDefault();
  const raw = $("jumpIn").value.trim(); if (!raw) return;
  let hit;
  if (mode === "akta") {
    const q = raw.replace(/^s(ek(syen)?)?\.?\s*/i, "").toUpperCase().replace(/\s+/g, "");
    hit = CARDS.find(c => c.ref.toUpperCase().replace(/\s/g, "") === "S." + q) || CARDS.find(c => c.sec && (c.sec.toUpperCase() === q || c.ref.toUpperCase().startsWith("S." + q + "(")))
      || CARDS.find(c => c.p === "J" && c.ref.toUpperCase().includes(q));
  } else {
    const q = raw.toUpperCase().replace(/[.\s-]/g, "");
    const norm = a => a.toUpperCase().replace(/[.\s-]/g, "");
    hit = ACRO.find(c => norm(c.a) === q) || ACRO.find(c => c.a.toUpperCase().split(/\s*\/\s*/).some(p => norm(p) === q)) || ACRO.find(c => norm(c.a).startsWith(q)) || ACRO.find(c => c.m.toUpperCase().includes(raw.toUpperCase()));
  }
  if (hit) { go(hit.i); revealed = { gist: true, verb: true }; render(); $("jumpIn").blur(); }
  else toast(`"${raw}" tiada dalam dek ini`);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); draw(); }
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key.toLowerCase() === "k") $("quiz").click();
  else if (e.key.toLowerCase() === "d") setMode(mode === "akta" ? "akr" : "akta");
});
let tx = null, ty = null;
cardEl.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cardEl.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
});

setTgl("quiz", quiz);
setMode(mode);
</script>
