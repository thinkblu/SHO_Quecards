entuh oleh Bahagian IV, V dan VI","gist":"Bahagian IV, V dan VI serta ICOP tidak (a) memberi hak menyaman secara sivil; (b) memberi pembelaan dalam tindakan sivil; atau (c) menjejaskan hak tuntutan sivil di bawah undang-undang lain.","verbatim":["Tiada apa-apa jua dalam Bahagian IV, V dan VI dan tataamalan industri yang relevan boleh ditafsirkan sebagai—","(a) memberikan hak tindakan dalam mana-mana prosiding sivil berkenaan dengan apa-apa pelanggaran, sama ada melalui perbuatan atau peninggalan, mana-mana peruntukan Bahagian itu;","(b) memberikan pembelaan terhadap sesuatu tindakan dalam mana-mana prosiding sivil atau selainnya yang menyentuh hal tindakan dalam mana-mana prosiding sivil; atau","(c) menyentuh takat, jika ada, sesuatu hak tindakan berbangkit atau prosiding sivil boleh diambil berkenaan dengan kemungkiran kewajipan-kewajipan yang dikenakan oleh perundangan lain berkaitan dengan keselamatan dan kesihatan."],"p":"XII"},{"ref":"s.60","sec":"60","title":"Beban membuktikan had apa yang praktik","gist":"Bagi kesalahan berkaitan kewajipan \"setakat yang praktik\", tertuduh yang mesti membuktikan bahawa tidak praktik untuk berbuat lebih daripada yang telah dibuat.","verbatim":["Dalam apa-apa prosiding bagi sesuatu kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya kerana tidak mematuhi kewajipan atau kehendak supaya berbuat sesuatu setakat yang praktik, atau supaya menggunakan cara praktik yang terbaik untuk membuat sesuatu, tertuduh hendaklah membuktikan bahawa tidaklah praktik untuk membuat lebih daripada yang telah sebenarnya dibuat untuk memenuhi kewajipan atau kehendak itu, atau bahawa tidak ada cara praktik yang lebih baik daripada yang telah sebenarnya digunakan untuk memenuhi kewajipan atau kehendak itu."],"p":"XII"},{"ref":"s.60A","sec":"60A","title":"Keterangan","gist":"[BAHARU 2024] Laporan, rekod atau daftar yang disimpan dan diperakui pegawai adalah keterangan prima facie.","verbatim":["Dalam mana-mana prosiding di bawah Akta ini atau perundangan subsidiarinya, semua laporan, rekod atau daftar dan apa-apa cabutan daripadanya yang disimpan dan diperakui oleh seseorang pegawai hendaklah menjadi keterangan prima facie mengenai fakta yang dinyatakan di dalamnya."],"p":"XII"},{"ref":"s.61","sec":"61","title":"Pendakwaan","gist":"Pendakwaan boleh dijalankan oleh pegawai KKP atau pegawai yang diberi kuasa KP, dengan izin bertulis Pendakwa Raya.","verbatim":["Pendakwaan berkenaan dengan kesalahan-kesalahan yang dilakukan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya boleh, dengan keizinan bertulis terlebih dahulu daripada Pendakwa Raya, dimulakan dan dijalankan oleh seseorang pegawai keselamatan dan kesihatan pekerjaan atau oleh seseorang pegawai yang khusus diberi kuasa secara bertulis oleh Ketua Pengarah tertakluk pada peruntukan Kanun Prosedur Jenayah."],"p":"XII"},{"ref":"s.62(1)","sec":"62","title":"Pengkompaunan kesalahan","gist":"Menteri boleh, melalui perintah Warta, menetapkan kesalahan yang boleh dikompaun.","verbatim":["(1) Menteri boleh melalui perintah dalam Warta, menetapkan mana-mana kesalahan di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya sebagai kesalahan yang boleh dikompaun."],"p":"XII"},{"ref":"s.62(2)","sec":"62","title":"Pengkompaunan kesalahan","gist":"KP boleh mengkompaun sebelum sabitan, hingga jumlah denda maksimum, hanya jika orang itu mengaku bersalah secara bertulis dan memintanya.","verbatim":["(2) Ketua Pengarah boleh pada bila-bila masa sebelum sabitan mengkompaun mana-mana kesalahan yang ditetapkan di bawah subseksyen (1) sebagai kesalahan yang boleh dikompaun dengan memungut daripada orang yang semunasabahnya disyaki telah melakukan kesalahan itu sejumlah wang yang tidak melebihi suatu amaun denda maksimum yang boleh dikenakan ke atas orang itu sekiranya dia disabitkan atas kesalahan itu: Dengan syarat bahawa Ketua Pengarah tidak boleh menjalankan kuasanya di bawah seksyen ini melainkan jika orang itu secara bertulis mengaku bahawa dia telah melakukan kesalahan itu dan meminta Ketua Pengarah memperlakukan kesalahan itu di bawah seksyen ini."],"p":"XII"},{"ref":"s.63(1)","sec":"63","title":"Jawatankuasa rayuan","gist":"Menteri melantik jawatankuasa rayuan untuk mendengar rayuan di bawah s.50.","verbatim":["(1) Menteri boleh melantik jawatankuasa-jawatankuasa rayuan bagi maksud menimbangkan apa-apa rayuan yang dibuat di bawah seksyen 50."],"p":"XIII"},{"ref":"s.63(2)","sec":"63","title":"Jawatankuasa rayuan","gist":"Anggota: Pengerusi (daripada ahli Majlis) dan 2 orang lain yang berpengalaman dalam perkara yang dirayu.","verbatim":["(2) Sesuatu jawatankuasa rayuan hendaklah terdiri daripada Pengerusi yang hendaklah dilantik oleh Menteri daripada kalangan anggota Majlis dan dua orang lain yang hendaklah dilantik oleh Menteri yang, pada pendapatnya, mempunyai pengalaman dan pengetahuan luas dalam perkara-perkara yang berhubungan dengan hal perkara rayuan itu."],"p":"XIII"},{"ref":"s.63(3)","sec":"63","title":"Jawatankuasa rayuan","gist":"Anggota boleh dibayar elaun.","verbatim":["(3) Tiap-tiap anggota sesuatu jawatankuasa rayuan boleh dibayar elaun pada kadar atau kadar-kadar yang ditentukan oleh Menteri."],"p":"XIII"},{"ref":"s.64(1)","sec":"64","title":"Kuasa jawatankuasa rayuan","gist":"Jawatankuasa boleh mengesahkan, membatalkan atau mengubah keputusan KP atau notis yang dikeluarkan KP.","verbatim":["(1) Sesuatu jawatankuasa rayuan boleh, selepas mendengar suatu rayuan mengesahkan, membatalkan atau mengubah sesuatu keputusan yang dibuat oleh Ketua Pengarah di bawah subseksyen 50(1), atau sesuatu notis perbaikan atau larangan yang dikeluarkan oleh Ketua Pengarah di bawah seksyen 48."],"p":"XIII"},{"ref":"s.64(2)","sec":"64","title":"Kuasa jawatankuasa rayuan","gist":"Jawatankuasa mesti memutuskan dan memaklumkan keputusan dengan segera.","verbatim":["(2) Sesuatu jawatankuasa rayuan hendaklah memutuskan dan memberitahu keputusannya dengan cepat kepada orang yang membuat rayuan itu."],"p":"XIII"},{"ref":"s.65","sec":"65","title":"Keputusan jawatankuasa rayuan","gist":"Keputusan jawatankuasa rayuan adalah muktamad dan tidak boleh dipersoalkan di mahkamah.","verbatim":["Keputusan sesuatu jawatankuasa rayuan adalah muktamad dan konklusif dan tidak boleh dipersoalkan dalam mana-mana mahkamah."],"p":"XIII"},{"ref":"s.66(1)","sec":"66","title":"Peraturan-peraturan","gist":"Menteri boleh membuat peraturan tentang keselamatan, kesihatan dan kebajikan orang yang bekerja.","verbatim":["(1) Menteri boleh membuat peraturan-peraturan bagi atau berkenaan dengan keselamatan, kesihatan dan kebajikan orang-orang semasa bekerja bagi mencapai tujuan-tujuan Akta ini."],"p":"XIV"},{"ref":"s.66(2)","sec":"66","title":"Peraturan-peraturan","gist":"[DIPINDA 2024] Antaranya: (a) mengawal atau melarang loji, bahan, proses atau operasi; (b) reka bentuk, pemasangan, pemeriksaan, pembaikan loji; (ba) skim pemeriksaan khas; (c)–(d) ujian dan pelabelan bahan; (e) larangan makan, minum, merokok berhampiran bahan; (f) latihan dan penyeliaan; (g) prosedur notifikasi kemalangan; (h)–(i) tindakan kecemasan; (j) PPE dan peralatan menyelamat; (k) standard pendedahan hazard fizikal, biologi, kimia, psikologi; (l) pemantauan ergonomik dan kesihatan; (m) kemudahan kebajikan; (n) rekod; (o) JKK; (p) siasatan dan rayuan; (q) fi; (r) kompaun; (s) pegawai perubatan; (t) PKK; (ta) notifikasi pengurusan aktiviti; (tb) orang kompeten; (u) perkara lain yang perlu.","verbatim":["(2) Khususnya dan tanpa menjejaskan subseksyen (1), peraturan-peraturan itu boleh— keluasan makna","(a) mengawalselia atau melarang— (i) pengilangan, pembekalan atau penggunaan apa-apa loji; (ii) pengilangan, pembekalan, penyimpanan, pengangkutan atau penggunaan apa-apa bahan; dan (iii) penjalanan apa-apa proses atau penjalanan apa-apa pengendalian;","(b) menetapkan kehendak berkenaan dengan reka bentuk, pembinaan, pengawalan, penempatan, pemasangan, permulaan penggunaan, penelitian, kelayakan semula, pembaikan, penyenggaraan, pengubahan, penyesuaian, pembukaan, pengujian, penandaan atau pemeriksaan mana-mana loji;","(ba) menetapkan kehendak berkenaan dengan apa-apa loji bagi maksud skim pemeriksaan khas di bawah seksyen 27F;","(c) menetapkan kehendak berkenaan dengan penelitian, pengujian penganalisisan, pelabelan atau penandaan apa-apa bahan;","(d) menetapkan masa dan cara majikan atau orang-orang yang ditentukan lain yang dikehendaki meneliti, menguji, menganalisis, melabel menandakan atau membekalkan maklumat tentang apa-apa bahan;","(e) menetapkan kehendak supaya menahan diri daripada makan, minum atau merokok dalam mana-mana keadaan yang melibatkan risiko penyerapan apa-apa bahan atau risiko kecederaan atau keracunan yang berbangkit daripada penggunaan apa-apa bahan;","(f) menetapkan kehendak berkenaan dengan arahan, latihan dan penyeliaan orang-orang yang sedang bekerja;","(g) menetapkan prosedur bagi seseorang majikan untuk memberitahu apa-apa kemalangan, kejadian berbahaya, keracunan pekerjaan atau penyakit pekerjaan;","(h) menetapkan perkiraan yang hendaklah dibuat berkenaan dengan pengambilan apa-apa tindakan atau langkah berjaga-jaga untuk mengelakkan, atau sekiranya berlaku, apa-apa kemalangan atau kejadian berbahaya dan untuk meminimumkan risiko dan untuk mengurangkan kesannya;","(i) melarang atau menghendaki pengambilan apa-apa tindakan sekiranya berlaku apa-apa kemalangan atau kejadian berbahaya;","(j) menetapkan kehendak berkenaan dengan pengadaan dan penggunaan kelengkapan pelindung diri dan kelengkapan kemudahan pemantauan dan pengujian dan kelengkapan penyelamat dalam hal keadaan tertentu;","(k) menetapkan standard berhubungan dengan penggunaan bagi, termasuklah standard pendedahan kepada, apa-apa bahaya fizikal, biologi, kimia atau psikologi;","(l) mengawalselia dan menghendaki pengawasan oleh majikan atau penghuni keadaan di tempat kerja termasuklah keperluan ergonomik, fisiologi dan psikologi dan kesihatan pekerja mereka;","(m) memastikan pengadaan kemudahan kebajikan, keselamatan dan kesihatan yang memadai oleh majikan bagi orang-orang yang sedang bekerja;","(n) menghendaki majikan menyimpan dan rekod-rekod dan dokumen-dokumen lain; memelihara","(o) menetapkan komposisi, kuasa, fungsi dan prosedur jawatankuasa-jawatankuasa keselamatan dan kesihatan dan mengawalselia pemilihan atau pelantikan anggota jawatankuasa itu dan perkara-perkara berkaitan yang lain;","(p) menetapkan cara menjalankan siasatan di bawah seksyen 33 dan bagi mendengar rayuan di bawah seksyen 50;","(q) menetapkan fee yang kena dibayar atau boleh dikenakan bagi melakukan apa-apa perbuatan atau mengadakan apa-apa perkhidmatan bagi maksud Akta ini atau mana-mana peraturan yang dibuat di bawahnya;","(r) menetapkan kesalahan-kesalahan yang boleh dikompaun dan kaedah dan prosedur yang dikehendaki dipatuhi;","(s) menetapkan kehendak bagi mengguna-khidmat pegawai perubatan dan prosedur bagi pendaftaran pengawai perubatan itu;","(t) menetapkan kehendak bagi melantik pegawai keselamatan dan kesihatan, latihan yang diperlukan bagi pegawai keselamatan dan pendaftarannya; kesihatan dan prosedur bagi","(ta) menetapkan kehendak dan cara bagi pemberitahuan tentang pengusahaan, perancangan dan pengurusan reka bentuk apa-apa aktiviti di tempat kerja;","(tb) menetapkan masa apabila dan cara bagaimana orang kompeten dikehendaki untuk mengambil alih atau mengawal apa-apa loji, tempat kerja, proses, bahan dan aktiviti, dan apa-apa kehendak yang berhubungan dengannya;","(u) menetapkan apa-apa perkara lain yang pada hemat Menteri suai-manfaat atau perlu bagi menjalankan Akta ini dengan lebih baik."],"p":"XIV"},{"ref":"s.66(3)","sec":"66","title":"Peraturan-peraturan","gist":"Pelanggaran peraturan boleh dikenakan hingga RM500,000 atau 2 tahun atau kedua-duanya.","verbatim":["(3) Peraturan-peraturan yang dibuat di bawah Akta ini boleh menetapkan apa-apa perbuatan atau peninggalan yang melanggar peraturan-peraturan itu sebagai suatu kesalahan dan boleh menetapkan hukuman denda tidak melebihi lima ratus ribu ringgit atau pemenjaraan selama tempoh tidak melebihi dua tahun atau kedua-duanya bagi kesalahan itu."],"p":"XIV"},{"ref":"s.67(1)","sec":"67","title":"Kerahsiaan maklumat","gist":"[DIPINDA 2024] Tiada sesiapa boleh mendedahkan rahsia pengilangan atau perdagangan yang diketahui semasa bertugas, kecuali untuk tujuan Akta atau prosiding mahkamah.","verbatim":["(1) Kecuali bagi maksud Akta ini atau bagi maksud mana-mana prosiding sivil atau jenayah di bawah Akta ini atau mana-mana undang-undang bertulis lain, tiada seorang pun boleh mendedahkan apa-apa rahsia pengeluaran atau perdagangan yang boleh pada bila-bila masa sampai kepada pengetahuannya atau yang telah diperolehnya dalam penjalanan tugasnya di bawah Akta ini."],"p":"XV"},{"ref":"s.67(2)","sec":"67","title":"Kerahsiaan maklumat","gist":"\"Rahsia pengilangan atau perdagangan\" = maklumat sangat sensitif tentang (a) proses pengilangan; (b) formulasi produk atau bahan mentah; (c) idea penduaan produk; (d) maklumat teknikal sistem operasi, yang diisytiharkan bertulis oleh penghuni/pemilik.","verbatim":["(2) Bagi maksud seksyen ini, “rahsia pengeluaran atau perdagangan” ertinya maklumat yang sangat sensitif yang berhubungan dengan—","(a) apa-apa proses pengeluaran;","(b) apa-apa keluaran, bahan mentah atau perumusan keluaran sampingan;","(c) apa-apa idea untuk penduaan atau pengklonan keluaran; atau","(d) apa-apa maklumat teknikal mengenai sistem pengendalian, dan bahawa maklumat itu telah diisytiharkan sebagai rahsia pengeluaran atau perdagangan secara bertulis oleh penghuni atau pemunya."],"p":"XV"},{"ref":"s.67(3)","sec":"67","title":"Kerahsiaan maklumat","gist":"Penalti: hingga RM100,000 atau 2 tahun atau kedua-duanya.","verbatim":["(3) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"XV"},{"ref":"s.67A(1)","sec":"67A","title":"Kuasa untuk mengecualikan","gist":"[BAHARU 2024] Menteri, atas syor KP, boleh mengecualikan mana-mana loji, bahan, proses, orang atau tempat kerja daripada Akta melalui perintah Warta.","verbatim":["(1) Menteri boleh, atas syor Ketua Pengarah, melalui perintah yang disiarkan dalam Warta, mengecualikan mana-mana loji, bahan, proses, orang atau tempat kerja, atau kelas orang atau kelas tempat kerja, daripada mana-mana peruntukan Akta ini atau perundangan subsidiarinya."],"p":"XV"},{"ref":"s.67A(2)","sec":"67A","title":"Kuasa untuk mengecualikan","gist":"Pengecualian boleh tertakluk kepada syarat.","verbatim":["(2) Pengecualian di bawah subseksyen (1) boleh tertakluk kepada apa-apa syarat yang difikirkan patut oleh Menteri."],"p":"XV"},{"ref":"s.67A(3)","sec":"67A","title":"Kuasa untuk mengecualikan","gist":"Menteri boleh mengubah atau membatalkan pengecualian.","verbatim":["(3) Menteri boleh, atas syor Ketua Pengarah, melalui perintah yang disiarkan dalam Warta, mengubah atau membatalkan suatu pengecualian yang diberikan di bawah subseksyen (1)."],"p":"XV"},{"ref":"s.67B","sec":"67B","title":"Kuasa untuk meminda Jadual","gist":"[BAHARU 2024] Menteri boleh meminda Jadual-Jadual melalui perintah Warta, kecuali Jadual Pertama.","verbatim":["Kecuali bagi Jadual Pertama, Menteri boleh, melalui perintah yang disiarkan dalam Warta, meminda Jadual-Jadual kepada Akta ini."],"p":"XV"},{"ref":"Jadual Pertama","title":"Jadual Pertama","gist":"Di mana Akta TIDAK terpakai: pembantu rumah, angkatan tentera, kerja di atas kapal di bawah undang-undang perkapalan saudagar.","verbatim":["[Subseksyen 1(3)] Ketidakpakaian","1. Pengambilan kerja domestik berhubung dengan seseorang yang mengambil kerja orang lain, atau yang diambil kerja, sebagai pembantu rumah mengikut pengertian Akta Kerja 1955 [Akta 265]","2. Angkatan tentera","3. Pekerjaan atas kapal yang ditadbir oleh Ordinan Perkapalan Saudagar 1952 [Ord. No 70 Tahun 1952], Ordinan Perkapalan Saudagar 1960 (Sabah) [Ord. No. 11 Tahun 1960] atau Ordinan Perkapalan Saudagar 1960 (Sarawak) [Ord. No. 2 Tahun 1960]"],"p":"J"},{"ref":"Jadual Kedua","title":"Jadual Kedua","gist":"Peraturan Majlis: tempoh 3 tahun (maksimum 2 kali dilantik semula), peletakan jawatan dan pemecatan, hilang kelayakan, bermesyuarat sekurang-kurangnya sekali setiap 3 bulan, kuorum 11, undi pemutus Pengerusi, isytihar kepentingan.","verbatim":["(Seksyen 10)","1. Anggota Majlis hendaklah memegang jawatan bagi tempoh tiga tahun atau, selama apa-apa tempoh yang lebih singkat yang ditentukan oleh Menteri dan adalah layak untuk dilantik semula untuk tempoh maksimum dua penggal.","2. (1) Seseorang anggota Majlis boleh pada bila-bila masa— (a) meletakkan jawatannya daripada Majlis melalui notis bertulis kepada Menteri; atau (b) diberhentikan daripada Majlis oleh Menteri ketakupayaan kekal atau sebab memadai yang lain, disebabkan oleh dan apabila dia meletakkan jawatan atau diberhentikan sedemikian tempoh pelantikannya hendaklah disifatkan telah tamat. (2) Jika apa-apa soalan berbangkit tentang sama ada apa-apa ketakupayaan atau sebab wujud atau sama ada apa-apa ketakupayaan adalah sementara atau kekal atau apa-apa sebab adalah memadai, keputusan Menteri adalah muktamad.","3. (1) Orang-orang yang berikut tidak layak dilantik untuk menganggotai atau menjadi anggota Majlis: (a) seseorang yang didapati atau diisytiharkan tak sempurna akal; (b) seseorang yang bankrap; (c) seseorang yang telah, disabitkan atas apa-apa kesalahan yang melibatkan fraud, kecurangan atau keburukan akhlak, atau apa-apa kesalahan yang berhubungan dengan keselamatan dan kesihatan pekerjaan di bawah mana-mana undang-undang yang dibuat di bawahnya; atau (d) seseorang yang selainnya tak dapat atau tak upaya melaksanakan fungsi sebagai anggota Majlis. (2) Seseorang anggota Majlis yang dilantik di bawah subseksyen 9(1) hendaklah terhenti menjadi anggota— (a) jika dia tidak menghadiri tiga mesyuarat Majlis berturut-turut tanpa kebenaran bertulis Pengerusi; (b) jika dia hilang kelayakan di bawah subperenggan (1); atau (c) jika pelantikannya dibatalkan oleh Menteri.","4. (1) Menteri hendaklah memanggil mesyuarat pertama Majlis dan selepas itu Majlis hendaklah bermesyuarat tidak kurang daripada tiga bulan sekali di tempat yang ditetapkan Pengerusi. (2) Pengerusi hendaklah memanggil mesyuarat Majlis atas permintaan mana-mana dua orang anggota Majlis dan permintaan itu hendaklah secara bertulis dengan sebabnya. (3) Pada mana-mana mesyuarat Majlis Pengerusi hendaklah mempengerusikan, dan jika dia tidak hadir anggota-anggota hendaklah memilih seorang daripada kalangan mereka untuk mempengerusikan mesyuarat itu. (4) Kuorum Majlis hendaklah sebelas. (5) Jika mengenai apa-apa soalan yang dikehendaki diputuskan oleh Majlis terdapat persamaan undi, Pengerusi atau, dalam hal jika Pengerusi tidak hadir, anggota yang mempengerusikan mesyuarat, hendaklah mempunyai undi pemutus. (6) Tertakluk kepada subperenggan (3), (4) dan (5) Majlis hendaklah menentukan prosedurnya sendiri. (7) Majlis hendaklah memastikan supaya rekod yang sepatutnya mengenai prosidingnya disimpan.","4A. Majlis boleh mengundang mana-mana orang untuk menghadiri mana-mana mesyuarat Majlis bagi maksud menasihati Majlis terhadap apa-apa perkara yang dibincangkan tetapi orang itu hendaklah tidak layak untuk membuat undian dalam mesyuarat itu.","5. Maka hendaklah dibayar kepada anggota Majlis kerana menghadiri mesyuarat Majlis apa-apa elaun ditentukan oleh Menteri.","6. Anggota Majlis yang mempunyai kepentingan wang sama ada secara langsung atau tak langsung dalam apa-apa perkara yang dikehendaki dipertimbangkan oleh Majlis hendaklah mengisytiharkan sifat kepentingan itu pada tiap-tiap mesyuarat yang menimbangkan perkara itu.","7. Tiada anggota Majlis boleh menanggung apa-apa liabiliti persendirian bagi apa-apa kerugian atau kerosakan yang disebabkan oleh apa-apa perbuatan atau peninggalan dalam mentadbirkan hal-ehwal Majlis melainkan jika kerugian atau kerosakan itu disebabkan dengan sengaja atau melalui perbuatan melulu atau kecuaian lampau."],"p":"J"},{"ref":"Jadual Ketiga","title":"Jadual Ketiga","gist":"Pekerjaan yang melibatkan risiko khas kepada kesihatan: pendedahan kepada silika, asbestos, habuk kapas, plumbum, merkuri, arsenik, benzena, racun perosak dll.; tar, bitumen, minyak mineral, kromat; sinaran mengion; kerja dalam udara termampat.","verbatim":["(Perenggan 28(1)(d)) Pekerjaan yang Melibatkan Risiko Khusus kepada Kesihatan","1. Apa-apa pekerjaan yang melibatkan penggunaan atau pengendalian, atau pendedahan kepada, wasap, habuk atau wap silika, asbestos, habuk kapas mentah, plumbum, merkuri, arsenik, fosforus, karbon bisulphida, benzena, fosfat organik, wasap nitrus, kadmium, berilium atau racun makhluk perosak.","2. Apa-apa pekerjaan yang melibatkan penggunaan atau pengendalian, atau pendedahan kepada, tar, gegala, bitumen, minyak mineral termasuklah parafin, asid kromat, kromat atau bikromat ammonia, kalium, zink atau natrium.","3. Apa-apa pekerjaan yang melibatkan pendedahan kepada sinar-x, partikel mengion, radium atau bahan radioaktif lain atau bentuk-bentuk lain tenaga sinaran.","4. Apa-apa pekerjaan atau proses yang dijalankan dalam udara termampat."],"p":"J"},{"ref":"Jadual Keempat","title":"Jadual Keempat","gist":"[BAHARU 2024] Senarai 17 \"kecederaan tubuh yang serius\", cth. hilang penglihatan atau pendengaran, patah atau terkehel tulang, kudung, lecur melebihi 10% badan, kecederaan elektrik, pengsan akibat kecederaan kepala atau asfiksia, atau dimasukkan ke hospital lebih 24 jam.","verbatim":["[Subseksyen 3(1)] Kecederaan badan yang serius","1. Emaskulasi","2. Kehilangan penglihatan yang kekal salah satu mata","3. Kehilangan pendengaran yang kekal salah satu telinga","4. Kehilangan mana-mana anggota atau sendi","5. Kemusnahan atau kerosakan kekal kekuatan mana-mana anggota atau sendi","6. Kecacatan yang kekal pada kepala atau muka","7. Patah atau terkehel tulang","8. Amputasi lengan, tangan, jari, ibu jari, kaki, tapak kaki atau ibu jari kaki","9. Apa-apa kecederaan yang menghancurkan kepala atau torso yang menyebabkan kerosakan kepada otak atau organ dalaman di dada atau abdomen","10. Apa-apa kecederaan luka terbakar (termasuk kulit melecur/apa-apa kecederaan di kulit kepala) yang— (a) meliputi lebih 10% daripada jumlah keseluruhan kawasan permukaan badan; atau (b) menyebabkan kerosakan yang ketara pada mata, sistem pernafasan atau organ penting lain","11. Apa-apa tahap melecur yang memerlukan rawatan daripada pengamal perubatan yang berdaftar","12. Apa-apa kecederaan lain yang timbul daripada bekerja dalam ruang tertutup yang menyebabkan hipotermia atau penyakit yang disebabkan haba","13. Hilang kesedaran yang disebabkan oleh kecederaan kepala atau asphyxia (kekurangan oksigen)","14. Kecederaan elektrik","15. Hilang kesedaran atau sakit akut daripada penyerapan, penyedutan atau pengingesan apa-apa bahan yang memerlukan rawatan oleh pengamal perubatan berdaftar","16. Apa-apa hal tentang keadaan tidak sihat akut jika terdapat sebab untuk mempercayai bahawa hal ini ialah akibat daripada pendedahan kepada patogen terasing atau bahan yang dijangkiti","17. Apa-apa kecederaan atau luka terbakar lain yang berhubungan dengan kerja yang mengakibatkan orang yang tercedera dimasukkan ke dalam hospital dengan serta-merta selama lebih daripada 24 jam"],"p":"J"},{"ref":"Jadual Kelima","title":"Jadual Kelima","gist":"[BAHARU 2024] Aktiviti yang hanya boleh dibuat oleh orang kompeten berdaftar: kerja ke atas loji, mengendalikan loji, pengawasan perubatan, CHRA, penilaian kualiti udara dalaman, pemantauan tempat kerja (kimia, bising, audiometri), latihan dan penilaian KKP.","verbatim":["[Perenggan 31B(1)(a)] Aktiviti","1. Untuk memasang siap, memasang, mendirikan, membuka, menguji, memeriksa, menyenggara, membaiki atau menservis apa-apa loji atau kelengkapan kawalan kejuruteraan","2. Untuk mengendalikan, menangani atau menjaga mana-mana loji","3. Untuk menjalankan pengawasan perubatan dan pemeriksaan kesihatan","4. Untuk menjalankan pentaksiran risiko kesihatan bagi apa-apa bahan kimia yang berbahaya kepada kesihatan","5. Untuk menjalankan pentaksiran kualiti udara dalaman","6. Untuk memantau atau menguji persekitaran kerja, loji atau tempat kerja termasuk pemantauan pendedahan kimia, pemantauan bunyi dan ujian audio metrik","7. Untuk menjalankan apa-apa latihan, pentaksiran atau penelitian bagi keselamatan dan kesihatan pekerjaan"],"p":"J"}];

function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

    h += GROUPS.map(g => chip("data-g", g, st.groups.has(g), g, GHUES[g][0])).join("");
    h += '<span class="fsep" aria-hidden="true"></span>';
    h += SOURCES.map(([k, n]) => chip("data-s", k, st.srcs.has(k), k, null, n)).join("");
  }
  f.innerHTML = h;
  f.querySelectorAll(".fchip").forEach(b => b.onclick = () => {
    const g = b.dataset.g, s = b.dataset.s;
    if (g === "*") { st.groups.clear(); st.srcs.clear(); }
    else if (g) { st.groups.has(g) ? st.groups.delete(g) : st.groups.add(g); }
    else if (s) { st.srcs.has(s) ? st.srcs.delete(s) : st.srcs.add(s); }
    store.set(st.key + "-parts", [...st.groups]); store.set(st.key + "-srcs", [...st.srcs]);
    buildFilters(); reshuffle(); draw();
  });
}
function setTgl(id, v) { $(id).setAttribute("aria-pressed", v); }
function setMode(m) {
  mode = m; store.set("cc-mode", m);
  setTgl("deckAkta", m === "akta"); setTgl("deckAkr", m === "akr");
  $("deckName").textContent = m === "akta" ? "Akta 514" : "Akronim SHO";
  $("deckSub").textContent = m === "akta" ? "AKKP 1994 · cetakan semula 1 Jun 2024 · seksyen dipilih secara rawak" : "411 akronim daripada Akta 302, 514, 835, 872 dan Modul 1–4 · dipilih secara rawak";
  $("onlyNew").hidden = m !== "akta";
  $("jumpIn").placeholder = m === "akta" ? "cth. 18A" : "cth. HIRARC";
  revealed = { gist: false, verb: false };
  buildFilters();
  if (S().hpos < 0) { reshuffle(); draw(); } else render();
}

$("draw").onclick = draw;
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("deckAkta").onclick = () => setMode("akta");
$("deckAkr").onclick = () => setMode("akr");
$("quiz").onclick = () => { quiz = !quiz; store.set("a514-quiz", quiz); setTgl("quiz", quiz); revealed = { gist: false, verb: false }; render(); toast(quiz ? "Mod kuiz: hidup" : "Mod kuiz: mati"); };
$("onlyNew").onclick = () => { onlyNew = !onlyNew; setTgl("onlyNew", onlyNew); reshuffle(); draw(); };
$("onlyTodo").onclick = () => { onlyTodo = !onlyTodo; setTgl("onlyTodo", onlyTodo); reshuffle(); draw(); };
$("jumpForm").addEventListener("submit", e => {
  e.preventDefault();
  const raw = $("jumpIn").value.trim(); if (!raw) return;
  let hit;
  if (mode === "akta") {
    const q = raw.replace(/^s(ek(syen)?)?\.?\s*/i, "").toUpperCase().replace(/\s+/g, "");
    hit = CARDS.find(c => c.ref.toUpperCase().replace(/\s/g, "") === "S." + q) || CARDS.find(c => c.sec && (c.sec.toUpperCase() === q || c.ref.toUpperCase().startsWith("S." + q + "(")))
      || CARDS.find(c => c.p === "J" && c.ref.toUpperCase().includes(q));
  } else {
    const q = raw.toUpperCase().replace(/[.\s-]/g, "");
    const norm = a => a.toUpperCase().replace(/[.\s-]/g, "");
    hit = ACRO.find(c => norm(c.a) === q) || ACRO.find(c => c.a.toUpperCase().split(/\s*\/\s*/).some(p => norm(p) === q)) || ACRO.find(c => norm(c.a).startsWith(q)) || ACRO.find(c => c.m.toUpperCase().includes(raw.toUpperCase()));
  }
  if (hit) { go(hit.i); revealed = { gist: true, verb: true }; render(); $("jumpIn").blur(); }
  else toast(`"${raw}" tiada dalam dek ini`);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); draw(); }
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key.toLowerCase() === "k") $("quiz").click();
  else if (e.key.toLowerCase() === "s") toggleStar();
  else if (e.key.toLowerCase() === "d") setMode(mode === "akta" ? "akr" : "akta");
});
let tx = null, ty = null;
cardEl.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cardEl.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
});

setTgl("quiz", quiz);
setMode(mode);
</script>
