<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHO Cue Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one big cue card centre-stage, coloured by Bahagian using safety-sign hues; controls dock below. */
:root {
  --bg: #F3F1FA;
  --bg-dot: #DCD7EE;
  --ink: #1C1830;
  --ink-soft: #5B5575;
  --card: #FFFFFF;
  --card-edge: #1C1830;
  --panel: #F6F4FC;
  --verb: #FFFBEF;
  --verb-edge: #E9DFC0;
  --chip: #FFFFFF;
  --focus: #0057B8;
  --hue: #FFC72C;
  --hue-ink: #1C1830;
  --new: #009A44;
  --amend: #E4312B;
  --f-display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-law: "Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15121F; --bg-dot: #2A2540; --ink: #F2EFFA; --ink-soft: #ABA4C6; --card: #221D33; --card-edge: #0B0912;
  --panel: #2A2440; --verb: #2B2618; --verb-edge: #4A4026; --chip: #2A2440; --focus: #7FB2FF; --new: #3DD17C; --amend: #FF6B60;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15121F; --bg-dot: #2A2540; --ink: #F2EFFA; --ink-soft: #ABA4C6; --card: #221D33; --card-edge: #0B0912;
  --panel: #2A2440; --verb: #2B2618; --verb-edge: #4A4026; --chip: #2A2440; --focus: #7FB2FF; --new: #3DD17C; --amend: #FF6B60;
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.2px, transparent 1.3px);
  background-size: 18px 18px;
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.sign { width: 46px; height: 46px; flex: none; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.4rem, 4.5vw, 2rem); line-height: 1; margin: 0; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-size: .9rem; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { background: var(--chip); border: 2px solid var(--card-edge); border-radius: 999px; padding: 4px 12px; font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: 2px 2px 0 var(--card-edge); }

/* filters */
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.fchip { flex: none; font: 700 .8rem/1 var(--f-body); border: 2px solid var(--card-edge); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.fchip .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--card-edge); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.fchip:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* card */
.stage { position: relative; perspective: 1400px; }
.card {
  background: var(--card); border: 3px solid var(--card-edge); border-radius: 22px;
  box-shadow: 7px 7px 0 var(--card-edge); overflow: hidden; position: relative;
  transform-origin: 50% 100%;
}
.card.deal { animation: deal .45s cubic-bezier(.2,.9,.25,1.25); }
@keyframes deal { from { transform: translateY(26px) rotate(-3deg) scale(.96); opacity: .3; } to { transform: none; opacity: 1; } }
.card.out-l { animation: outl .22s ease-in forwards; }
.card.out-r { animation: outr .22s ease-in forwards; }
@keyframes outl { to { transform: translateX(-60px) rotate(-6deg); opacity: 0; } }
@keyframes outr { to { transform: translateX(60px) rotate(6deg); opacity: 0; } }

.top { background: var(--hue); color: var(--hue-ink); padding: 18px 22px 16px; position: relative; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
  background: repeating-linear-gradient(-45deg, var(--hue-ink) 0 10px, transparent 10px 20px); opacity: .9; }
.toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.part { font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.ref { font-family: var(--f-display); font-size: clamp(2.6rem, 11vw, 4.4rem); line-height: .95; margin: 8px 0 6px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.ref small { font-size: .42em; letter-spacing: 0; opacity: .8; margin-right: .1em; }
.title { font-weight: 700; font-size: 1.05rem; margin: 0 0 12px; text-wrap: balance; max-width: 40ch; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-weight: 700; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 2px solid var(--hue-ink); background: rgba(255,255,255,.88); color: #1C1830; }
.star { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--hue-ink); background: rgba(255,255,255,.35); color: var(--hue-ink); cursor: pointer; display: grid; place-items: center; font-size: 1.35rem; line-height: 1; transition: transform .15s; }
.star[aria-pressed="true"] { background: var(--hue-ink); color: var(--hue); transform: rotate(-12deg) scale(1.06); }

.body { padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 18px; }
.label { font-weight: 700; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.label::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--hue); border: 2px solid var(--card-edge); }
.gist { font-size: 1.22rem; line-height: 1.45; font-weight: 700; margin: 0; max-width: 62ch; }
.verb { background: var(--verb); border: 2px dashed var(--verb-edge); border-radius: 14px; padding: 14px 16px; font-family: var(--f-law); font-size: 1rem; line-height: 1.62; max-height: 46vh; overflow-y: auto; }
.verb p { margin: 0 0 .6em; max-width: 68ch; }
.verb p:last-child { margin-bottom: 0; }
.verb p.ind { padding-left: 1.4em; }
.verb b { font-weight: 600; color: var(--ink); }

.cover { position: relative; }
.veil { position: absolute; inset: -4px; border-radius: 14px; border: 2px solid var(--card-edge);
  background: repeating-linear-gradient(45deg, var(--panel) 0 14px, var(--bg) 14px 28px);
  display: grid; place-items: center; cursor: pointer; font: 700 .95rem var(--f-body); color: var(--ink); z-index: 2; }
.veil span { background: var(--card); border: 2px solid var(--card-edge); border-radius: 999px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--card-edge); }
.cover.hidden-ans > :not(.veil) { visibility: hidden; }
.cover.hidden-ans { min-height: 64px; }

/* dock */
.dock { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.btn { font: 700 1rem var(--f-body); border: 3px solid var(--card-edge); background: var(--card); color: var(--ink); border-radius: 16px; padding: 12px 16px; cursor: pointer; box-shadow: 4px 4px 0 var(--card-edge); transition: transform .08s, box-shadow .08s; min-height: 52px; }
.btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--card-edge); }
.btn.big { background: var(--hue); color: var(--hue-ink); font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; letter-spacing: .02em; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.big svg { width: 26px; height: 26px; }
.btn.big.roll svg { animation: roll .5s ease-out; }
@keyframes roll { from { transform: rotate(-360deg) scale(.6); } to { transform: none; } }

.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.tgl { font: 700 .85rem var(--f-body); border: 2px solid var(--card-edge); background: var(--chip); color: var(--ink); border-radius: 12px; padding: 8px 12px; cursor: pointer; }
.tgl[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.jump { display: flex; gap: 6px; align-items: center; }
.jump label { font-weight: 700; font-size: .85rem; }
.jump input { width: 96px; font: 700 .95rem var(--f-body); padding: 8px 10px; border: 2px solid var(--card-edge); border-radius: 12px; background: var(--chip); color: var(--ink); }
.hint { color: var(--ink-soft); font-size: .8rem; margin: 0; text-align: center; }
.empty { padding: 40px 22px; text-align: center; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; }
.toast.on { opacity: 1; transform: translateX(-50%); }

@media (max-width: 480px) {
  .top { padding: 16px 16px 16px; }
  .body { padding: 18px 16px 20px; }
  .gist { font-size: 1.08rem; }
  .btn { padding: 10px 12px; }
}
@media (prefers-reduced-motion: reduce) { .card.deal, .card.out-l, .card.out-r, .btn.big.roll svg { animation: none; } }

/* deck switch */
.decks { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 3px solid var(--card-edge); border-radius: 16px; overflow: hidden; box-shadow: 4px 4px 0 var(--card-edge); background: var(--chip); }
.deckbtn { font: 700 .95rem/1.2 var(--f-body); border: 0; background: transparent; color: var(--ink); padding: 11px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.deckbtn + .deckbtn { border-left: 3px solid var(--card-edge); }
.deckbtn small { font-weight: 400; font-size: .78rem; color: var(--ink-soft); }
.deckbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.deckbtn[aria-pressed="true"] small { color: var(--bg); opacity: .8; }
.fsep { flex: none; width: 2px; background: var(--card-edge); opacity: .3; margin: 4px 4px; border-radius: 2px; }
.ref.acr { font-size: clamp(2.2rem, 10vw, 4rem); }
.ref.acr.long { font-size: clamp(1.5rem, 6.5vw, 2.6rem); line-height: 1.05; }
.src { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.src li { font-size: .85rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 2px solid var(--card-edge); background: var(--chip); }
.src li span { font-weight: 400; color: var(--ink-soft); }
.legend { margin: 6px 0 0; font-size: .82rem; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="sign" viewBox="0 0 46 46" aria-hidden="true"><path d="M23 3 44 41H2Z" fill="#FFC72C" stroke="var(--card-edge)" stroke-width="3" stroke-linejoin="round"/><text x="23" y="36" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-size="12" fill="#1C1830">SHO</text></svg>
      <div>
        <h1>Cue Cards <span id="deckName">Akta 514</span></h1>
        <p class="sub" id="deckSub">AKKP 1994 · cetakan semula 1 Jun 2024 · seksyen dipilih secara rawak</p>
      </div>
    </div>
    <div class="stats">
      <span class="stat" id="stSeen">0 / 0 dilihat</span>
      <span class="stat" id="stStar">★ 0 hafal</span>
    </div>
  </header>

  <div class="decks" role="group" aria-label="Pilih dek">
    <button class="deckbtn" id="deckAkta" data-m="akta" aria-pressed="true">Akta 514<small>264 kad seksyen</small></button>
    <button class="deckbtn" id="deckAkr" data-m="akr" aria-pressed="false">Akronim SHO<small>411 kad akronim</small></button>
  </div>

  <div class="filters" id="filters" role="group" aria-label="Tapis kad"></div>

  <div class="stage"><article class="card" id="card" aria-live="polite"></article></div>

  <div class="dock">
    <button class="btn" id="prev" aria-label="Kad sebelum">←</button>
    <button class="btn big" id="draw"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="2" width="22" height="22" rx="5" fill="var(--card)" stroke="currentColor" stroke-width="2.5"/><circle cx="8" cy="8" r="2" fill="currentColor"/><circle cx="18" cy="8" r="2" fill="currentColor"/><circle cx="13" cy="13" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/><circle cx="18" cy="18" r="2" fill="currentColor"/></svg>Cabut kad!</button>
    <button class="btn" id="next" aria-label="Kad seterusnya">→</button>
  </div>

  <div class="tools">
    <div class="toggles">
      <button class="tgl" id="quiz" aria-pressed="false">🙈 Mod kuiz</button>
      <button class="tgl" id="onlyNew" aria-pressed="false">2024 sahaja</button>
      <button class="tgl" id="onlyTodo" aria-pressed="false">Belum hafal</button>
    </div>
    <form class="jump" id="jumpForm">
      <label for="jumpIn">Lompat ke</label>
      <input id="jumpIn" placeholder="cth. 18A" autocomplete="off">
    </form>
  </div>
  <p class="hint">Papan kekunci: Space = cabut · ← → = undur/maju · K = kuiz · S = hafal · D = tukar dek. Leret kad di telefon.</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const PARTS = [["I","Permulaan"],["II","Pelantikan Pegawai, Badan Pemeriksa Bebas & Orang Berlesen"],["III","Majlis Negara KKP"],["IV","Kewajipan Am Majikan, Orang Bekerja Sendiri & Prinsipal"],["V","Kewajipan Am Pereka Bentuk, Pengilang & Pembekal"],["VI","Kewajipan Am & Hak Pekerja"],["VIA","Notis Tempat Kerja, Pemasangan & Pemeriksaan Loji"],["VII","Organisasi Keselamatan & Kesihatan"],["VIIA","Orang Kompeten & Penyedia Latihan Berdaftar"],["VIII","Pemberitahuan Kemalangan & Siasatan"],["IX","Larangan Penggunaan Loji atau Bahan"],["X","Tataamalan Industri"],["XI","Penguatkuasaan & Penyiasatan"],["XII","Liabiliti bagi Kesalahan"],["XIII","Rayuan"],["XIV","Peraturan-Peraturan"],["XV","Pelbagai"],["J","Jadual-Jadual"]];
const CARDS = [{"ref":"s.1(1)","sec":"1","title":"Tajuk ringkas dan pemakaian","gist":"Nama Akta: Akta Keselamatan dan Kesihatan Pekerjaan 1994.","verbatim":["(1) Akta ini bolehlah dinamakan Akta Keselamatan dan Kesihatan Pekerjaan 1994."],"p":"I"},{"ref":"s.1(2)","sec":"1","title":"Tajuk ringkas dan pemakaian","gist":"[DIPINDA 2024] Terpakai kepada SEMUA tempat kerja di seluruh Malaysia, termasuk perkhidmatan awam dan badan berkanun.","verbatim":["(2) Tertakluk kepada subseksyen (3), Akta ini hendaklah terpakai bagi semua tempat kerja di seluruh Malaysia termasuk dalam perkhidmatan awam dan pihak berkuasa berkanun."],"p":"I"},{"ref":"s.1(3)","sec":"1","title":"Tajuk ringkas dan pemakaian","gist":"Tidak terpakai kepada kerja dalam Jadual Pertama (pembantu rumah, angkatan tentera, kerja di atas kapal).","verbatim":["(3) Tiada apa-apa jua dalam Akta ini terpakai bagi pekerjaan yang dinyatakan dalam Jadual Pertama."],"p":"I"},{"ref":"s.2(1)","sec":"2","title":"Undang-undang yang mengatasi","gist":"Akta ini adalah tambahan kepada undang-undang KKP lain, bukan menggantikannya.","verbatim":["(1) Peruntukan Akta ini hendaklah menjadi tambahan kepada, dan tidak mengurangkan, peruntukan mana-mana undang-undang bertulis lain yang berhubungan dengan keselamatan dan kesihatan pekerjaan."],"p":"I"},{"ref":"s.2(2)","sec":"2","title":"Undang-undang yang mengatasi","gist":"Jika bercanggah dengan undang-undang KKP lain, Akta ini yang mengatasi.","verbatim":["(2) Sekiranya terdapat apa-apa percanggahan atau ketakkonsistenan antara peruntukan Akta ini dengan mana-mana undang-undang bertulis lain mengenai keselamatan dan kesihatan pekerjaan, peruntukan Akta ini hendaklah mengatasi dan peruntukan yang bercanggah atau tak konsisten dalam undang-undang bertulis lain itu hendaklah, setakat percanggahan atau ketakkonsistenan itu, ditafsirkan sebagai digantikan."],"p":"I"},{"ref":"s.3(1)","sec":"3","title":"Tafsiran","gist":"Tafsiran istilah. Yang penting: majikan, pekerja, penghuni (orang yang mengurus/mengawal tempat kerja), prinsipal, kontraktor, tempat kerja (premis tempat orang bekerja atau simpan loji/bahan), loji, bahan, praktik, orang yang bekerja sendiri, orang kompeten, PMA, kecederaan tubuh yang serius (Jadual Keempat).","verbatim":["(1) Dalam Akta ini, melainkan jika konteksnya menghendaki makna yang lain— “bahan” ertinya apa-apa bahan semula jadi atau buatan, sama ada dalam bentuk pepejal atau cecair atau dalam bentuk gas atau wap atau apa-apa gabungannya; “bahan bagi kegunaan semasa bekerja” ertinya apa-apa bahan yang dimaksudkan atau dibekalkan bagi kegunaan, sama ada secara eksklusif atau tidak, oleh orang-orang semasa bekerja; “boleh dipraktikkan” ertinya boleh dipraktikkan dengan mengambil kira—","(a) teruknya bahaya atau risiko yang terlibat;","(b) keadaan pengetahuan mengenai bahaya atau risiko itu dan apa-apa cara untuk menghapuskan atau mengurangkan bahaya atau risiko itu;","(c) ada tidaknya dan kesesuaian cara untuk menghapuskan atau mengurangkan bahaya atau risiko itu; dan","(d) kos untuk menghapuskan atau mengurangkan bahaya atau risiko itu; “ditetapkan” ertinya ditetapkan oleh Akta ini atau melalui peraturan-peraturan; “kecederaan badan yang serius” ertinya apa-apa kecederaan sebagaimana yang dinyatakan dalam Jadual Keempat; “kerajaan” ertinya Kerajaan Persekutuan, Kerajaan sesuatu Negeri atau kerajaan tempatan; “kesatuan sekerja” ertinya apa-apa persatuan atau gabungan pekerja atau majikan mengikut pengertian Akta Kesatuan Sekerja 1959 [Akta 262]; “Ketua Pengarah” ertinya Ketua Pengarah Keselamatan dan Kesihatan Pekerjaan yang dilantik di bawah subseksyen 5(1); “kontraktor” ertinya mana-mana orang yang membuat kontrak dengan seorang prinsipal untuk menjalankan keseluruhan atau sebahagian apa-apa kerja yang diusahakan oleh prinsipal itu dalam penjalanan atau bagi maksud perdagangan, perniagaan, profesion atau pengusahaan prinsipal itu; “kontrak perkhidmatan” ertinya apa-apa perjanjian sama ada secara lisan atau bertulis dan sama ada secara nyata atau tersirat, yang menurutnya seseorang bersetuju untuk menggaji seseorang yang lain sebagai pekerja dan orang yang lain itu bersetuju untuk berkhidmat dengan majikannya sebagai pekerja dan termasuklah suatu kontrak perantisan; “loji” termasuklah apa-apa jentera, kelengkapan, perkakas, alat atau peralatan, apa-apa komponennya dan apa-apa jua yang dipasangkan, disambungkan atau diperlengkapkan padanya; “majikan” ertinya mana-mana orang yang membuat suatu kontrak perkhidmatan untuk mengambil kerja mana-mana orang lain sebagai pekerja; “Majlis” ertinya Majlis Negara bagi Keselamatan dan Kesihatan Pekerjaan yang ditubuhkan di bawah seksyen 8; “orang berlesen” ertinya seseorang yang diberikan lesen di bawah subseksyen 7A(1); “orang kompeten” ertinya orang kompeten yang berdaftar di bawah seksyen 31C; “orang yang bekerja sendiri” ertinya seseorang individu yang bekerja untuk keuntungan atau ganjaran selain daripada di bawah kontrak perkhidmatan, sama ada atau tidak dia sendiri mengambil kerja orang lain; “pegawai” ertinya pegawai yang dilantik di bawah subseksyen 5(1) atau (3); “pekerja” ertinya mana-mana orang yang telah membuat suatu kontrak perkhidmatan dengan seorang majikan; “pembekalan”, berhubungan dengan apa-apa loji atau bahan, ertinya pembekalan melalui penjualan, pertukaran, pemajakan, penyewaan atau sewa-beli, sama ada sebagai prinsipal atau ejen bagi yang lain; “pengamal perubatan berdaftar” ertinya pengamal perubatan yang berdaftar di bawah Akta Perubatan 1971 [Akta 50]; “penghuni”, berhubungan dengan tempat kerja, ertinya seseorang yang menguruskan atau mengawal tempat kerja; “penyedia latihan berdaftar” ertinya penyedia latihan yang berdaftar di bawah seksyen 31C; “perakuan kelayakan” ertinya suatu perakuan yang dikeluarkan di bawah seksyen 27D; “perkhidmatan kesihatan pekerjaan” termasuklah perkhidmatan bagi perlindungan kesihatan pekerja semasa bekerja, bagi penggalakan kesihatan dan kesejahteraan di tempat kerja, dan juga bagi pencegahan penyakit pekerjaan, keracunan pekerjaan dan kemalangan; “premis” termasuklah— (a) mana-mana tanah, bangunan atau bahagian mana-mana bangunan; (b) mana-mana kenderaan, vesel, hoverkraf atau pesawat udara; (c) apa-apa pepasangan di atas tanah, pepasangan luar pesisir atau pepasangan lain sama ada di atas dasar atau yang terapung di atas mana-mana air; dan (d) mana-mana khemah atau struktur boleh alih; “prinsipal” ertinya mana-mana orang yang dalam penjalanan atau bagi maksud perdagangan, perniagaan, profesion atau pengusahaannya membuat kontrak dengan seorang kontraktor untuk pelaksanaan oleh atau di bawah kontraktor itu keseluruhan atau sebahagian daripada apa-apa kerja yang diusahakan oleh prinsipal itu; “tempat kerja” ertinya premis tempat orang-orang bekerja atau premis yang digunakan bagi penyimpanan loji atau bahan."],"p":"I"},{"ref":"s.3(2)","sec":"3","title":"Tafsiran","gist":"Risiko daripada aktiviti kerja termasuk risiko daripada cara aktiviti dijalankan, loji dan bahan yang digunakan, dan keadaan premis.","verbatim":["(2) Bagi maksud Akta ini, risiko yang berbangkit daripada atau berkaitan dengan aktiviti orang-orang yang sedang bekerja hendaklah dikira sebagai termasuk risiko yang berkaitan dengan cara suatu pengusahaan dijalankan, loji atau bahan yang digunakan bagi maksud sesuatu pengusahaan dan keadaan premis yang digunakan sedemikian atau mana-mana bahagiannya."],"p":"I"},{"ref":"s.3(3)","sec":"3","title":"Tafsiran","gist":"(a) \"Kerja\" = kerja sebagai pekerja atau orang yang bekerja sendiri; (b) pekerja dianggap sedang bekerja sepanjang masa dia berada di tempat kerja sahaja; (c) orang yang bekerja sendiri dianggap bekerja sepanjang masa yang diluangkan untuk kerjanya.","verbatim":["(3) Bagi maksud Akta ini—","(a) “kerja” ertinya kerja sebagai seorang pekerja atau sebagai orang yang bekerja sendiri;","(b) seseorang pekerja disifatkan sedang bekerja sepanjang masa dia berada di tempat kerjanya tetapi tidak selainnya; dan","(c) orang yang bekerja sendiri adalah sedang bekerja sepanjang masa yang ditumpukannya kepada kerja sebagai seorang yang bekerja sendiri."],"p":"I"},{"ref":"s.4(a)","sec":"4","title":"Tujuan Akta","gist":"Tujuan 1: menjamin keselamatan, kesihatan dan kebajikan orang yang sedang bekerja.","verbatim":["Tujuan Akta ini adalah—","(a) untuk memastikan keselamatan, kesihatan dan kebajikan orang-orang yang sedang bekerja terhadap risiko kepada keselamatan atau kesihatan yang berbangkit daripada aktiviti orang-orang yang sedang bekerja;"],"p":"I"},{"ref":"s.4(b)","sec":"4","title":"Tujuan Akta","gist":"Tujuan 2: melindungi orang lain di tempat kerja (cth. pelawat) daripada risiko aktiviti kerja.","verbatim":["Tujuan Akta ini adalah—","(b) untuk melindungi orang-orang di tempat kerja selain daripada orang-orang yang sedang bekerja terhadap risiko keselamatan atau kesihatan yang berbangkit daripada aktiviti orang-orang yang sedang bekerja;"],"p":"I"},{"ref":"s.4(c)","sec":"4","title":"Tujuan Akta","gist":"Tujuan 3: menggalakkan persekitaran kerja yang sesuai dengan keperluan fisiologi dan psikologi pekerja.","verbatim":["Tujuan Akta ini adalah—","(c) untuk menggalakkan suatu persekitaran pekerjaan bagi orang-orang yang sedang bekerja yang disesuaikan dengan keperluan fisiologi dan psikologi mereka;"],"p":"I"},{"ref":"s.4(d)","sec":"4","title":"Tujuan Akta","gist":"Tujuan 4: menggantikan undang-undang KKP lama secara beransur dengan peraturan dan tataamalan industri (kawal selia kendiri).","verbatim":["Tujuan Akta ini adalah—","(d) untuk mengadakan cara yang menurutnya perundangan keselamatan dan kesihatan pekerjaan yang berkaitan boleh digantikan secara berperingkat-peringkat oleh sistem peraturan dan tataamalan industri yang diluluskan, yang berjalan secara bergabung dengan peruntukan Akta ini yang dimaksudkan untuk mengekalkan atau memperbaiki standard keselamatan dan kesihatan."],"p":"I"},{"ref":"s.5(1)","sec":"5","title":"Pelantikan pegawai, dsb.","gist":"Menteri melantik daripada Skim Perkhidmatan Pemeriksa Kilang dan Jentera: (a) Ketua Pengarah (KP); (b) Timbalan KP, Pengarah, Timbalan Pengarah, Penolong Pengarah dan pegawai KKP lain.","verbatim":["(1) Menteri hendaklah melantik daripada kalangan pegawai dalam Skim Perkhidmatan Pemeriksa Kilang dan Jentera—","(a) Ketua Pengarah bagi maksud menjalankan kuasa dan melaksanakan kewajipan yang diberikan kepadanya di bawah Akta ini; dan","(b) apa-apa bilangan Timbalan Ketua Pengarah, Pengarah, Timbalan Pengarah, Penolong Pengarah dan pegawai keselamatan dan kesihatan pekerjaan lain sebagaimana yang perlu bagi maksud Akta ini."],"p":"II"},{"ref":"s.5(2)","sec":"5","title":"Pelantikan pegawai, dsb.","gist":"Jika KP tidak dapat bertugas, Timbalan KP menjalankan kuasa dan tugasnya.","verbatim":["(2) Jika atas apa-apa sebab Ketua Pengarah tidak dapat menjalankan kuasa atau melaksanakan kewajipan jawatannya, kuasa atau kewajipan itu hendaklah dijalankan atau dilaksanakan oleh Timbalan Ketua Pengarah."],"p":"II"},{"ref":"s.5(3)","sec":"5","title":"Pelantikan pegawai, dsb.","gist":"Menteri boleh melantik pegawai awam daripada skim lain sebagai pegawai bagi tujuan tertentu.","verbatim":["(3) Menteri boleh melantik mana-mana pegawai awam daripada mana-mana skim perkhidmatan selain yang dinyatakan dalam subseksyen (1) untuk menjadi pegawai bagi semua atau mana-mana maksud Akta ini sebagaimana yang dinyatakan dalam instrumen pelantikan."],"p":"II"},{"ref":"s.5(4)","sec":"5","title":"Pelantikan pegawai, dsb.","gist":"Pegawai yang dilantik boleh menjalankan semua tugas dan kuasa KP, tertakluk kepada had yang ditetapkan.","verbatim":["(4) Tertakluk pada apa-apa batasan sebagaimana yang ditetapkan, pegawai yang dilantik di bawah perenggan (1)(b) dan subseksyen (3) hendaklah melaksanakan semua kewajipan yang diberikan, dan boleh menjalankan semua kuasa yang diberikan, kepada Ketua Pengarah di bawah Akta ini, dan tiap-tiap kewajipan yang dilaksanakan dan kuasa yang dijalankan itu hendaklah disifatkan telah dilaksanakan dan dijalankan dengan sewajarnya bagi maksud Akta ini."],"p":"II"},{"ref":"s.5(5)","sec":"5","title":"Pelantikan pegawai, dsb.","gist":"Semua pegawai di bawah kawalan, arahan dan penyeliaan KP.","verbatim":["(5) Pegawai yang dilantik di bawah perenggan (1)(b) dan subseksyen (3) hendaklah tertakluk kepada kawalan, arahan dan pengawasan Ketua Pengarah."],"p":"II"},{"ref":"s.6(1)","sec":"6","title":"Pelantikan badan pemeriksaan bebas","gist":"KP boleh melantik orang atau badan pemeriksa bebas daripada industri untuk menasihati atau membantunya.","verbatim":["(1) Ketua Pengarah boleh, sebagaimana yang difikirkannya patut, melantik seseorang atau sesuatu badan pemeriksaan bebas daripada mana-mana industri untuk menasihati atau membantunya dalam menjalankan tujuan-tujuan dan maksud-maksud Akta ini."],"p":"II"},{"ref":"s.6(2)","sec":"6","title":"Pelantikan badan pemeriksaan bebas","gist":"Mereka dibayar elaun, fi atau bayaran balik yang ditentukan Menteri.","verbatim":["(2) Seseorang atau sesuatu badan pemeriksaan bebas yang dilantik di bawah subseksyen (1) hendaklah dibayar apa-apa elaun, fee atau bayaran ganti yang ditentukan oleh Menteri."],"p":"II"},{"ref":"s.6(3)","sec":"6","title":"Pelantikan badan pemeriksaan bebas","gist":"Mereka di bawah kawalan, arahan dan penyeliaan KP.","verbatim":["(3) Seseorang atau sesuatu badan pemeriksaan bebas yang dilantik di bawah subseksyen (1) hendaklah tertakluk pada kawalan, arahan dan pengawasan Ketua Pengarah."],"p":"II"},{"ref":"s.6(4)","sec":"6","title":"Pelantikan badan pemeriksaan bebas","gist":"Mereka dianggap penjawat awam di bawah Kanun Keseksaan.","verbatim":["(4) Seseorang atau sesuatu badan pemeriksaan bebas yang dilantik di bawah subseksyen (1), hendaklah disifatkan sebagai pegawai awam mengikut pengertian Kanun Keseksaan [Akta 574]."],"p":"II"},{"ref":"s.7(1)","sec":"7","title":"Perakuan pemberikuasaan","gist":"KP mengeluarkan perakuan kuasa (kad kuasa) kepada setiap pegawai. Mesti ditunjukkan apabila diminta oleh penghuni atau orang yang menjaga tempat kerja.","verbatim":["(1) Ketua Pengarah hendaklah mengeluarkan kepada tiap-tiap pegawai yang dilantik di bawah perenggan 5(1)(b) dan subseksyen 5(3) suatu perakuan pemberikuasaan yang hendaklah ditunjukkan apabila diminta kepada penghuni atau mana-mana orang yang menjaga sesuatu tempat kerja yang pegawai itu berhasrat untuk memasuki menurut Akta ini."],"p":"II"},{"ref":"s.7(2)","sec":"7","title":"Perakuan pemberikuasaan","gist":"Perakuan kuasa KP dikeluarkan oleh Menteri.","verbatim":["(2) Dalam hal Ketua Pengarah, perakuan pemberikuasaannya hendaklah dikeluarkan oleh Menteri."],"p":"II"},{"ref":"s.7A(1)","sec":"7A","title":"Pelantikan orang berlesen, dsb.","gist":"[BAHARU 2024] Menteri boleh memberi lesen (dengan syarat) kepada sesiapa untuk memeriksa loji yang ditetapkan dan mengeluarkan PMA.","verbatim":["(1) Walau apa pun apa-apa jua peruntukan lain Akta ini, Menteri hendaklah mempunyai kuasa untuk memberikan lesen atas apa-apa syarat sebagaimana yang difikirkannya patut kepada mana-mana orang untuk menjalankan pemeriksaan apa-apa loji yang ditetapkan oleh Menteri dan mengeluarkan perakuan kelayakan berkenaan dengan loji yang diperiksa itu."],"p":"II"},{"ref":"s.7A(2)","sec":"7A","title":"Pelantikan orang berlesen, dsb.","gist":"Menteri boleh membuat perintah tentang: (a) kelayakan pekerja orang berlesen; (b) kuasa mereka; (c) rekod; (d) penyata kepada KP; (e) pemeriksaan premis orang berlesen oleh KP; (f) standard pemeriksaan; (g) fungsi dan tugas orang berlesen.","verbatim":["(2) Menteri boleh, bagi maksud subseksyen (1) dan tanpa menjejaskan keluasan subseksyen (1), membuat perintah yang disiarkan dalam Warta bagi maksud yang berikut:","(a) untuk menetapkan kelayakan dan standard kekompetenan orang yang akan diambil kerja oleh orang berlesen;","(b) untuk menetapkan kuasa orang yang diambil kerja oleh orang berlesen untuk menjalankan fungsi orang berlesen;","(c) untuk menetapkan rekod yang hendaklah disimpan oleh orang berlesen;","(d) untuk menetapkan penyata yang hendaklah dikemukakan oleh orang berlesen kepada Ketua Pengarah pada lat-lat tempoh tertentu;","(e) untuk mengawal selia pemeriksaan oleh Ketua Pengarah terhadap premis orang berlesen dan rekod yang disimpan di premis itu;","(f) untuk menetapkan standard pemeriksaan untuk dipatuhi oleh orang berlesen; dan","(g) untuk menetapkan fungsi atau kewajipan yang hendaklah dijalankan oleh orang berlesen."],"p":"II"},{"ref":"s.7A(3)","sec":"7A","title":"Pelantikan orang berlesen, dsb.","gist":"Menteri boleh membenarkan orang berlesen mengenakan dan memungut caj, fi atau levi.","verbatim":["(3) Menteri boleh, melalui perintah yang disiarkan dalam Warta, memberikan kuasa kepada orang berlesen untuk menuntut, menetapkan, memungut dan menyimpan caj, fi atau levi yang berkenaan dengan perkhidmatan yang diberikan oleh orang berlesen itu."],"p":"II"},{"ref":"s.7A(4)","sec":"7A","title":"Pelantikan orang berlesen, dsb.","gist":"Perintah itu mesti menyatakan (a) jenis perkhidmatan dan (b) tempoh kebenaran memungut caj.","verbatim":["(4) Suatu perintah yang dibuat di bawah subseksyen (3) hendaklah menyatakan—","(a) jenis perkhidmatan yang berkenaan dengannya caj, fi atau levi boleh dituntut, dipungut dan disimpan; dan","(b) tempoh pemberian kuasa untuk menuntut, memungut dan menyimpan caj, fi atau levi itu."],"p":"II"},{"ref":"s.7A(5)","sec":"7A","title":"Pelantikan orang berlesen, dsb.","gist":"Orang berlesen mesti: (a) menyimpan akaun dan rekod kutipan; (b) memberi maklumat dan penyata kepada KP; (c) membenarkan KP memeriksa dokumen dan peralatan kutipan.","verbatim":["(5) Orang berlesen yang diberi kuasa di bawah subseksyen (3) hendaklah—","(a) menyenggarakan apa-apa akaun, buku dan rekod berkenaan dengan pembayaran dan pemungutan caj, fi atau levi sebagaimana yang dikehendaki oleh Ketua Pengarah;","(b) mengemukakan kepada Ketua Pengarah apa-apa maklumat, penyata dan akaun berkenaan dengan pembayaran dan pemungutan caj, fi atau levi sebagaimana yang dikehendaki oleh Ketua Pengarah; dan","(c) membenarkan Ketua Pengarah atau mana-mana orang lain yang diberi kuasa secara bertulis oleh Ketua Pengarah untuk mendapatkan akses kepada atau meneliti atau memeriksa apa-apa dokumen, jentera atau peralatan yang disenggarakan atau yang digunakan bagi pembayaran dan pemungutan caj, fi atau levi."],"p":"II"},{"ref":"s.7A(6)","sec":"7A","title":"Pelantikan orang berlesen, dsb.","gist":"Kerajaan Persekutuan tidak bertanggungan atas kerugian akibat kegagalan orang berlesen.","verbatim":["(6) Pemberikuasaan orang berlesen di bawah subseksyen (3) tidak boleh menyebabkan Kerajaan Persekutuan bertanggungan kepada mana-mana orang berkenaan dengan apa-apa kecederaan, kerosakan atau kerugian yang disebabkan oleh kegagalan orang berlesen itu untuk menjalankan obligasinya di bawah Akta ini yang berkenaan dengannya caj, fi atau levi yang dituntut, dipungut dan disimpan."],"p":"II"},{"ref":"s.7A(7)","sec":"7A","title":"Pelantikan orang berlesen, dsb.","gist":"Langgar syarat lesen, perintah atau s.7A(5): denda hingga RM100,000 atau penjara hingga 1 tahun atau kedua-duanya.","verbatim":["(7) Jika orang berlesen melanggar mana-mana syarat lesen atau mana-mana peruntukan apa-apa perintah yang dibuat di bawah seksyen ini atau mana-mana peruntukan subseksyen (5) yang dia dikehendaki untuk mematuhinya, orang berlesen itu melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi satu ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi satu tahun atau kedua-duanya."],"p":"II"},{"ref":"s.7A(8)","sec":"7A","title":"Pelantikan orang berlesen, dsb.","gist":"Walaupun ada orang berlesen, Menteri masih boleh mengarahkan KP menjalankan fungsi tersebut.","verbatim":["(8) Walau apa pun pelesenan seseorang di bawah seksyen ini, Menteri boleh memberikan arahan kepada Ketua Pengarah untuk menjalankan mana-mana fungsi yang di bawah terma-terma lesen itu sepatutnya dijalankan oleh orang itu."],"p":"II"},{"ref":"s.7B(1)","sec":"7B","title":"Pembatalan lesen","gist":"[BAHARU 2024] Jika orang berlesen melanggar syarat, KP boleh memberi notis bertulis supaya mematuhi dalam tempoh tertentu.","verbatim":["(1) Jika Ketua Pengarah berpuas hati bahawa orang berlesen telah melanggar mana-mana syarat lesen, Ketua Pengarah boleh memberikan suatu notis bertulis kepada orang berlesen itu yang menghendakinya untuk mematuhi syarat yang telah dilanggar olehnya dan mengambil segala langkah yang ditetapkan dalam notis itu dalam tempoh yang dinyatakan dalam notis itu."],"p":"II"},{"ref":"s.7B(2)","sec":"7B","title":"Pembatalan lesen","gist":"Jika masih gagal selepas tempoh notis, KP melaporkan kepada Menteri.","verbatim":["(2) Jika sehingga tempoh yang ditetapkan dalam notis itu tamat orang berlesen itu telah gagal untuk mematuhi notis itu, Ketua Pengarah hendaklah mengemukakan suatu laporan kepada Menteri tentang kegagalan itu."],"p":"II"},{"ref":"s.7B(3)","sec":"7B","title":"Pembatalan lesen","gist":"Jika pelanggaran serius atau menjejaskan keselamatan, Menteri memberi notis cadangan pembatalan, menyatakan (a) pelanggaran dan (b) tempoh representasi (sekurang-kurangnya 30 hari).","verbatim":["(3) Jika, selepas mempertimbangkan laporan daripada Ketua Pengarah, Menteri berpuas hati bahawa pelanggaran itu serius dari segi sifat atau menjejaskan atau boleh menjejaskan keselamatan dan kesihatan pekerja atau orang awam dan bahawa orang berlesen itu telah gagal atau enggan untuk mengambil atau tidak mengambil segala langkah yang ditetapkan dalam notis itu bagi maksud memastikan pematuhan syarat yang telah dilanggar oleh orang berlesen itu, Menteri boleh memberi orang berlesen itu suatu notis yang menyatakan bahawa dia bercadang untuk membatalkan lesen yang diberikan kepada orang itu dan notis itu juga hendaklah menyatakan—","(a) pelanggaran yang dikatakan terhadap orang berlesen itu dan tindakan atau peninggalan yang menjadikan pelanggaran itu; dan","(b) tempoh (yang tidak boleh kurang daripada tiga puluh hari dari tarikh notis itu) yang dalamnya orang berlesen itu boleh membuat representasi berhubung dengan pembatalan itu."],"p":"II"},{"ref":"s.7B(4)","sec":"7B","title":"Pembatalan lesen","gist":"Selepas tempoh itu, Menteri memutuskan sama ada meneruskan pembatalan atau tidak mengambil tindakan.","verbatim":["(4) Selepas tamat tempoh yang dinyatakan dalam notis itu dan selepas mempertimbangkan apa-apa representasi yang dibuat oleh orang berlesen itu, Menteri boleh memutuskan sama ada untuk meneruskan dengan cadangan pembatalan itu atau tidak mengambil tindakan selanjutnya."],"p":"II"},{"ref":"s.7B(5)","sec":"7B","title":"Pembatalan lesen","gist":"Menteri memaklumkan keputusan melalui notis; berkuat kuasa pada tarikh notis diserahkan.","verbatim":["(5) Jika Menteri membuat keputusan untuk membatalkan lesen atau tidak mengambil tindakan selanjutnya, Menteri hendaklah memberikan suatu notis kepada orang berlesen itu untuk memaklumkan orang berlesen itu tentang keputusan itu, dan keputusan itu hendaklah berkuat kuasa pada tarikh notis itu dihantar kepada orang berlesen itu."],"p":"II"},{"ref":"s.7B(6)","sec":"7B","title":"Pembatalan lesen","gist":"Lesen yang dibatalkan mesti diserahkan kepada KP dalam 7 hari.","verbatim":["(6) Orang berlesen hendaklah menyerahkan lesen yang telah dibatalkan kepada Ketua Pengarah dalam tempoh tujuh hari dari tarikh penerimaan notis di bawah subseksyen (5)."],"p":"II"},{"ref":"s.7B(7)","sec":"7B","title":"Pembatalan lesen","gist":"PMA yang telah dikeluarkan kekal sah hingga tarikh tamat, dan orang itu kekal bertanggungjawab ke atasnya.","verbatim":["(7) Walau apa pun pembatalan lesen itu, kesahan apa-apa perakuan kelayakan yang dikeluarkan oleh orang berlesen itu hendaklah terus sah sehingga habis tempoh perakuan kelayakan itu dan orang berlesen itu hendaklah terus mengambil alih apa-apa obligasi, kewajipan dan tanggungjawab yang dikenakan oleh atau berkaitan dengan pengeluaran perakuan kelayakan itu."],"p":"II"},{"ref":"s.7C(1)","sec":"7C","title":"Pemberian lesen baharu apabila pembatalan","gist":"[BAHARU 2024] Selepas pembatalan, Menteri (selepas berunding dengan KP) boleh melantik orang lain mengambil alih fungsi dan menerima bayaran lesen itu.","verbatim":["(1) Apabila suatu lesen dibatalkan di bawah seksyen 7B, Menteri boleh, selepas berunding dengan Ketua Pengarah, melantik orang lain untuk menjalankan, menunaikan, mengambil alih atau melaksanakan apa-apa fungsi, obligasi, kewajipan, tanggungjawab dan syarat yang diberikan atau yang dikenakan oleh lesen yang dibatalkan itu, dan untuk menerima apa-apa pembayaran, faedah atau keistimewaan yang orang yang lesennya dibatalkan itu berhak untuk menerima atau menikmati di bawah terma-terma dan syarat-syarat lesen itu."],"p":"II"},{"ref":"s.7C(2)","sec":"7C","title":"Pemberian lesen baharu apabila pembatalan","gist":"Orang yang lesennya dibatalkan mesti memberi semua bantuan dan kerjasama.","verbatim":["(2) Orang yang lesennya dibatalkan hendaklah memberikan segala bantuan dan kerjasama yang perlu kepada orang yang dilantik oleh Menteri di bawah subseksyen (1)."],"p":"II"},{"ref":"s.7D(1)","sec":"7D","title":"Menyatakan diri sebagai orang berlesen","gist":"[BAHARU 2024] Tidak boleh mengaku sebagai orang berlesen jika tidak pernah dilesenkan atau lesen telah dibatalkan.","verbatim":["(1) Seseorang tidak boleh menyatakan dirinya sebagai orang berlesen jika dia tidak pernah diberikan lesen di bawah seksyen 7A atau lesen yang diberikan kepadanya telah dibatalkan di bawah seksyen 7B."],"p":"II"},{"ref":"s.7D(2)","sec":"7D","title":"Menyatakan diri sebagai orang berlesen","gist":"Penalti: hingga RM200,000 atau 2 tahun atau kedua-duanya.","verbatim":["(2) Seseorang yang melanggar subseksyen (1) melakukan suatu kesalahan dan boleh, apabila disabitkan, didenda tidak melebihi dua ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"II"},{"ref":"s.8","sec":"8","title":"Penubuhan Majlis","gist":"Menubuhkan Majlis Negara bagi Keselamatan dan Kesihatan Pekerjaan (MNKKP).","verbatim":["Maka hendaklah ditubuhkan suatu majlis yang dikenali sebagai “Majlis Negara bagi Keselamatan dan Kesihatan Pekerjaan”."],"p":"III"},{"ref":"s.9(1)","sec":"9","title":"Keanggotaan Majlis","gist":"[DIPINDA 2024] 22 hingga 25 ahli dilantik Menteri: (a) 5 wakil majikan; (b) 5 wakil pekerja; (c) KSU Kementerian Sumber Manusia; (d) KP JKKP; (e) 5 wakil kerajaan termasuk KP Kesihatan; (f) Pengarah Eksekutif NIOSH; (g) Ketua Eksekutif PERKESO; (h) 3 orang atau lebih daripada badan profesional KKP, sekurang-kurangnya seorang wanita.","verbatim":["(1) Majlis hendaklah terdiri daripada tidak kurang daripada dua puluh dua dan tidak lebih daripada dua puluh lima anggota yang hendaklah dilantik oleh Menteri seperti yang berikut:","(a) lima orang daripada organisasi yang mewakili majikan yang, pada pendapat Menteri, mempunyai pengalaman yang luas atau pengetahuan khas dalam perkara yang berhubungan dengan keselamatan dan kesihatan pekerjaan;","(b) lima orang daripada organisasi yang mewakili pekerja yang, pada pendapat Menteri, mempunyai pengalaman yang luas atau pengetahuan khas dalam perkara yang berhubungan dengan keselamatan dan kesihatan pekerjaan;","(c) Ketua Setiausaha Kementerian Sumber Manusia;","(d) Ketua Pengarah;","(e) lima wakil Kerajaan, yang terdiri daripada— (i) Ketua Pengarah Kesihatan Malaysia; dan (ii) wakil daripada Kementerian atau Jabatan yang tanggungjawabnya berhubungan dengan keselamatan dan kesihatan pekerjaan, yang, pada pendapat Menteri, mempunyai pengalaman yang luas atau pengetahuan khas dalam perkara yang berhubungan dengan keselamatan dan kesihatan pekerjaan;","(f) Pengarah Eksekutif Institut Keselamatan dan Kesihatan Pekerjaan Negara;","(g) Ketua Pegawai Eksekutif Pertubuhan Keselamatan Sosial; dan","(h) tiga orang atau lebih, yang daripadanya sekurang-kurangnya seorang hendaklah wanita, daripada organisasi atau badan profesional yang aktiviti anggotanya berkaitan dengan keselamatan dan kesihatan pekerjaan, dan yang, pada pendapat Menteri, mempunyai pengalaman yang luas atau pengetahuan khas dalam perkara yang berhubungan dengan keselamatan dan kesihatan pekerjaan."],"p":"III"},{"ref":"s.9(2)","sec":"9","title":"Keanggotaan Majlis","gist":"Menteri melantik Pengerusi dan Timbalan Pengerusi daripada ahli, kecuali KP JKKP.","verbatim":["(2) Menteri hendaklah melantik Pengerusi dan Timbalan Pengerusi Majlis daripada kalangan orang yang disebut dalam subseksyen (1), kecuali orang yang disebut dalam perenggan (1)(d)."],"p":"III"},{"ref":"s.10","sec":"10","title":"Jadual Kedua adalah terpakai","gist":"Peruntukan Jadual Kedua terpakai kepada ahli Majlis.","verbatim":["Peruntukan Jadual Kedua hendaklah terpakai bagi anggota Majlis."],"p":"III"},{"ref":"s.11(1)","sec":"11","title":"Kuasa dan fungsi Majlis","gist":"Majlis berkuasa melakukan semua perkara yang perlu untuk mencapai tujuan Akta.","verbatim":["(1) Majlis hendaklah mempunyai kuasa untuk melakukan semua perkara yang suaimanfaat atau semunasabahnya perlu bagi atau bersampingan dengan penjalanan tujuan-tujuan Akta ini."],"p":"III"},{"ref":"s.11(2)","sec":"11","title":"Kuasa dan fungsi Majlis","gist":"Majlis boleh (dan wajib jika diminta Menteri) menyiasat dan membuat laporan serta syor tentang: (a) pindaan undang-undang KKP; (b) pentadbiran dan penguatkuasaan; (c) kerjasama pengurusan-pekerja; (d) masalah wanita, OKU dan golongan lain; (e) kawalan bahan kimia industri; (f) analisis statistik kematian dan kecederaan; (g) kemudahan kesihatan di tempat kerja; (h) tataamalan industri; (i) pemulihan mangsa kecederaan; (j) kesedaran masyarakat; (k) penyelidikan KKP; (l) sistem maklumat KKP.","verbatim":["(2) Majlis boleh, dan apabila diminta oleh Menteri supaya berbuat demikian hendaklah, menjalankan penyiasatan dan membuat laporan dan syor kepadanya berkenaan dengan apa-apa perkara berhubungan dengan tujuan-tujuan Akta ini dan, terutamanya, tetapi tanpa menjejaskan keluasan makna peruntukan di atas, berkenaan dengan—","(a) perubahan yang dianggapnya wajar bagi perundangan keselamatan dan kesihatan pekerjaan;","(b) pemajuan pentadbiran dan penguatkuasaan perundangan keselamatan dan kesihatan pekerjaan;","(c) penggalakan hubungan kerjasama perundingan antara pengurusan dengan buruh tentang keselamatan, kesihatan dan kebajikan orang-orang yang sedang bekerja;","(d) masalah-masalah khusus berkenaan dengan keselamatan, kesihatan dan kebajikan pekerjaan wanita, orang-orang cacat dan golongan-golongan lain dalam masyarakat;","(e) penubuhan kaedah-kaedah kawalan yang mencukupi bagi kimia industri di tempat kerja;","(f) penganalisisan statistik mengenai kematian dan kecederaan yang berhubungan dengan pekerjaan;","(g) pengadaan kemudahan penjagaan kesihatan di tempat kerja;","(h) penggalakan pembangunan dan penerima pakaian melalui undang-undang tataamalan industri yang berhubungan dengan keselamatan, kesihatan dan kebajikan pekerjaan;","(i) pembangunan rancangan dan kemudahan pemulihan untuk membantu orang-orang yang cedera di tempat kerja;","(j) prosedur, perkiraan, latihan, pendidikan atau langkah-langkah wajar yang perlu diambil untuk meningkatkan kesedaran masyarakat terhadap keselamatan, kesihatan dan kebajikan pekerjaan;","(k) bidang penyelidikan keselamatan dan kesihatan pekerjaan yang akan dibangunkan oleh institusi yang relevan dan penerbitan hasil penyelidikan itu;","(l) pembangunan dan pewujudan suatu mekanisme untuk menjana, memproses, menyimpan dan menyebar maklumat tentang keselamatan, kesihatan dan kebajikan pekerjaan."],"p":"III"},{"ref":"s.11(3)","sec":"11","title":"Kuasa dan fungsi Majlis","gist":"Majlis menyelaras semua aktiviti KKP yang dijalankan oleh kerajaan.","verbatim":["(3) Majlis hendaklah menyelaraskan semua perkara dan aktiviti yang berhubungan dengan keselamatan dan kesihatan pekerjaan yang dilaksanakan atau dijalankan oleh Kerajaan. Pelantikan setiausaha kepada Majlis"],"p":"III"},{"ref":"s.12(1)","sec":"12","title":"Perlantikan setiausaha kepada Majlis","gist":"KP JKKP menjadi setiausaha Majlis.","verbatim":["(1) Ketua Pengarah, yang merupakan anggota Majlis di bawah perenggan 9(1)(d), hendaklah menjadi setiausaha kepada Majlis."],"p":"III"},{"ref":"s.12(2)","sec":"12","title":"Perlantikan setiausaha kepada Majlis","gist":"Dengan kelulusan Menteri, Majlis boleh menggunakan kakitangan dan kemudahan pejabat KP.","verbatim":["(2) Majlis boleh, dengan kelulusan Menteri, membuat perkiraan bagi penggunaan perkhidmatan mana-mana kakitangan atau kemudahan pejabat Ketua Pengarah."],"p":"III"},{"ref":"s.13(1)","sec":"13","title":"Jawatankuasa","gist":"Majlis boleh menubuhkan (a) jawatankuasa mengikut industri untuk tataamalan, dan (b) jawatankuasa lain.","verbatim":["(1) Majlis boleh—","(a) menubuhkan jawatankuasa berkenaan dengan industri yang berbeza bagi maksud membantu Majlis melaksanakan fungsi-fungsinya yang berhubungan dengan tataamalan industri; dan","(b) menubuhkan apa-apa jawatankuasa lain yang difikirkannya patut bagi maksud membantu Majlis melaksanakan fungsi-fungsinya yang lain."],"p":"III"},{"ref":"s.13(2)","sec":"13","title":"Jawatankuasa","gist":"Ahli jawatankuasa dilantik daripada kalangan ahli Majlis.","verbatim":["(2) Jawatankuasa hendaklah terdiri daripada sekian bilangan orang yang boleh dilantik oleh Majlis daripada kalangan anggotanya."],"p":"III"},{"ref":"s.13(3)","sec":"13","title":"Jawatankuasa","gist":"Majlis boleh menjemput orang luar atau wakil organisasi untuk menasihati jawatankuasa.","verbatim":["(3) Walau apa pun peruntukan subseksyen (2), Majlis boleh mempelawa mana-mana orang atau wakil mana-mana organisasi untuk menasihati sesuatu jawatankuasa yang ditubuhkan di bawah subseksyen (1) dalam menjalankan fungsi-fungsinya."],"p":"III"},{"ref":"s.13(4)","sec":"13","title":"Jawatankuasa","gist":"Ahli jawatankuasa boleh dibayar elaun yang ditentukan Majlis dengan kelulusan Menteri.","verbatim":["(4) Seseorang yang dilantik di bawah subseksyen (2) atau dipelawa menjadi anggota sesuatu jawatankuasa di bawah subseksyen (3) boleh dibayar apa-apa elaun yang boleh ditentukan oleh Majlis dengan kelulusan Menteri."],"p":"III"},{"ref":"s.14","sec":"14","title":"Laporan tahunan","gist":"Laporan tahunan kepada Menteri, disediakan selepas 31 Dis dan sebelum 31 Mac, bagi tempoh 12 bulan berakhir 31 Dis.","verbatim":["Majlis hendaklah, selepas 31 Disember tetapi sebelum 31 Mac tahun yang berikut, menyediakan dan mengemukakan kepada Menteri laporan aktivitinya bagi tempoh dua belas bulan yang berakhir pada 31 Disember setiap tahun."],"p":"III"},{"ref":"s.15(1)","sec":"15","title":"Kewajipan am majikan","gist":"Majikan mesti memastikan SYAP keselamatan, kesihatan dan kebajikan semua pekerjanya semasa bekerja.","verbatim":["(1) Adalah menjadi kewajipan tiap-tiap majikan untuk memastikan, setakat yang praktik, keselamatan, kesihatan dan kebajikan semasa bekerja semua pekerjanya."],"p":"IV"},{"ref":"s.15(2)(a)","sec":"15","title":"Kewajipan am majikan","gist":"Menyedia dan menyelenggara loji dan sistem kerja yang selamat dan tanpa risiko kesihatan.","verbatim":["(2) Tanpa menjejaskan keluasan makna subseksyen (1), perkara yang diliputi oleh kewajipan itu termasuklah terutamanya—","(a) pengadaan dan penyenggaraan loji dan sistem kerja yang, setakat yang praktik, selamat dan tanpa risiko kepada kesihatan;"],"p":"IV"},{"ref":"s.15(2)(b)","sec":"15","title":"Kewajipan am majikan","gist":"Membuat aturan supaya penggunaan, pengendalian, penyimpanan dan pengangkutan loji dan bahan adalah selamat.","verbatim":["(2) Tanpa menjejaskan keluasan makna subseksyen (1), perkara yang diliputi oleh kewajipan itu termasuklah terutamanya—","(b) pembuatan perkiraan bagi menjamin, setakat yang praktik, keselamatan dan ketiadaan risiko kepada kesihatan berkaitan dengan penggunaan atau pengendalian, penanganan, penyimpanan dan pengangkutan loji dan bahan;"],"p":"IV"},{"ref":"s.15(2)(c)","sec":"15","title":"Kewajipan am majikan","gist":"Memberi maklumat, arahan, latihan dan penyeliaan yang perlu.","verbatim":["(2) Tanpa menjejaskan keluasan makna subseksyen (1), perkara yang diliputi oleh kewajipan itu termasuklah terutamanya—","(c) pengadaan maklumat, arahan, latihan dan penyeliaan sebagaimana yang perlu untuk memastikan setakat yang praktik, keselamatan dan kesihatan pekerjanya yang sedang bekerja;"],"p":"IV"},{"ref":"s.15(2)(d)","sec":"15","title":"Kewajipan am majikan","gist":"Menyelenggara tempat kerja di bawah kawalannya supaya selamat, termasuk laluan masuk dan keluar.","verbatim":["(2) Tanpa menjejaskan keluasan makna subseksyen (1), perkara yang diliputi oleh kewajipan itu termasuklah terutamanya—","(d) setakat yang praktik, berkenaan dengan mana-mana tempat kerja di bawah kawalan majikan, penyenggaraannya dalam keadaan yang selamat dan tanpa risiko kepada kesihatan dan pengadaan dan penyenggaraan cara masuk ke dalamnya dan keluar darinya yang selamat dan tanpa risiko sedemikian; dan"],"p":"IV"},{"ref":"s.15(2)(e)","sec":"15","title":"Kewajipan am majikan","gist":"Menyedia persekitaran kerja yang selamat, tanpa risiko kesihatan, dan kemudahan kebajikan yang mencukupi.","verbatim":["(2) Tanpa menjejaskan keluasan makna subseksyen (1), perkara yang diliputi oleh kewajipan itu termasuklah terutamanya—","(e) pengadaan dan penyenggaraan persekitaran pekerjaan bagi pekerja-pekerjanya yang, setakat yang praktik, selamat, tanpa risiko kepada kesihatan, dan memadai berkenaan dengan kemudahan bagi kebajikan mereka yang sedang bekerja;"],"p":"IV"},{"ref":"s.15(2)(f)","sec":"15","title":"Kewajipan am majikan","gist":"[BAHARU 2024] Membangun dan melaksanakan prosedur menangani kecemasan semasa pekerja bekerja.","verbatim":["(2) Tanpa menjejaskan keluasan makna subseksyen (1), perkara yang diliputi oleh kewajipan itu termasuklah terutamanya—","(f) pembangunan dan pelaksanaan tatacara bagi berurusan dengan kecemasan yang boleh timbul semasa pekerjanya sedang bekerja."],"p":"IV"},{"ref":"s.15(3)","sec":"15","title":"Kewajipan am majikan","gist":"Dipotong oleh Akta A1648 (penalti kini di s.19).","verbatim":["(3) (Dipotong oleh Akta A1648)."],"p":"IV"},{"ref":"s.16","sec":"16","title":"Kewajipan majikan untuk membentuk dasar keselamatan dan kesihatan pekerjaan","gist":"[DIPINDA 2024] Majikan (kecuali yang dikecualikan) mesti menyediakan pernyataan bertulis dasar am keselamatan dan kesihatan, serta organisasi dan aturan pelaksanaannya; menyemaknya bila perlu; dan memaklumkannya kepada semua pekerja.","verbatim":["Kecuali dalam apa-apa hal yang ditetapkan, adalah menjadi kewajipan tiap-tiap majikan untuk menyediakan dan seberapa kerap yang sesuai mengkaji semula pernyataan bertulis dasar amnya berkenaan dengan keselamatan dan kesihatan pekerja-pekerjanya semasa bekerja dan organisasi dan perkiraan yang sedang berkuat kuasa bagi menjalankan dasar itu, dan membawa pernyataan dan apa-apa kajian semulanya kepada perhatian kesemua pekerjanya."],"p":"IV"},{"ref":"s.17(1)","sec":"17","title":"Kewajipan am majikan dan orang yang bekerja sendiri kepada orang-orang selain daripada pekerja mereka","gist":"Majikan dan orang yang bekerja sendiri mesti menjalankan aktiviti supaya diri sendiri dan orang bukan pekerja yang terjejas tidak terdedah kepada risiko.","verbatim":["(1) Adalah menjadi kewajipan tiap-tiap majikan dan tiap-tiap orang yang bekerja sendiri untuk menjalankan pengusahaannya dengan cara memastikan, setakat yang praktik, bahawa dia dan orang-orang lain, yang bukan pekerjanya, yang mungkin tersentuh oleh pengusahaan itu tidak terdedah kepada risiko kepada keselamatan atau kesihatan mereka oleh sebab pengusahaan itu."],"p":"IV"},{"ref":"s.17(2)","sec":"17","title":"Kewajipan am majikan dan orang yang bekerja sendiri kepada orang-orang selain daripada pekerja mereka","gist":"Mereka mesti memberi maklumat yang ditetapkan kepada bukan pekerja tentang aspek aktiviti yang boleh menjejaskan keselamatan atau kesihatan mereka.","verbatim":["(2) Adalah menjadi kewajipan tiap-tiap majikan dan tiap-tiap orang yang bekerja sendiri, dalam hal keadaan yang ditetapkan dan mengikut cara yang ditetapkan, untuk memberi orang-orang, yang bukan pekerjanya yang mungkin tersentuh dengan cara dia menjalankan pengusahaannya, maklumat yang ditetapkan tentang apa-apa aspek cara dia menjalankan pengusahaannya yang boleh menyentuh keselamatan atau kesihatan mereka."],"p":"IV"},{"ref":"s.18(1)","sec":"18","title":"Kewajipan seseorang penghuni tempat kerja kepada orang-orang selain daripada pekerjanya","gist":"Penghuni premis bukan domestik yang digunakan bukan pekerja sebagai tempat kerja mesti memastikan premis, laluan masuk/keluar, loji dan bahan di situ selamat dan tanpa risiko kesihatan.","verbatim":["(1) Seseorang penghuni premis bukan domestik yang telah disediakan untuk orang-orang, yang bukan pekerjanya, sebagai suatu tempat kerja, atau sebagai suatu tempat mereka boleh menggunakan loji atau bahan yang diadakan bagi kegunaan mereka di sana, hendaklah mengambil apa-apa langkah yang praktik untuk memastikan bahawa premis itu, semua cara masuk ke dalamnya dan keluar darinya yang ada bagi kegunaan orang-orang yang menggunakan premis itu, dan apa-apa loji atau bahan dalam premis itu atau yang diadakan bagi kegunaan di sana, adalah selamat dan tanpa risiko kepada kesihatan."],"p":"IV"},{"ref":"s.18(2)","sec":"18","title":"Kewajipan seseorang penghuni tempat kerja kepada orang-orang selain daripada pekerjanya","gist":"Sesiapa yang mempunyai tanggungjawab (melalui kontrak, pajakan dsb.) untuk (a) menyelenggara atau membaiki tempat kerja atau laluannya, atau (b) mencegah risiko daripada loji atau bahan, dianggap mengawal perkara tersebut.","verbatim":["(2) Seseorang yang mempunyai, oleh sebab suatu kontrak atau pajakan atau selainnya, suatu obligasi sehingga apa-apa takat berhubungan dengan—","(a) penyenggaraan atau pembaikan tempat kerja atau apa-apa cara masuk ke dalamnya atau keluar darinya; atau","(b) pencegahan risiko kepada keselamatan dan kesihatan yang mungkin timbul daripada penggunaan mana-mana loji atau bahan dalam tempat kerja itu, hendaklah bagi maksud subseksyen (1) disifatkan mempunyai kawalan ke atas perkara-perkara yang diliputi oleh obligasinya."],"p":"IV"},{"ref":"s.18A(1)","sec":"18A","title":"Kewajipan prinsipal","gist":"[BAHARU 2024] Prinsipal mesti mengambil langkah SYAP untuk memastikan keselamatan dan kesihatan (a) kontraktornya; (b) subkontraktor dan subkontraktor tidak langsung; (c) pekerja kontraktor dan subkontraktor, semasa bekerja.","verbatim":["(1) Hendaklah menjadi kewajipan tiap-tiap prinsipal untuk mengambil, setakat yang boleh dipraktikkan, apa-apa langkah sebagaimana yang perlu untuk memastikan keselamatan dan kesihatan—","(a) mana-mana kontraktor yang diguna khidmat oleh prinsipal apabila sedang bekerja;","(b) mana-mana subkontraktor atau subkontraktor langsung apabila sedang bekerja; dan tidak","(c) mana-mana pekerja yang diambil kerja oleh kontraktor atau subkontraktor apabila sedang bekerja."],"p":"IV"},{"ref":"s.18A(2)","sec":"18A","title":"Kewajipan prinsipal","gist":"Kewajipan ini hanya terpakai jika mereka bekerja di bawah arahan prinsipal tentang cara kerja dijalankan.","verbatim":["(2) Kewajipan yang dikenakan ke atas prinsipal dalam subseksyen (1) hendaklah hanya terpakai jika kontraktor, subkontraktor atau pekerja yang disebut dalam subseksyen itu bekerja di bawah arahan prinsipal mengenai cara kerja itu dijalankan."],"p":"IV"},{"ref":"s.18A(3)(a)","sec":"18A","title":"Kewajipan prinsipal","gist":"Loji dan sistem kerja yang selamat.","verbatim":["(3) Bagi maksud subseksyen (1), langkah-langkah yang perlu untuk memastikan keselamatan dan kesihatan orang yang sedang bekerja termasuklah—","(a) pengadaan dan penyenggaraan loji dan sistem kerja yang, setakat yang boleh dipraktikkan, selamat dan tanpa risiko kepada kesihatan;"],"p":"IV"},{"ref":"s.18A(3)(b)","sec":"18A","title":"Kewajipan prinsipal","gist":"Aturan termasuk peruntukan masa, bajet dan sumber yang mencukupi bagi kerja pembinaan, penggunaan, pengendalian, penyimpanan dan pengangkutan loji dan bahan.","verbatim":["(3) Bagi maksud subseksyen (1), langkah-langkah yang perlu untuk memastikan keselamatan dan kesihatan orang yang sedang bekerja termasuklah—","(b) pembuatan perkiraan termasuk peruntukan masa yang mencukupi, belanjawan dan sumber lain bagi menjamin, setakat yang boleh dipraktikkan, keselamatan dan ketiadaan risiko kepada kesihatan yang berkaitan dengan aktiviti kerja pembinaan, penggunaan atau pengendalian, penanganan, penyimpanan atau pengangkutan loji dan bahan;"],"p":"IV"},{"ref":"s.18A(3)(c)","sec":"18A","title":"Kewajipan prinsipal","gist":"Maklumat, arahan, latihan dan penyeliaan.","verbatim":["(3) Bagi maksud subseksyen (1), langkah-langkah yang perlu untuk memastikan keselamatan dan kesihatan orang yang sedang bekerja termasuklah—","(c) pengadaan apa-apa maklumat, arahan, latihan dan penyeliaan sebagaimana yang perlu untuk memastikan, setakat yang boleh dipraktikkan, keselamatan dan kesihatan orang yang sedang bekerja;"],"p":"IV"},{"ref":"s.18A(3)(d)","sec":"18A","title":"Kewajipan prinsipal","gist":"Tempat kerja di bawah kawalan prinsipal yang selamat, termasuk laluan masuk dan keluar.","verbatim":["(3) Bagi maksud subseksyen (1), langkah-langkah yang perlu untuk memastikan keselamatan dan kesihatan orang yang sedang bekerja termasuklah—","(d) setakat yang boleh dipraktikkan, berkenaan dengan mana-mana tempat kerja di bawah kawalan prinsipal, penyenggaraan tempat kerja dalam keadaan yang selamat dan tanpa risiko kepada kesihatan dan pengadaan dan penyenggaraan cara masuk ke dalamnya dan keluar darinya yang selamat dan tanpa risiko sedemikian;"],"p":"IV"},{"ref":"s.18A(3)(e)","sec":"18A","title":"Kewajipan prinsipal","gist":"Persekitaran kerja yang selamat dan tanpa risiko kesihatan.","verbatim":["(3) Bagi maksud subseksyen (1), langkah-langkah yang perlu untuk memastikan keselamatan dan kesihatan orang yang sedang bekerja termasuklah—","(e) pengadaan dan penyenggaraan persekitaran pekerjaan bagi orang yang sedang bekerja yang, setakat yang boleh dipraktikkan, selamat dan tanpa risiko kepada kesihatan; dan"],"p":"IV"},{"ref":"s.18A(3)(f)","sec":"18A","title":"Kewajipan prinsipal","gist":"Prosedur menangani kecemasan.","verbatim":["(3) Bagi maksud subseksyen (1), langkah-langkah yang perlu untuk memastikan keselamatan dan kesihatan orang yang sedang bekerja termasuklah—","(f) pembangunan dan pelaksanaan tatacara bagi berurusan dengan kecemasan yang boleh timbul semasa orang sedang bekerja."],"p":"IV"},{"ref":"s.18A(4)","sec":"18A","title":"Kewajipan prinsipal","gist":"Prinsipal juga mesti melindungi orang lain (selain kontraktor dan pekerja di bawah arahannya) yang mungkin terjejas oleh aktivitinya.","verbatim":["(4) Hendaklah menjadi kewajipan tiap-tiap prinsipal untuk mengambil, setakat yang boleh dipraktikkan, langkah-langkah yang perlu untuk memastikan keselamatan dan kesihatan orang, selain orang yang disebut dalam perenggan (1)(a), (b) atau (c) yang bekerja di bawah arahan prinsipal, yang mungkin terjejas dengan mana-mana pengusahaan yang dijalankan olehnya di tempat kerja."],"p":"IV"},{"ref":"s.18A(5)","sec":"18A","title":"Kewajipan prinsipal","gist":"Prinsipal mesti memberi maklumat yang ditetapkan kepada orang lain itu tentang risiko aktivitinya.","verbatim":["(5) Hendaklah menjadi kewajipan tiap-tiap prinsipal, dalam keadaan yang ditetapkan dan mengikut cara yang ditetapkan, untuk memberikan kepada orang, selain orang yang disebut dalam perenggan (1)(a), (b) atau (c) yang bekerja di bawah arahan prinsipal, maklumat yang ditetapkan tentang apa-apa aspek cara dia menjalankan pengusahaannya yang boleh menjejaskan keselamatan atau kesihatan mereka."],"p":"IV"},{"ref":"s.18A(6)","sec":"18A","title":"Kewajipan prinsipal","gist":"Tafsiran \"subkontraktor\": sesiapa yang berkontrak dengan kontraktor (atau dengan subkontraktor lain) untuk melaksanakan sebahagian atau keseluruhan kerja.","verbatim":["(6) Bagi maksud seksyen ini, “subkontraktor” ertinya mana-mana orang yang membuat kontrak dengan seorang kontraktor bagi pelaksanaan oleh atau di bawah subkontraktor itu keseluruhan atau mana-mana bahagian apa-apa kerja yang diusahakan oleh kontraktor itu bagi prinsipalnya, dan termasuklah mana-mana orang yang membuat kontrak dengan subkontraktor untuk menjalankan keseluruhan atau mana-mana bahagian apa-apa kerja yang diusahakan oleh subkontraktor itu bagi seorang kontraktor."],"p":"IV"},{"ref":"s.18B(1)","sec":"18B","title":"Kewajipan untuk menjalankan dan melaksanakan pentaksiran risiko","gist":"[BAHARU 2024] Majikan, orang yang bekerja sendiri atau prinsipal mesti menjalankan penilaian risiko terhadap risiko kepada sesiapa yang terjejas oleh aktivitinya di tempat kerja.","verbatim":["(1) Tiap-tiap majikan, orang yang bekerja sendiri atau prinsipal hendaklah menjalankan pentaksiran risiko berhubung dengan risiko keselamatan dan kesihatan yang terdedah kepada mana-mana orang yang mungkin terjejas dengan pengusahaannya di tempat kerja."],"p":"IV"},{"ref":"s.18B(2)","sec":"18B","title":"Kewajipan untuk menjalankan dan melaksanakan pentaksiran risiko","gist":"Jika penilaian menunjukkan kawalan risiko diperlukan, kawalan itu mesti dilaksanakan.","verbatim":["(2) Jika pentaksiran risiko menunjukkan bahawa kawalan risiko dikehendaki untuk menghapuskan atau mengurangkan risiko keselamatan dan kesihatan, majikan, orang yang bekerja sendiri atau prinsipal itu hendaklah melaksanakan kawalan itu."],"p":"IV"},{"ref":"s.18B(3)","sec":"18B","title":"Kewajipan untuk menjalankan dan melaksanakan pentaksiran risiko","gist":"Tafsiran \"penilaian risiko\": proses menilai risiko daripada hazard di tempat kerja dan menentukan langkah kawalan yang sesuai.","verbatim":["(3) Bagi maksud seksyen ini, “pentaksiran risiko” ertinya proses membuat penilaian risiko kepada keselamatan dan kesihatan yang timbul daripada bahaya semasa bekerja dan menentukan langkah-langkah yang wajar bagi pengawalan risiko."],"p":"IV"},{"ref":"s.19","sec":"19","title":"Penalti bagi suatu kesalahan di bawah seksyen 15, 16, 17, 18, 18A atau 18B","gist":"[DIPINDA 2024] Penalti melanggar s.15, 16, 17, 18, 18A atau 18B: denda hingga RM500,000 atau penjara hingga 2 tahun atau kedua-duanya (dahulu RM50,000).","verbatim":["Seseorang yang melanggar peruntukan seksyen 15, 16, 17, 18, 18A atau 18B adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi lima ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"IV"},{"ref":"s.20(1)","sec":"20","title":"Kewajipan am pengilang, dsb. berkenaan dengan loji bagi kegunaan semasa bekerja","gist":"Pereka bentuk, pengilang, pengimport atau pembekal loji mesti: (a) memastikan loji selamat apabila digunakan dengan betul; (b) menjalankan ujian dan pemeriksaan yang perlu; (c) menyediakan maklumat mencukupi tentang kegunaan dan syarat penggunaan selamat; (d) memberi maklumat terkini jika didapati ada risiko serius baharu.","verbatim":["(1) Adalah menjadi kewajipan seseorang yang mereka bentuk, mengilang, mengimport atau membekalkan apa-apa loji bagi kegunaan semasa bekerja—","(a) untuk memastikan, setakat yang praktik, bahawa loji itu direka bentuk dan dibina sebegitu rupa supaya selamat dan tanpa risiko kepada kesihatan apabila digunakan dengan sepatutnya;","(b) untuk menjalankan atau mengaturkan supaya dijalankan apa-apa ujian dan pemeriksaan yang perlu bagi pelaksanaan kewajipan yang dikenakan ke atasnya oleh perenggan (a);","(c) untuk mengambil apa-apa langkah yang perlu bagi menjamin bahawa akan boleh didapati berkaitan dengan penggunaan loji itu semasa bekerja maklumat memadai mengenai kegunaan yang baginya loji itu direka bentuk dan telah diuji, dan mengenai apa-apa keadaan yang perlu untuk memastikan bahawa, apabila digunakan begitu, loji itu selamat dan tanpa risiko kepada kesihatan; dan","(d) untuk mengambil apa-apa langkah yang perlu bagi menjamin, setakat yang boleh dipraktikkan, bahawa orang yang dibekalkan dengan loji itu diberikan semua kajian semula terhadap maklumat yang diberikan kepada mereka di bawah perenggan (c) sebagaimana yang perlu oleh sebab telah diketahui bahawa terdapat risiko baharu yang boleh menimbulkan risiko yang serius kepada keselamatan atau kesihatan."],"p":"V"},{"ref":"s.20(2)","sec":"20","title":"Kewajipan am pengilang, dsb. berkenaan dengan loji bagi kegunaan semasa bekerja","gist":"Pereka bentuk dan pengilang loji mesti membuat penyelidikan untuk mengenal pasti dan menghapus atau mengurangkan risiko daripada reka bentuk atau loji.","verbatim":["(2) Adalah menjadi kewajipan seseorang yang mengusahakan reka bentuk atau pengilangan apa-apa loji bagi kegunaan semasa bekerja untuk menjalankan atau mengaturkan supaya dijalankan apa-apa penyelidikan yang perlu dengan tujuan agar ditemui dan, setakat yang praktik, dihapuskan atau dikurangkan apa-apa risiko terhadap keselamatan atau kesihatan yang mungkin ditimbulkan oleh reka bentuk atau loji itu."],"p":"V"},{"ref":"s.20(3)","sec":"20","title":"Kewajipan am pengilang, dsb. berkenaan dengan loji bagi kegunaan semasa bekerja","gist":"Orang yang mendirikan atau memasang loji mesti memastikan cara pemasangan tidak menjadikannya tidak selamat.","verbatim":["(3) Adalah menjadi kewajipan seseorang yang membina atau memasang apa-apa loji bagi kegunaan orang-orang semasa bekerja untuk memastikan, setakat yang praktik, bahawa tiada apa-apa mengenai cara loji itu dibina atau dipasang menjadikannya tidak selamat atau suatu risiko kepada kesihatan apabila digunakan dengan sepatutnya."],"p":"V"},{"ref":"s.21(1)","sec":"21","title":"Kewajipan am pengilang, dsb., berkenaan dengan bahan bagi kegunaan semasa bekerja","gist":"Penggubal, pengilang, pengimport atau pembekal bahan mesti: (a) memastikan bahan selamat apabila digunakan dengan betul; (b) menjalankan ujian dan pemeriksaan; (c) menyediakan maklumat keputusan ujian dan syarat penggunaan selamat (cth. SDS); (d) memberi maklumat terkini jika ada risiko serius baharu.","verbatim":["(1) Adalah menjadi kewajipan seseorang yang merumuskan, mengilang, mengimport atau membekalkan apa-apa bahan bagi kegunaan semasa bekerja—","(a) untuk memastikan, setakat yang praktik, bahawa bahan itu selamat dan tanpa risiko terhadap kesihatan apabila digunakan dengan sepatutnya;","(b) untuk menjalankan atau mengaturkan supaya dijalankan apa-apa ujian dan pemeriksaan yang perlu bagi pelaksanaan kewajipan yang dikenakan ke atasnya oleh perenggan (a);","(c) untuk mengambil apa-apa langkah yang perlu untuk memastikan bahawa akan boleh didapati berkaitan dengan penggunaan bahan itu semasa bekerja maklumat yang memadai mengenai hasil apa-apa ujian yang relevan yang telah dijalankan ke atas atau berkaitan dengan bahan dan mengenai apa-apa keadaan yang perlu untuk memastikan bahawa bahan itu selamat dan tanpa risiko kepada kesihatan apabila digunakan dengan sepatutnya; dan","(d) untuk mengambil apa-apa langkah yang perlu bagi menjamin, setakat yang boleh dipraktikkan, bahawa orang yang dibekalkan dengan bahan itu diberikan semua kajian semula terhadap maklumat yang diberikan kepada mereka di bawah perenggan (c) sebagaimana yang perlu oleh sebab telah diketahui bahawa terdapat risiko baharu yang boleh menimbulkan risiko yang serius kepada keselamatan atau kesihatan."],"p":"V"},{"ref":"s.21(2)","sec":"21","title":"Kewajipan am pengilang, dsb., berkenaan dengan bahan bagi kegunaan semasa bekerja","gist":"Penggubal dan pengilang bahan mesti membuat penyelidikan untuk menghapus atau mengurangkan risiko bahan itu.","verbatim":["(2) Adalah menjadi kewajipan seseorang yang mengusahakan perumusan atau pengilangan apa-apa bahan bagi kegunaan semasa bekerja untuk menjalankan atau mengaturkan supaya dijalankan apa-apa penyelidikan yang perlu dengan tujuan agar ditemui dan, setakat yang praktik, dihapuskan atau dikurangkan apa-apa risiko kepada keselamatan atau kesihatan yang mungkin ditimbulkan oleh bahan itu."],"p":"V"},{"ref":"s.22(1)","sec":"22","title":"Huraian seksyen 20 dan 21","gist":"Tidak perlu mengulang ujian atau penyelidikan yang telah dibuat orang lain jika munasabah untuk bergantung pada keputusannya.","verbatim":["(1) Tiada apa-apa jua dalam seksyen 20 atau 21 boleh diertikan sebagai menghendaki seseorang mengulangi apa-apa ujian, pemeriksaan atau penyelidikan yang telah dijalankan selain daripada olehnya atau atas kehendaknya, setakat, yang munasabah baginya untuk bergantung pada keputusan ujian, pemeriksaan atau penyelidikan itu bagi maksud seksyen itu."],"p":"V"},{"ref":"s.22(2)","sec":"22","title":"Huraian seksyen 20 dan 21","gist":"Kewajipan Bahagian ini hanya meliputi perkara dalam perniagaan atau aktiviti sendiri (untung atau tidak) dan dalam kawalannya.","verbatim":["(2) Apa-apa kewajipan yang dikenakan ke atas seseorang oleh mana-mana peruntukan Bahagian ini yang terdahulu daripada ini hendaklah hanya meliputi perkara-perkara yang dilakukan dalam perjalanan perdagangan, perniagaan atau apa-apa pengusahaan lain yang dijalankan olehnya, sama ada untuk mendapat keuntungan atau tidak, dan kepada perkara-perkara dalam kawalannya."],"p":"V"},{"ref":"s.22(3)","sec":"22","title":"Huraian seksyen 20 dan 21","gist":"Jika pembeli memberi aku janji bertulis untuk mengambil langkah keselamatan, kewajipan pembekal di bawah s.20(1)(a) dan s.21(1)(a) dikurangkan setakat yang munasabah.","verbatim":["(3) Jika seseorang mereka bentuk, merumuskan, mengilang, mengimport atau membekalkan apa-apa loji atau bahan bagi atau kepada orang lain berdasarkan aku janji bertulis oleh orang lain itu untuk mengambil langkah-langkah tertentu yang memadai untuk memastikan, setakat yang praktik, bahawa loji atau bahan itu selamat dan tanpa risiko kepada kesihatan apabila digunakan dengan sepatutnya, aku janji itu hendaklah mempunyai kesan membebaskan orang yang mula-mula disebut itu daripada kewajipan yang dikenakan oleh perenggan 20(1)(a) dan perenggan 21(l)(a) setakat yang munasabah memandangkan terma-terma aku janji itu."],"p":"V"},{"ref":"s.22(4)","sec":"22","title":"Huraian seksyen 20 dan 21","gist":"Bagi sewa beli, jualan bersyarat atau jualan kredit, pembekal sebenar (bukan syarikat kewangan) yang menanggung kewajipan.","verbatim":["(4) Jika seseorang (kemudian daripada ini disebut “pembekal zahir”) membekalkan apa-apa loji atau bahan bagi kegunaan semasa bekerja kepada orang lain (kemudian daripada ini disebut “pelanggan”) di bawah perjanjian sewa-beli, perjanjian jualan bersyarat atau perjanjian jualan secara kredit, dan pembekal zahir itu—","(a) menjalankan perniagaan pembiayaan pemerolehan barang-barang oleh orang lain melalui perjanjian-perjanjian itu; dan","(b) dalam perjalanan perniagaan itu memperolehi kepentingannya dalam loji atau bahan yang dibekalkan kepada pelanggan itu sebagai cara pembiayaan pemerolehannya oleh pelanggan itu daripada pihak ketiga (kemudian daripada ini disebut “pembekal efektif”), pembekal efektif itu dan bukan pembekal zahir itu hendaklah dikira bagi maksud Bahagian ini membekalkan loji atau bahan itu kepada pelanggan itu, dan apa-apa kewajipan yang dikenakan oleh seksyen 20 dan 21 ke atas pembekal hendaklah dengan itu terletak pada pembekal efektif dan tidak pada pembekal zahir."],"p":"V"},{"ref":"s.22(5)","sec":"22","title":"Huraian seksyen 20 dan 21","gist":"Penggunaan yang tidak mengikut maklumat atau nasihat pembekal tidak dianggap \"penggunaan betul\".","verbatim":["(5) Bagi maksud Bahagian ini sesuatu loji atau bahan tidaklah dikira sebagai digunakan dengan sepatutnya jika ia digunakan tanpa mengambil kira apa-apa maklumat atau nasihat yang relevan berhubungan dengan penggunaannya yang telah dijadikan tersedia oleh seseorang yang mereka bentuk, mengilang, mengimport atau membekalkannya."],"p":"V"},{"ref":"s.23","sec":"23","title":"Penalti bagi kesalahan di bawah seksyen 20 atau 21","gist":"[DIPINDA 2024] Penalti melanggar s.20 atau 21: hingga RM200,000 atau 2 tahun atau kedua-duanya (dahulu RM20,000).","verbatim":["Seseorang yang melanggar peruntukan seksyen 20 atau 21 adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi dua ratus ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"V"},{"ref":"s.24(1)(a)","sec":"24","title":"Kewajipan am pekerja yang sedang bekerja","gist":"Pekerja mesti menjaga keselamatan dan kesihatan diri sendiri dan orang lain yang terjejas oleh perbuatan atau peninggalannya.","verbatim":["(1) Adalah menjadi kewajipan tiap-tiap pekerja yang sedang bekerja—","(a) untuk memberikan perhatian yang munasabah bagi keselamatan dan kesihatan dirinya dan orang lain yang mungkin terjejas oleh tindakan atau peninggalannya semasa bekerja;"],"p":"VI"},{"ref":"s.24(1)(b)","sec":"24","title":"Kewajipan am pekerja yang sedang bekerja","gist":"Bekerjasama dengan majikan atau orang lain dalam melaksanakan kewajipan di bawah Akta dan peraturan.","verbatim":["(1) Adalah menjadi kewajipan tiap-tiap pekerja yang sedang bekerja—","(b) untuk bekerjasama dengan majikannya atau mana-mana orang lain dalam menunaikan apa-apa kewajipan atau kehendak yang dikenakan ke atas majikan atau orang lain itu melalui Akta ini atau mana-mana peraturan yang dibuat di bawahnya;"],"p":"VI"},{"ref":"s.24(1)(c)","sec":"24","title":"Kewajipan am pekerja yang sedang bekerja","gist":"Memakai atau menggunakan pada setiap masa kelengkapan atau pakaian pelindung (PPE) yang disediakan majikan.","verbatim":["(1) Adalah menjadi kewajipan tiap-tiap pekerja yang sedang bekerja—","(c) untuk memakai atau menggunakan pada sepanjang masa apa-apa kelengkapan atau pakaian perlindungan yang diadakan oleh majikan bagi maksud mencegah apa-apa risiko kepada keselamatan dan kesihatannya; dan"],"p":"VI"},{"ref":"s.24(1)(d)","sec":"24","title":"Kewajipan am pekerja yang sedang bekerja","gist":"Mematuhi arahan atau langkah KKP yang ditetapkan majikan atau orang lain di bawah Akta.","verbatim":["(1) Adalah menjadi kewajipan tiap-tiap pekerja yang sedang bekerja—","(d) untuk mematuhi apa-apa arahan atau langkah tentang keselamatan dan kesihatan pekerjaan yang diperkenalkan oleh majikannya atau mana-mana orang lain melalui atau di bawah Akta ini atau mana-mana peraturan yang dibuat di bawahnya."],"p":"VI"},{"ref":"s.24(2)","sec":"24","title":"Kewajipan am pekerja yang sedang bekerja","gist":"[DIPINDA 2024] Penalti: hingga RM2,000 atau 3 bulan atau kedua-duanya (dahulu RM1,000).","verbatim":["(2) Seseorang yang melanggar peruntukan seksyen ini adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi dua ribu ringgit atau dipenjarakan selama tempoh tidak melebihi tiga bulan atau kedua-duanya."],"p":"VI"},{"ref":"s.25","sec":"25","title":"Kewajipan untuk tidak mengganggu atau menyalahgunakan benda yang diadakan menurut peruntukan tertentu","gist":"Sesiapa yang dengan sengaja, melulu atau cuai mengganggu atau menyalahgunakan apa-apa yang disediakan untuk keselamatan, kesihatan dan kebajikan (cth. pengadang mesin, pemadam api): hingga RM20,000 atau 2 tahun atau kedua-duanya.","verbatim":["Seseorang yang dengan sengaja, melulu atau cuai mengganggu atau menyalahgunakan apa-apa jua yang diadakan atau dilakukan untuk kepentingan keselamatan, kesihatan dan kebajikan menurut Akta ini adalah melakukan suatu kesalahan dan, apabila disabitkan, boleh didenda tidak melebihi dua puluh ribu ringgit atau dipenjarakan selama tempoh tidak melebihi dua tahun atau kedua-duanya."],"p":"VI"},{"ref":"s.26","sec":"26","title":"Kewajipan untuk tidak mengenakan caj ke atas pekerja bagi benda yang dilakukan atau diadakan","gist":"Majikan tidak boleh mengenakan bayaran kepada pekerja bagi apa-apa yang dibuat atau disediakan di bawah Akta atau peraturan (cth. PPE, latihan, pengawasan perubatan).","verbatim":["Tiada majikan boleh melevi atau membenarkan untuk dilevi ke atas mana-mana pekerjanya apa-apa caj berkenaan dengan apa-apa jua yang dilakukan atau diadakan menurut Akta ini atau mana-mana peraturan yang dibuat di bawahnya."],"p":"VI"},{"ref":"s.26A(1)","sec":"26A
